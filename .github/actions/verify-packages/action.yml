name: Verify installed packages
description: Run the production tarball verifier and retain timings for queue, scheduled and manual checks
inputs:
  selection:
    description: ci for trusted selection, all, or comma-separated independent package names
    default: all
  source-tests:
    description: Run isolated source suites in addition to installed consumers
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: node scripts/ci/npm-ci.mjs
    - name: Verify independent package tarballs
      shell: bash
      env:
        PACKAGE_SELECTION: ${{ inputs.selection }}
        SOURCE_TESTS: ${{ inputs.source-tests }}
      run: |
        set -euo pipefail
        args=()
        case "$PACKAGE_SELECTION" in
          ci) args+=(--ci) ;;
          all) ;;
          *) args+=("--packages=$PACKAGE_SELECTION") ;;
        esac
        case "$SOURCE_TESTS" in
          true) ;;
          false) args+=(--skip-tests) ;;
          *) echo "Invalid source-tests input: $SOURCE_TESTS" >&2; exit 1 ;;
        esac
        npm run check:packages -- "${args[@]}"
    - name: Upload package verification timings
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: package-verification
        path: test-results/package-verification.json
        if-no-files-found: ignore
        retention-days: 14
