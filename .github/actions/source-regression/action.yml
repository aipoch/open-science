name: Source desktop regression
description: Shared supplemental Electron execution for PRs and scheduled main verification
inputs:
  group:
    description: Supplemental suite (regressions, capacity or delegation)
    required: true
  include-capacity:
    description: Include nightly capacity profiling ('true' or 'false'; every caller sets it)
    default: 'true'
  shard:
    description: Optional ordinary regression shard (1/3, 2/3 or 3/3)
    default: ''
runs:
  using: composite
  steps:
    - name: Validate suite
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
      run: |
        case "$GROUP" in
          regressions|capacity|delegation) ;;
          *) echo "Unsupported supplemental suite: $GROUP" >&2; exit 1 ;;
        esac
    - name: Install headless Chromium
      if: inputs.group == 'regressions' || inputs.group == 'capacity'
      shell: bash
      run: npx playwright install chromium --only-shell
    # Separate output directories retain the first suite's traces/screenshots when a scheduled
    # runner executes the second suite in the same workspace.
    - name: Run supplemental regressions
      if: inputs.group == 'regressions' || inputs.group == 'capacity'
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        SHARD: ${{ inputs.shard }}
        INCLUDE_CAPACITY: ${{ inputs.include-capacity }}
        PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/regressions_macos
        PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/regressions_macos.json
      run: |
        args=()
        regression_timeout=1200000
        case "$INCLUDE_CAPACITY" in
          # Preserve unsharded callers; complete scheduled runs now isolate capacity and shards.
          true) regression_timeout=4500000 ;;
          false) args+=(--grep-invert '@capacity') ;;
          *) echo "Invalid capacity selection" >&2; exit 1 ;;
        esac
        if [[ "$GROUP" == capacity ]]; then
          args=(--grep '@capacity')
          regression_timeout=1800000
          [[ -z "$SHARD" ]] || { echo 'Capacity must not use regression shards' >&2; exit 1; }
        elif [[ -n "$SHARD" ]]; then
          case "$SHARD" in
            1/3|2/3|3/3) args+=(--shard="$SHARD"); regression_timeout=1800000 ;;
            *) echo 'Invalid regression shard' >&2; exit 1 ;;
          esac
        fi
        npm run test:e2e:regressions -- --fail-on-flaky-tests --global-timeout="$regression_timeout" --output=test-results/regressions_macos "${args[@]}"
    - name: Run supplemental delegation
      if: inputs.group == 'delegation'
      shell: bash
      env:
        PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/delegation_macos
        PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/delegation_macos.json
      run: npm run test:e2e:delegation -- --fail-on-flaky-tests --global-timeout=1200000 --output=test-results/delegation_macos
