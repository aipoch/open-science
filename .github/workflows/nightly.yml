name: Nightly

# Batch main into one build per hour. A newer scheduled build may supersede an older build, while
# publication is delegated to nightly-publish.yml and is never cancelled once it starts.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Focused no-side-effect validation plan
        required: false
        default: full
        type: choice
        options:
          - full
          - runtime-source
          - macos-x64

# Build and publication preparation run without write access. Only the separate workflow_run
# publisher receives contents:write, and it never checks out or executes the triggering revision.
permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  plan:
    name: Check for unpublished main changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Compare main with the rolling nightly tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$published" != "$GITHUB_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Nightly already points at $GITHUB_SHA; there is no new batch to build."
          fi

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && inputs.dry_run != 'runtime-source'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      nightly: true
      # A manual `macos-x64` dispatch runs only the Intel packaging job (the heap-sensitive Vite
      # renderer build) and skips verify. Smoke, certification, and publish stay skipped below.
      skip_verify: ${{ inputs.dry_run == 'macos-x64' }}
      platform_name: ${{ inputs.dry_run == 'macos-x64' && 'macos-x64' || '' }}

  # Scheduled coverage remains advisory during burn-in and is deliberately absent from prepare.needs.
  # A manual `runtime-source` dispatch runs this exact reusable job as a blocking focused dry-run while
  # build/package/publish preparation stay skipped.
  runtime-certification:
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && inputs.dry_run != 'macos-x64'
    uses: ./.github/workflows/runtime-certification.yml
    with:
      allow_failure: ${{ github.event_name != 'workflow_dispatch' }}

  package-smoke:
    needs: build
    if: inputs.dry_run != 'macos-x64'
    uses: ./.github/workflows/package-smoke.yml

  # Run advisory desktop behavior checks inside the same read-only Nightly run. Failures remain
  # visible and independently rerunnable, but do not gate preparation or publication.
  regression:
    needs: [build, package-smoke]
    uses: ./.github/workflows/desktop-regression.yml
    with:
      allow_failure: true

  # Aggregate and checksum on the low-privilege build run. A manual Nightly stops here, making this
  # the focused no-side-effect dry-run; a successful schedule hands these prepared files to the
  # separate publisher as artifacts, never as executable code.
  prepare:
    name: Prepare nightly publish artifact
    needs: [plan, build, package-smoke]
    if: needs.build.result == 'success' && needs.package-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate release certification evidence
        run: >-
          node scripts/ci/release-certification-evidence.mjs aggregate
          --directory artifacts
          --output artifacts/RELEASE-CERTIFICATION.json
          --expected-sha "$GITHUB_SHA"

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Upload prepared nightly metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-ready
          retention-days: 1
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json
          if-no-files-found: error
