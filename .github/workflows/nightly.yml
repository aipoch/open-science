name: Nightly

# Batch main into one build per day, skipping heads that the last successful scheduled build
# already covered and that the rolling nightly tag already publishes. A newer scheduled build may
# supersede an older build, while publication is delegated to nightly-publish.yml and is never
# cancelled once it starts.
# Scheduled failures open or refresh a tracking issue labelled ci-scheduled-failure.
on:
  schedule:
    - cron: '17 15 * * *' # UTC; overnight in Asia/Singapore
  workflow_dispatch:
    inputs:
      dry_run:
        description: Focused no-side-effect validation plan
        required: false
        default: full
        type: choice
        options:
          - full
          - runtime-source
          - macos-x64
          - linux-cli

# Build and publication preparation run without write access. Only the separate workflow_run
# publisher receives contents:write, and it never checks out or executes the triggering revision.
permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-build-${{ github.event_name }}${{ inputs.dry_run == 'linux-cli' && '-linux-cli' || '' }}
  cancel-in-progress: true

jobs:
  # Skip when the last successful scheduled Nightly already built this head. Whether the rolling
  # tag has been advanced is decided separately by nightly-publish.yml.
  plan:
    name: Check for unbuilt main changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout skip check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/skip-unchanged-scheduled
          sparse-checkout-cone-mode: false
      - name: Compare main with the last successful scheduled build
        id: decide
        uses: ./.github/actions/skip-unchanged-scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          workflow-file: nightly.yml
          require-published-ref: nightly

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && inputs.dry_run != 'runtime-source'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      nightly: true
      # A manual `macos-x64` dispatch runs only the Intel packaging job (the heap-sensitive Vite
      # renderer build) and skips verify. The linux-cli dry-run builds and smoke-tests Linux only;
      # unrelated certification and publication preparation stay skipped.
      skip_verify: ${{ inputs.dry_run == 'macos-x64' || inputs.dry_run == 'linux-cli' }}
      platform_name: ${{ inputs.dry_run == 'macos-x64' && 'macos-x64' || inputs.dry_run == 'linux-cli' && 'linux-x64' || '' }}

  # Scheduled coverage is advisory for the build only: it stays absent from prepare.needs so artifacts
  # and evidence remain diagnosable, but nightly-publish.yml refuses to roll the tag unless every
  # runtime-certification job succeeded. A manual `runtime-source` dispatch runs this exact reusable
  # job as a blocking focused dry-run while build/package/publish preparation stay skipped.
  runtime-certification:
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && inputs.dry_run != 'macos-x64' && inputs.dry_run != 'linux-cli'
    uses: ./.github/workflows/runtime-certification.yml
    with:
      # Scheduled failures keep the build green so prepare still runs; publication gates on them.
      allow_failure: ${{ github.event_name != 'workflow_dispatch' }}

  package-smoke:
    needs: build
    if: inputs.dry_run != 'macos-x64'
    uses: ./.github/workflows/package-smoke.yml
    with:
      platform_name: ${{ inputs.dry_run == 'linux-cli' && 'linux-x64' || '' }}

  # Run desktop behavior checks inside the same read-only Nightly run. Failures keep the build green
  # and independently rerunnable so artifacts stay diagnosable, but nightly-publish.yml refuses to
  # roll the tag unless every regression job succeeded.
  regression:
    needs: [build, package-smoke]
    if: inputs.dry_run != 'linux-cli'
    uses: ./.github/workflows/desktop-regression.yml
    with:
      # Advisory for the build only; publication gates on the real job conclusions.
      allow_failure: true

  # Aggregate and checksum on the low-privilege build run. A manual Nightly stops here, making this
  # the focused no-side-effect dry-run; a successful schedule hands these prepared files to the
  # separate publisher as artifacts, never as executable code.
  prepare:
    name: Prepare nightly publish artifact
    needs: [plan, build, package-smoke]
    if: needs.build.result == 'success' && needs.package-smoke.result == 'success' && inputs.dry_run != 'linux-cli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate release certification evidence
        run: >-
          node scripts/ci/release-certification-evidence.mjs aggregate
          --directory artifacts
          --output artifacts/RELEASE-CERTIFICATION.json
          --expected-sha "$GITHUB_SHA"

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Upload prepared nightly metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-ready
          retention-days: 1
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json
          if-no-files-found: error

  # Scheduled failures open or refresh one tracking issue; a later scheduled success closes it.
  report:
    name: Report scheduled outcome
    needs: [plan, build, runtime-certification, package-smoke, regression, prepare]
    if: ${{ always() && github.event_name == 'schedule' }}
    # Reporting must never turn a publishable Nightly into a failed workflow_run for the publisher.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/report-scheduled-failure.mjs
            scripts/ci/nightly-publish-gates.mjs
          sparse-checkout-cone-mode: false
      # runtime-certification and regression are advisory, so their caller results stay successful
      # even when a child job failed. Inspect the nested conclusions so those failures are tracked.
      - name: Detect advisory job failures
        id: advisory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | {name, conclusion}' | jq -s . > "$RUNNER_TEMP/nightly-jobs.json"
          node scripts/ci/nightly-publish-gates.mjs --jobs "$RUNNER_TEMP/nightly-jobs.json" --report
      - name: Open, refresh, or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CONCLUSION: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || steps.advisory.outputs.ok != 'true') && 'failure' || 'success' }}
        with:
          script: |
            const { reportScheduledOutcome } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/report-scheduled-failure.mjs`)
            await reportScheduledOutcome({
              github,
              repo: context.repo,
              workflowFile: 'nightly.yml',
              workflowName: context.workflow,
              runId: context.runId,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: context.sha,
              conclusion: process.env.CONCLUSION,
              log: core.info
            })
