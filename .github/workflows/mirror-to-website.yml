# Manually mirror a published GitHub Release to the website's S3-compatible storage + CDN after its
# repository-owned in-app release notes are ready. This workflow sends
# installers to a fast, in-country endpoint and writes version.json (website + in-app update prompt).
# Cache correctness is handled purely via Cache-Control headers at upload time (immutable installers,
# no-cache manifest) — no CDN purge API is needed.
name: Mirror to website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g. v0.1.2)'
        required: true
      dry_run:
        description: 'Run local release transforms without AWS credentials or uploads'
        required: false
        type: boolean
        default: false

# Only needs to read Release assets; it never writes back to the repo.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the manifest script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tag comes from the required manual input; version is the tag without a leading 'v'.
      - name: Resolve tag and version
        id: ref
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "No tag resolved from event or input" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Pull every installer + SHA256SUMS.txt for the tag. GH_TOKEN authenticates gh with the repo.
      - name: Download release assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.ref.outputs.tag }}" --repo "${{ github.repository }}" --dir dist-assets

      # A dry-run exercises the real manifest/feed transforms without downloading every installer.
      # SHA256SUMS and updater feeds are small; sparse files reproduce each installer's published name
      # and size from GitHub's read-only asset metadata, which is all the manifest generator consumes.
      - name: Stage release metadata for dry run
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist-assets \
            --pattern 'SHA256SUMS.txt' --pattern '*.yml'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, (.size | tostring)] | @tsv' |
          while IFS=$'\t' read -r name size; do
            case "$name" in
              *-mac-arm64.dmg|*-mac-x64.dmg|*-win-x64-setup.exe|*-linux-x64.AppImage|*_amd64.deb)
                [ "$name" = "$(basename "$name")" ] || { echo "Unsafe asset name: $name" >&2; exit 1; }
                truncate -s "$size" "dist-assets/$name"
                ;;
            esac
          done

      # NsisUpdater replaces the version in the new installer URL to resolve the old blockmap. Stage all
      # published stable Windows blockmaps for their own immutable version directories so a backfill also
      # repairs releases mirrored before differential compatibility was enforced.
      - name: Collect historical Windows blockmaps
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          blockmap_index="$RUNNER_TEMP/historical-windows-blockmaps.tsv"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | . as $release | select($release.tag_name | startswith("v")) | .assets[] | select(.name | test("-win-x64-setup\\.exe\\.blockmap$"; "i")) | [$release.tag_name, (.id | tostring), .name] | @tsv' \
            > "$blockmap_index"

          while IFS=$'\t' read -r tag asset_id name; do
            [ "$tag" = "$CURRENT_TAG" ] && continue
            version="${tag#v}"
            if [[ ! "$version" =~ ^[0-9A-Za-z.+-]+$ || "$name" != "$(basename "$name")" ]]; then
              echo "Unsafe historical release tag: $tag" >&2
              exit 1
            fi
            target="historical-blockmaps/$version/$name"
            mkdir -p "$(dirname "$target")"
            [ ! -e "$target" ] || { echo "Duplicate historical blockmap: $target" >&2; exit 1; }
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$target"
            gzip -t "$target"
          done < "$blockmap_index"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install manifest dependencies
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund

      # Build version.json from the downloaded files. Missing platforms warn (not fail) inside the
      # script, so a partial release still yields a usable manifest. In-app notes come from the
      # checked-out repository revision; the publication date still comes from the Release so a
      # manual workflow_dispatch backfill gets the authoritative timestamp.
      - name: Generate version.json
        env:
          DIST_DIR: dist-assets
          OUTPUT: version.json
          VERSION: ${{ steps.ref.outputs.version }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          NOTES_DIR: release-notes/${{ steps.ref.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if [ ! -d "$NOTES_DIR" ]; then
            NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            unset NOTES_DIR
            export NOTES
          fi
          RELEASE_DATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          export RELEASE_DATE
          node scripts/generate-version-manifest.mjs

      # electron-updater feed files (win latest.yml, linux latest-linux.yml, and the per-arch mac
      # feeds arm64-mac.yml / x64-mac.yml) must live at the channel root (a stable url the updater
      # always polls), but the installers + blockmaps they reference live under releases/<version>/.
      # Rewrite each feed's bare `path:`/`url:` filenames to that versioned subpath so the updater
      # resolves them against the channel root. Missing feeds (e.g. a mac-only backfill) are skipped.
      - name: Rewrite update feed paths
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          shopt -s nullglob
          for yml in dist-assets/latest.yml dist-assets/latest-linux.yml dist-assets/*-mac.yml; do
            [ -f "$yml" ] || continue
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const version = process.env.VERSION;
              const text = fs.readFileSync(file, "utf8").replace(
                /^(\s*(?:- )?(?:path|url):\s*)(?!https?:|releases\/)([^\s].*)$/gm,
                (_m, prefix, name) => `${prefix}releases/${version}/${name}`
              );
              fs.writeFileSync(file, text);
              process.stdout.write(text);
            ' "$yml"
          done

      # electron-builder never writes releaseNotes into the feeds, so already-installed clients (which
      # read update notes only from the feed) show an empty "What's new" and only a GitHub link. Inject
      # the same condensed notes version.json carries into each feed's releaseNotes. inject-feed-notes
      # parses + re-serializes with js-yaml (never hand-writes YAML) and re-parses its own output, so a
      # malformed feed fails the job here — before any upload — rather than reaching the installed base.
      # js-yaml comes from the committed lockfile installed above with package scripts disabled.
      - name: Inject release notes into update feeds
        run: |
          shopt -s nullglob
          feeds=()
          for yml in dist-assets/latest.yml dist-assets/latest-linux.yml dist-assets/*-mac.yml; do
            [ -f "$yml" ] && feeds+=("$yml")
          done
          if [ ${#feeds[@]} -eq 0 ]; then
            echo "no update feeds present, skipping notes injection"
            exit 0
          fi
          node scripts/inject-feed-notes.mjs version.json "${feeds[@]}"

      - name: Summarize dry run
        if: ${{ inputs.dry_run }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const locales = Object.keys(manifest.localizedNotes ?? {}).sort();
            console.log(`dry-run manifest: version=${manifest.version}`);
            console.log(`dry-run downloads: ${Object.keys(manifest.downloads).sort().join(", ")}`);
            console.log(`dry-run localized notes: ${locales.join(", ") || "none"}`);
          '

      # Credentials + region are configured only after dependency installation and every local
      # manifest/feed transformation succeeds. The region lets aws-cli resolve the S3 endpoint.
      - name: Configure AWS credentials
        if: ${{ !inputs.dry_run }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
        run: |
          aws configure set aws_access_key_id "$S3_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$S3_SECRET_ACCESS_KEY"
          aws configure set default.region "$S3_REGION"

      - name: Backfill historical Windows blockmaps
        if: ${{ !inputs.dry_run }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: |
          [ -d historical-blockmaps ] || exit 0
          while IFS= read -r -d '' blockmap; do
            version="$(basename "$(dirname "$blockmap")")"
            aws s3 cp "$blockmap" \
              "s3://$S3_BUCKET/$S3_PREFIX/releases/$version/$(basename "$blockmap")" \
              --cache-control "public, max-age=31536000, immutable" --only-show-errors
          done < <(find historical-blockmaps -type f -name '*-win-x64-setup.exe.blockmap' -print0)

      # Installers go to an immutable, per-version path: re-running the same tag overwrites identical
      # bytes (idempotent backfill). The immutable Cache-Control lets the CDN/browsers cache these
      # large files forever without any purge. version.json is excluded here and published separately
      # as the one mutable object. Bucket is a secret so it stays masked in the public Actions log, and
      # --only-show-errors suppresses the per-file `upload: ... to s3://...` lines that would leak it.
      - name: Sync installers to versioned path
        if: ${{ !inputs.dry_run }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          aws s3 sync dist-assets/ \
            "s3://$S3_BUCKET/$S3_PREFIX/releases/$VERSION/" --exclude "version.json" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors

      # The single mutable manifest, overwritten on every release; website + app read this path. no-cache
      # keeps the CDN/browsers revalidating so a new version is picked up immediately without a purge.
      - name: Upload version.json
        if: ${{ !inputs.dry_run }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: |
          aws s3 cp version.json \
            "s3://$S3_BUCKET/$S3_PREFIX/version.json" \
            --cache-control "no-cache" --content-type "application/json" --only-show-errors

      # Publish the rewritten feeds to the channel root as mutable, no-cache objects (same policy as
      # version.json), so the updater always sees the latest version immediately.
      - name: Upload update feed to channel root
        if: ${{ !inputs.dry_run }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: |
          shopt -s nullglob
          for yml in dist-assets/latest.yml dist-assets/latest-linux.yml dist-assets/*-mac.yml; do
            [ -f "$yml" ] || continue
            aws s3 cp "$yml" "s3://$S3_BUCKET/$S3_PREFIX/$(basename "$yml")" \
              --cache-control "no-cache" --content-type "text/yaml" --only-show-errors
          done
