name: Web Tools Development Acceptance

# Explicit development validation against public pages. This neither approves provider terms
# nor certifies supported target networks, and is not part of automatic release gating.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tools-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Build Electron test application
        run: npm run build:e2e
      - name: Run Web development journeys
        run: npm run test:e2e:web-tools -- --fail-on-flaky-tests
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-tools-development-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
