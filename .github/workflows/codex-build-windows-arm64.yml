name: Codex build Windows arm64 host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked
      - name: Build Windows arm64 host
        run: >-
          cargo xwin build --locked --release
          --target aarch64-pc-windows-msvc
          --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sandbox-host-arm64
          path: packages/notebook-network-sandbox/vendor/windows-src/target/aarch64-pc-windows-msvc/release/notebook-appcontainer-host.exe
