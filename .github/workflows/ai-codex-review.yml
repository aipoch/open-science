name: Reusable Codex PR Review

on:
  workflow_call:
    inputs:
      dry_run:
        description: Isolate diagnostic runs from production review cancellation
        required: false
        default: false
        type: boolean
      auth_mode:
        description: Preferred authentication mode (subscription or api-key)
        required: true
        type: string
      scope:
        description: Legacy caller compatibility; ignored by the combined reviewer
        required: false
        default: review
        type: string
      pull_request_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      review_sha:
        required: true
        type: string
      review_state:
        required: true
        type: string
      review_event:
        required: true
        type: string
      pull_request_title:
        required: true
        type: string
      is_fork:
        required: true
        type: boolean
      fork_mode:
        required: true
        type: string
      model:
        required: true
        type: string
      effort:
        required: true
        type: string
    secrets:
      CODEX_AUTH_JSON:
        required: false
      OPENAI_API_KEY:
        required: false
      CODEX_BASE_URL:
        required: false
    outputs:
      review_body:
        description: Normalized review comment body
        value: ${{ jobs.result.outputs.review_body }}
      pr_number:
        description: Reviewed pull request number
        value: ${{ inputs.pull_request_number }}
      head_sha:
        description: Reviewed pull request head SHA
        value: ${{ inputs.head_sha }}

concurrency:
  group: ${{ format('codex-review-{0}{1}', inputs.pull_request_number, inputs.dry_run && '-dry-run' || '') }}
  cancel-in-progress: true

jobs:
  review:
    name: Primary review
    permissions:
      contents: read
    uses: ./.github/workflows/ai-codex-review-attempt.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      auth_mode: ${{ inputs.auth_mode }}
      scope: ${{ inputs.scope }}
      pull_request_number: ${{ inputs.pull_request_number }}
      head_ref: ${{ inputs.head_ref }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      review_sha: ${{ inputs.review_sha }}
      review_state: ${{ inputs.review_state }}
      review_event: ${{ inputs.review_event }}
      pull_request_title: ${{ inputs.pull_request_title }}
      is_fork: ${{ inputs.is_fork }}
      fork_mode: ${{ inputs.fork_mode }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}

  api_fallback:
    name: API fallback
    needs: review
    if: ${{ needs.review.outputs.retry_api == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ai-codex-review-attempt.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      auth_mode: api-key
      scope: ${{ inputs.scope }}
      pull_request_number: ${{ inputs.pull_request_number }}
      head_ref: ${{ inputs.head_ref }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      review_sha: ${{ inputs.review_sha }}
      review_state: ${{ inputs.review_state }}
      review_event: ${{ inputs.review_event }}
      pull_request_title: ${{ inputs.pull_request_title }}
      is_fork: ${{ inputs.is_fork }}
      fork_mode: ${{ inputs.fork_mode }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}

  result:
    name: Select completed review
    needs: [review, api_fallback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      review_body: ${{ steps.select.outputs.review_body }}
    steps:
      - name: Select validated review
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PRIMARY_RESULT: ${{ needs.review.result }}
          PRIMARY_BODY: ${{ needs.review.outputs.review_body }}
          RETRY_API: ${{ needs.review.outputs.retry_api }}
          API_RESULT: ${{ needs.api_fallback.result }}
          API_BODY: ${{ needs.api_fallback.outputs.review_body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fallback = process.env.RETRY_API === 'true';
            const body = fallback ? process.env.API_BODY : process.env.PRIMARY_BODY;
            if (process.env.PRIMARY_RESULT !== 'success' ||
                (fallback ? process.env.API_RESULT !== 'success' : process.env.API_RESULT !== 'skipped') ||
                !body?.trim()) {
              throw new Error('Codex review did not produce a validated result.');
            }
            core.setOutput('review_body', body);
