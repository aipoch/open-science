name: Release

# Stable release: on a version tag (e.g. v0.1.0) build every platform and publish them to a single
# GitHub Release. Also runnable manually from the Actions tab (builds + uploads artifacts; only a
# tag run creates the Release). Nightly builds live in nightly.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_smoke_run_id:
        description: Diagnostic package smoke using an existing Release run; skips build/tests and publication, overriding verify_only.
        type: string
        default: ''
      verify_only:
        description: Verify tests and coverage without building or publishing packages.
        type: boolean
        default: false

# Required to create a Release and upload assets.
permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.package_smoke_run_id }}
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows_runtime_source_changed: ${{ steps.runtime_change.outputs.source_changed }}
      windows_runtime_catalog_changed: ${{ steps.runtime_change.outputs.catalog_changed }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate desktop release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match $expected_tag." >&2
            exit 1
          fi

      - name: Verify release commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Detect Windows runtime changes
        id: runtime_change
        shell: bash
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi
          previous_tag=$(git describe --tags --match 'v*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -z "$previous_tag" ]; then
            source_changed=true
            catalog_changed=true
            echo "No previous version tag found; requiring the reviewed runtime catalog and CDN objects."
          else
            runtime_paths=(
              'packages/notebook-network-sandbox/vendor/windows-runtime/sources.json'
              'packages/notebook-network-sandbox/vendor/windows-runtime/*.patch'
              'packages/notebook-network-sandbox/vendor/windows-runtime/build.ps1'
              'packages/notebook-network-sandbox/vendor/windows-runtime/npm/**'
              'scripts/check-windows-notebook-runtime.mjs'
              'scripts/stage-windows-notebook-components.mjs'
              '.github/actions/windows-notebook-runtime/action.yml'
            )
            source_changed=false
            catalog_changed=false
            if ! git diff --quiet "$previous_tag" "$GITHUB_SHA" -- "${runtime_paths[@]}"; then
              source_changed=true
            fi
            # Upload action pins do not change runtime bytes; retain every other workflow change.
            if ! git diff --quiet \
              --ignore-matching-lines='^[[:space:]]+uses: actions/upload-artifact@[0-9a-f]{40} # v[0-9]+$' \
              "$previous_tag" "$GITHUB_SHA" -- '.github/workflows/windows-notebook-runtime.yml'; then
              source_changed=true
            fi
            if ! git diff --quiet "$previous_tag" "$GITHUB_SHA" -- src/main/notebook/windows-runtime-catalog.json; then
              catalog_changed=true
            fi
            echo "Runtime source changed since $previous_tag: $source_changed"
            echo "Runtime catalog changed since $previous_tag: $catalog_changed"
          fi
          if [ "$source_changed" = true ] && [ "$catalog_changed" != true ]; then
            echo 'Runtime source changed without a catalog update. Run the runtime signing/staging flow, merge the catalog, publish its CDN objects, then create the application tag.' >&2
            exit 1
          fi
          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
          echo "catalog_changed=$catalog_changed" >> "$GITHUB_OUTPUT"

      - name: Verify reviewed Windows runtime CDN objects
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: node scripts/windows-runtime-cdn.mjs check --verify-bytes

  # Build the platform matrix (macOS arm64/x64 + Linux + Windows x64) via the reusable workflow.
  # secrets: inherit forwards the optional signing/notarization secrets. macOS is signed but NOT
  # notarized here — notarization is decoupled into the notarize-mac job below.
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.package_smoke_run_id }}
    needs: release-preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
    with:
      verify_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
      sign_windows: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit

  # Reuse the real package gates on existing Release bytes without rebuilding or publishing.
  # Cross-run diagnostics deliberately emit no release certification for this tooling revision.
  package-smoke-dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_smoke_run_id != '' }}
    uses: ./.github/workflows/package-smoke.yml
    with:
      artifact_run_id: ${{ inputs.package_smoke_run_id }}
      # Diagnostic branches cannot enter the protected signing environment. Tag releases below
      # still require publisher/signature verification; this path only exercises existing packages.
      require_windows_signing: false

  # Exercise the exact uploaded packages in separate native jobs. A failed matrix leg can be retried
  # against the immutable build artifact without repeating installation, packaging, or signing.
  package-smoke:
    if: ${{ !inputs.verify_only }}
    needs: build
    uses: ./.github/workflows/package-smoke.yml
    with:
      require_windows_signing: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

  # Exercise advisory regression in this low-privilege build run and retain its diagnostics without
  # allowing known flakes to override the blocking build + package-smoke result.
  regression:
    needs: [build, package-smoke]
    uses: ./.github/workflows/desktop-regression.yml
    with:
      allow_failure: true

  # Notarize + staple the signed macOS artifacts on their own runner, then re-emit the stapled dmg/zip
  # (overwriting the build's signed-only ones) so publish always attaches a stapled mac build. Kept out
  # of the build matrix so a slow Apple notarization never holds up the platform builds; the job is
  # time-capped and re-runnable (see notarize-mac.yml). No-ops when signing secrets aren't configured.
  notarize-mac:
    needs: [build, package-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/notarize-mac.yml
    secrets: inherit

  # Repack the certified desktop backend after notarization; no second native build/signing path.
  cli-artifacts:
    needs: [build, package-smoke, notarize-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/runtime-packages.yml
    permissions:
      contents: read
      actions: read
    with:
      desktop_run_id: ${{ format('{0}', github.run_id) }}
      include_npm: true

  linux-cli-packages:
    needs: cli-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-cli-packages.yml
    permissions:
      contents: read
      actions: read

  # Collect every platform's artifacts and publish them to the tag's Release in one shot (a single
  # publish job avoids the race of multiple build jobs writing the same Release). Depends on
  # notarize-mac so the mac dmg/zip it downloads are the stapled versions.
  publish:
    needs: [build, package-smoke, notarize-mac, cli-artifacts, linux-cli-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions fully override the workflow-level block, so contents:write is restated
    # alongside the two scopes the SLSA attestation needs: id-token to sign via Sigstore OIDC, and
    # attestations to write the provenance record.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout first (before downloading artifacts): the mac-feed merge step runs a repo script, and
      # actions/checkout cleans the working dir, which would wipe a pre-downloaded artifacts/.
      - name: Checkout (for the mac-feed merge script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin the release transform scripts to the repo's Node line instead of the runner default.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install release transform dependencies
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # npm reports share target filenames with CLI reports; keep them isolated.
          pattern: '!npm-*'
          path: artifacts
          merge-multiple: true # flatten every platform's files into one directory

      - name: Verify standalone release archive set
        run: node scripts/runtime-archives.mjs verify artifacts

      - name: Verify Linux CLI package set
        run: node scripts/linux-cli-packages.mjs verify artifacts "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"

      # Fail closed unless every native target reports package evidence for this exact tag commit.
      # P0 and visual regression run independently as advisory Desktop Regression checks.
      - name: Aggregate release certification evidence
        run: >-
          node scripts/ci/release-certification-evidence.mjs aggregate
          --directory artifacts
          --output artifacts/RELEASE-CERTIFICATION.json
          --expected-sha "$GITHUB_SHA"
          --require-signed-windows

      # Merge build or post-notarization feeds; partial mac artifacts fail before publication.
      - name: Merge mac update feed
        run: node scripts/merge-mac-feed.mjs artifacts

      # One SHA256SUMS.txt covering all installers so users can verify downloads.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm *.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      # Sign a SLSA build-provenance attestation for the exact installer bytes about to be published,
      # so users can prove each download was built by this workflow from this commit (verify with
      # `gh attestation verify <file> --repo <owner>/<repo>`). SHA256SUMS.txt is excluded — it's a
      # digest list, not a build product. The attestation lives in the repo's Attestations, not as a
      # Release asset, so it doesn't clutter the download list.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/open-science-cli-*.tar.gz

      # Set the final body before GitHub emits the release event consumed by Zenodo. Updating the
      # GitHub Release afterwards is too late because Zenodo archives the event payload it received.
      - name: Resolve release notes
        id: release_notes
        run: |
          path="release-notes/${GITHUB_REF_NAME#v}/en.md"
          if [ ! -s "$path" ]; then
            echo "Missing release notes: $path" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Attach user-facing artifacts + checksums: installers (dmg/exe/AppImage/deb) and the mac
      # portable zips, plus the electron-updater feed files so the manually dispatched website mirror
      # can republish them to the CDN feed: win/linux latest.yml + latest-linux.yml, and the mac feeds.
      # `*-mac.yml` covers the merged latest-mac.yml (the file the app polls) plus the per-arch
      # arm64/x64-mac.yml intermediates it was built from. Blockmaps are win/linux only (mac does
      # full-zip updates in v1).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: false
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/open-science-cli-*.tar.gz
            artifacts/CLI-PACKAGE-SHA256SUMS.txt
            artifacts/CLI-PACKAGE-PROVENANCE.json
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json
            artifacts/latest.yml
            artifacts/latest-linux.yml
            artifacts/latest-linux-arm64.yml
            artifacts/*-mac.yml
            artifacts/*.blockmap

      # The historical upgrade drill consumes the published installer and reports independently.
      # Dispatch failure is advisory too: it must not invalidate assets already certified above.
      - name: Dispatch advisory Windows upgrade smoke
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"
          --field event_type=windows-upgrade-smoke
          --field "client_payload[tag]=$GITHUB_REF_NAME"

  # Releases created with GITHUB_TOKEN do not emit a downstream release workflow run. Invoke the
  # read-only PoC directly after publication so every normal stable release is measured.
  release-sbom-poc:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-sbom-poc.yml
    with:
      tag: ${{ github.ref_name }}

  # GITHUB_TOKEN-created releases do not trigger a separate release-event workflow.
  # The protected tag, root version, source commit and native artifacts are shared with desktop.
