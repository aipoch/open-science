name: Runtime Resource Soak

# Profile runtime resource usage on main daily.
# Scheduled failures open or refresh a tracking issue labelled ci-scheduled-failure.
on:
  schedule:
    - cron: '23 19 * * *' # UTC; overnight in Asia/Singapore
  workflow_dispatch:
    inputs:
      mode:
        description: Runtime source profile or packaged macOS dry-run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - soak
          - package-macos-arm64

permissions:
  actions: read
  contents: read

concurrency:
  group: runtime-resource-soak-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check for unprofiled main changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout skip check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/skip-unchanged-scheduled
          sparse-checkout-cone-mode: false
      - name: Check for unprofiled main changes
        id: decide
        uses: ./.github/actions/skip-unchanged-scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          workflow-file: runtime-resource-soak.yml

  runtime_resource_soak:
    name: Windows runtime resource ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'soak' }}
    needs: plan
    if: needs.plan.outputs.should_test == 'true' && inputs.mode != 'package-macos-arm64'
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      CI: 'true'
      PROFILE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'soak' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs

      - name: Record runtime resource profile
        shell: pwsh
        run: |
          if ($env:PROFILE_MODE -eq 'smoke') {
            $profileArgs = @('--repeat=1', '--phase-ms=2000', '--interval-ms=500', '--stress-cycles=1')
          } else {
            $profileArgs = @('--repeat=3', '--phase-ms=10000', '--interval-ms=1000', '--stress-cycles=6')
          }
          npm run perf:runtime -- @profileArgs '--output=test-results/performance'

      - name: Upload runtime resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-resource-${{ env.PROFILE_MODE }}-windows
          path: test-results
          retention-days: 14
          if-no-files-found: error

  packaged_performance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'package-macos-arm64'
    uses: ./.github/workflows/performance-package-dryrun.yml

  # Scheduled failures open or refresh one tracking issue; a later scheduled success closes it.
  report:
    name: Report scheduled outcome
    needs: [plan, runtime_resource_soak, packaged_performance]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/report-scheduled-failure.mjs
          sparse-checkout-cone-mode: false
      - name: Open, refresh, or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CONCLUSION: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        with:
          script: |
            const { reportScheduledOutcome } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/report-scheduled-failure.mjs`)
            await reportScheduledOutcome({
              github,
              repo: context.repo,
              workflowFile: 'runtime-resource-soak.yml',
              workflowName: context.workflow,
              runId: context.runId,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: context.sha,
              conclusion: process.env.CONCLUSION,
              log: core.info
            })
