name: Agent Harness Package

on:
  pull_request:
    paths:
      - 'packages/agent-harness/**'
      - 'scripts/agent-harness-acceptance*'
      - 'scripts/check-agent-harness-package.mjs'
      - 'scripts/agent-harness-recovery.integration.test.ts'
      - 'scripts/agent-harness-journal-crash.integration.test.ts'
      - 'scripts/fixtures/agent-harness/**'
      - '.github/workflows/agent-harness.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'packages/agent-harness/**'
      - 'scripts/agent-harness-acceptance*'
      - 'scripts/check-agent-harness-package.mjs'
      - 'scripts/agent-harness-recovery.integration.test.ts'
      - 'scripts/agent-harness-journal-crash.integration.test.ts'
      - 'scripts/fixtures/agent-harness/**'
      - '.github/workflows/agent-harness.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    name: Package ${{ matrix.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      # This installs only the locked acceptance dependencies in a temporary directory.
      # No Electron, project node_modules, provider key, publication or default routing.
      - name: Build and verify the independent package
        run: npm run check:agent-harness-standalone -- --output "out/agent-harness-acceptance/${{ matrix.runner }}-node-${{ matrix.node }}"
      - name: Retain source, build, tarball and acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-harness-${{ matrix.runner }}-node-${{ matrix.node }}
          path: out/agent-harness-acceptance/${{ matrix.runner }}-node-${{ matrix.node }}/
          if-no-files-found: error
          retention-days: 14
