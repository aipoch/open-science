name: Qualify signed macOS background update
on:
  push:
    branches: [test/macos-background-updates-trash-ownership]
concurrency:
  group: mac-trash-ownership-runners
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-15, scenario: trash }
          - { arch: arm64, os: macos-15, scenario: ordinary }
          - { arch: x64, os: macos-15-intel, scenario: trash }
          - { arch: x64, os: macos-15-intel, scenario: ordinary }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Fetch signed upgrade endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p feed source
          gh release download v1.3.2 --repo aipoch/open-science -p "aipoch-open-science-1.3.2-mac-$ARCH.zip" -p latest-mac.yml -D feed
          for i in {1..70}; do
            if gh api repos/aipoch/open-science/actions/runs/44896190264/artifacts --jq '.artifacts[].name' | grep -Fxq "macos-$ARCH"; then break; fi
            sleep 30
          done
          gh run download 44896190264 --repo aipoch/open-science -n "macos-$ARCH" -D source
      - name: Verify native staging ownership after a real installation move
        env:
          ARCH: ${{ matrix.arch }}
          MOVE_KIND: ${{ matrix.scenario }}
        run: |
          export D="$RUNNER_TEMP/quit-trash" A="$RUNNER_TEMP/source/aipoch-open-science-1.3.1-mac-$ARCH.zip" FEED="$RUNNER_TEMP/feed" PROBE="$PWD/scripts/validation/mac-quit-probe.mjs"
          bash scripts/validation/mac-quit-trash.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installed-upgrade-${{ matrix.arch }}-${{ matrix.scenario }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/quit-trash/result.json
            ${{ runner.temp }}/quit-trash/shipit.txt
            ${{ runner.temp }}/quit-trash/job.txt
            ${{ runner.temp }}/quit-trash/events.jsonl
            ${{ runner.temp }}/quit-acceptance/workspace-ready
            ${{ runner.temp }}/quit-abort/job.txt
            ${{ runner.temp }}/quit-abort/shipit.txt
            ${{ runner.temp }}/quit-abort/*.json
            ${{ runner.temp }}/quit-abort/*.jsonl
            ${{ runner.temp }}/quit-fallbacks/*.jsonl
            ${{ runner.temp }}/quit-fallbacks/readonly-windows
            ${{ runner.temp }}/quit-fallbacks/manual-status
            ${{ runner.temp }}/quit-acceptance/*.jsonl
            ${{ runner.temp }}/quit-acceptance/*.png
            ${{ runner.temp }}/quit-acceptance/signature-*.txt
            ${{ runner.temp }}/quit-acceptance/last-*
            ${{ runner.temp }}/quit-acceptance/stderr
            ${{ runner.temp }}/quit-acceptance/stdout
            ${{ runner.temp }}/quit-acceptance/first-workspace*
            ${{ runner.temp }}/quit-fallbacks/manual-running
            ${{ runner.temp }}/quit-acceptance/cold-identity
            ${{ runner.temp }}/quit-acceptance/profile/desktop-logs/*update*.log
