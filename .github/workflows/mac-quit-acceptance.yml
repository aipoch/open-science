name: Verify signed macOS open failure feedback and upgrade
on:
  push:
    branches: [test/macos-background-updates-open-document]
concurrency:
  group: mac-update-document-open
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  wait_for_signed_artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for both signed packages before allocating Macs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44911592080 44911588261; do
            ready=false
            for i in {1..120}; do
              if [[ "$(gh api "repos/aipoch/open-science/actions/runs/$run/artifacts" --jq '[.artifacts[] | select(.name=="macos-arm64" or .name=="macos-x64")] | length')" = 2 ]]; then ready=true; break; fi
              state=$(gh run view "$run" --repo aipoch/open-science --json status --jq .status)
              if [[ "$state" = completed ]]; then exit 1; fi
              sleep 30
            done
            test "$ready" = true
          done
  upgrade:
    needs: wait_for_signed_artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-15, scenario: reopen, intent: document }
          - { arch: x64, os: macos-15-intel, scenario: reopen, intent: document }
          - { arch: arm64, os: macos-15, scenario: reopen, intent: link }
          - { arch: x64, os: macos-15-intel, scenario: reopen, intent: link }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Fetch signed upgrade endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p feed source
          gh run download 44911592080 --repo aipoch/open-science -n "macos-$ARCH" -D source
          gh run download 44911588261 --repo aipoch/open-science -n "macos-$ARCH" -D feed
          cp "feed/$ARCH-mac.yml" feed/latest-mac.yml
      - name: Exercise a failed replacement in the signed application
        env:
          ARCH: ${{ matrix.arch }}
          INTENT: ${{ matrix.intent }}
        run: |
          set -euo pipefail
          export D="$RUNNER_TEMP/notice-acceptance"
          export A="$RUNNER_TEMP/source/aipoch-open-science-1.3.1-mac-$ARCH.zip"
          export FEED="$RUNNER_TEMP/feed" PROBE="$PWD/scripts/validation/mac-quit-probe.mjs"
          bash scripts/validation/mac-notice-accept.sh
      - name: Exercise signed A to B
        if: matrix.scenario == 'reopen'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export D="$RUNNER_TEMP/quit-acceptance"
          export A="$RUNNER_TEMP/source/aipoch-open-science-1.3.1-mac-$ARCH.zip"
          export FEED="$RUNNER_TEMP/feed" PROBE="$PWD/scripts/validation/mac-quit-probe.mjs"
          export INTENT="${{ matrix.intent }}"
          mkdir -p "$D"
          bash scripts/validation/mac-quit-accept.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-intent-${{ matrix.arch }}-${{ matrix.intent }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/notice-acceptance/interrupted-open.png
            ${{ runner.temp }}/notice-acceptance/acceptance.jsonl
            ${{ runner.temp }}/notice-acceptance/last-error
            ${{ runner.temp }}/notice-acceptance/signature-A.txt
            ${{ runner.temp }}/quit-acceptance/document-*
            ${{ runner.temp }}/quit-trash/result.json
            ${{ runner.temp }}/quit-trash/shipit.txt
            ${{ runner.temp }}/quit-trash/job.txt
            ${{ runner.temp }}/quit-trash/events.jsonl
            ${{ runner.temp }}/quit-acceptance/old-pid-exit
            ${{ runner.temp }}/quit-acceptance/workspace-ready
            ${{ runner.temp }}/quit-abort/job.txt
            ${{ runner.temp }}/quit-abort/shipit.txt
            ${{ runner.temp }}/quit-abort/*.json
            ${{ runner.temp }}/quit-abort/*.jsonl
            ${{ runner.temp }}/quit-fallbacks/*.jsonl
            ${{ runner.temp }}/quit-fallbacks/readonly-windows
            ${{ runner.temp }}/quit-fallbacks/manual-status
            ${{ runner.temp }}/quit-acceptance/*.jsonl
            ${{ runner.temp }}/quit-acceptance/*.png
            ${{ runner.temp }}/quit-acceptance/signature-*.txt
            ${{ runner.temp }}/quit-acceptance/last-*
            ${{ runner.temp }}/quit-acceptance/stderr
            ${{ runner.temp }}/quit-acceptance/stdout
            ${{ runner.temp }}/quit-acceptance/first-workspace*
            ${{ runner.temp }}/quit-fallbacks/manual-running
            ${{ runner.temp }}/quit-acceptance/cold-identity
            ${{ runner.temp }}/quit-acceptance/profile/desktop-logs/*update*.log
