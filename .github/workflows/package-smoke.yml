name: Linux ordinary quit acceptance
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Run the test in an Ubuntu Docker container or on the native runner
        type: choice
        options: [native, docker]
        default: native
      candidate_run:
        description: Reuse the native candidate artifacts from this same diagnostic workflow
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  ordinary-quit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, feed: latest-linux.yml }
          - { os: ubuntu-24.04-arm, arch: arm64, feed: latest-linux-arm64.yml }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/npm-ci.mjs
      - name: Stage pinned notebook runtime
        if: inputs.candidate_run == ''
        run: |
          case "$(uname -m)" in
            aarch64) subdir=linux-aarch64; arch=arm64 ;;
            x86_64) subdir=linux-64; arch=x64 ;;
            *) exit 1 ;;
          esac
          node scripts/fetch-micromamba.mjs "$subdir" "resources/bin/linux/$arch/micromamba"
      - name: Build isolated test version
        if: inputs.candidate_run == ''
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm version --no-git-tag-version 1.3.1
          npm run build:e2e
          npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.candidate_run == ''
        with:
          name: quit-candidate-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 2
      - name: Fetch exact previously built candidate
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.candidate_run }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$SOURCE" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE" -n "quit-candidate-$ARCH" -D dist
      - name: Verify AppImage on ordinary quit and reopen
        env:
          GH_TOKEN: ${{ github.token }}
          FEED: ${{ matrix.feed }}
          ARCH: ${{ matrix.arch }}
          DESKTOP: ${{ inputs.desktop }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes libfuse2t64 gnome-keyring dbus-user-session desktop-file-utils shared-mime-info libsecret-tools
          export QA_REPO="$PWD"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download v1.3.2 -p "aipoch-open-science-1.3.2-linux-$ARCH.AppImage" -p "$FEED" -D "$dir"
          chmod u+x dist/*.AppImage
          for kind in ordinary file link; do
            if [[ "$kind" = ordinary ]]; then unset QA_OPEN_KIND; else export QA_OPEN_KIND="$kind"; fi
            test=(xvfb-run -a dbus-run-session -- sh scripts/ci/probe-quit-session.sh scripts/ci/probe-ordinary-quit.cjs "$PWD"/dist/*.AppImage "$dir" "$FEED")
            if [[ "$DESKTOP" = docker ]]; then
              if [[ "$kind" = ordinary ]]; then docker build -t quit-ubuntu:acceptance - < scripts/ci/probe-quit.Dockerfile; fi
              docker run --init --rm --user "$(id -u):$(id -g)" --cap-drop ALL --shm-size=512m \
                -e APPIMAGE_EXTRACT_AND_RUN=1 -e QA_REPO="$PWD" -e QA_OPEN_KIND \
                -v "$PWD:$PWD:ro" -v "$dir:$dir:ro" -w "$PWD" quit-ubuntu:acceptance "${test[@]}"
            else
              "${test[@]}"
            fi
          done
