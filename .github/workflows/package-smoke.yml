name: Linux ordinary quit acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ordinary-quit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, feed: latest-linux.yml }
          - { os: ubuntu-24.04-arm, arch: arm64, feed: latest-linux-arm64.yml }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/npm-ci.mjs
      - name: Build isolated test version
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm version --no-git-tag-version 1.3.1
          npm run build:e2e
          npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quit-candidate-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 2
      - name: Verify AppImage on ordinary quit and reopen
        env:
          GH_TOKEN: ${{ github.token }}
          FEED: ${{ matrix.feed }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes libfuse2t64 gnome-keyring dbus-user-session
          export QA_REPO="$PWD"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download v1.3.2 -p "aipoch-open-science-1.3.2-linux-$ARCH.AppImage" -p "$FEED" -D "$dir"
          chmod u+x dist/*.AppImage
          xvfb-run -a dbus-run-session -- sh scripts/ci/probe-quit-session.sh scripts/ci/probe-ordinary-quit.cjs "$PWD"/dist/*.AppImage "$dir" "$FEED"
