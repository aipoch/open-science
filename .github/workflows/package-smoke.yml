name: Linux AppImage SDK baseline
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mounted-upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, feed: latest-linux.yml }
          - { os: ubuntu-24.04-arm, arch: arm64, feed: latest-linux-arm64.yml }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/npm-ci.mjs
      - name: Prepare native desktop and official releases
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          FEED: ${{ matrix.feed }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes libfuse2t64 gnome-keyring dbus-user-session
          for ver in 1.3.1 1.3.2; do
            dir="$RUNNER_TEMP/$ver"
            mkdir -p "$dir"
            name="aipoch-open-science-$ver-linux-$ARCH.AppImage"
            gh release download "v$ver" -p "$name" -p "$FEED" -D "$dir"
            gh release view "v$ver" --json assets > "$dir/release.json"
            node scripts/ci/probe-appimage-sdk.cjs verify "$dir" "$name" "$FEED"
            chmod 755 "$dir/$name"
          done
      - name: Run both versions through the native mounted entry
        env:
          ARCH: ${{ matrix.arch }}
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          set -euo pipefail
          test -c /dev/fuse
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            printf "%s\n" baseline | gnome-keyring-daemon --unlock --components=secrets
            node scripts/ci/probe-appimage-sdk.cjs mounted "$RUNNER_TEMP" "$ARCH"
          '
