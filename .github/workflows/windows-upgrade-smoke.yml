name: Windows observer upgrade diagnostic (manual, no publish)

# Temporary diagnostic variant on a dedicated branch. No schedule, PR gate, or release publication.
on:
  workflow_dispatch:
    inputs:
      environment_only:
        description: Run only the ordinary account known-folder and DPAPI diagnostic
        type: boolean
        default: false
      candidate_run_id:
        description: Existing Azure signing dry-run containing the Windows artifact
        required: true
        type: string
      expected_sha:
        description: Exact product source SHA bound to that artifact
        required: true
        type: string
      third_run_id:
        description: Signed 1.0.2 artifact from the same fixed signing SHA for the second continuous upgrade
        type: string
        default: ''
      signing_sha:
        description: Exact reviewed diagnostic workflow commit that signed the candidate
        required: true
        type: string
      baseline_run_id:
        description: Exact signed current PR 1.0.0 artifact for the second upgrade path
        required: true
        type: string
      baseline_signing_sha:
        description: Exact workflow SHA that built the current PR 1.0.0 baseline
        required: true
        type: string
      baseline_tag:
        description: Lower released stable Windows version
        default: v1.0.0
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  account:
    if: inputs.environment_only
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the isolated ordinary-user environment
        shell: pwsh
        run: |
          ./scripts/diagnostics/pr3599/run-as-standard-user.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE" -CurrentDirectory "$env:GITHUB_WORKSPACE" -PreviousDirectory "$env:GITHUB_WORKSPACE" -OutputDirectory "$env:GITHUB_WORKSPACE\evidence" -EnvironmentOnly
      - name: Observe a failed account residual without changing acceptance
        if: failure()
        shell: pwsh
        run: ./scripts/diagnostics/pr3599/observe-account-residual.ps1 -EvidenceDirectory evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr3599-isolated-account
          path: evidence
          if-no-files-found: error
          retention-days: 14
  actual-upgrade:
    if: ${{ !inputs.environment_only }}
    name: Continuous signed 1.0.0 to 1.0.1 to 1.0.2
    strategy:
      fail-fast: false
      matrix:
        baseline: [pr]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Bind artifact to the exact successful signed Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SIGNING_SHA: ${{ inputs.signing_sha }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN -notmatch '^\d+$' -or $env:EXPECTED_SHA -notmatch '^[a-f0-9]{40}$' -or $env:BASELINE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid source identity input' }
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runJson | Set-Content evidence/signing-run.json
          $run = $runJson | ConvertFrom-Json
          if ($run.head_sha -ne $env:SIGNING_SHA -or $run.path -ne '.github/workflows/signpath-test.yml') { throw 'Wrong artifact source' }
          $jobsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN/jobs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $jobsJson | Set-Content evidence/signing-jobs.json
          $build = @(($jobsJson | ConvertFrom-Json).jobs | Where-Object { $_.name -eq 'build / Build windows-x64' })
          if ($build.Count -ne 1 -or $build[0].conclusion -ne 'success') { throw 'Signed Windows build is not successful' }
          git -C candidate-source rev-parse HEAD | Set-Content evidence/product-sha.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-x64
          path: current
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify product source and version-only build delta
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content current/upgrade-product-sha.txt -Raw).Trim() -ne $env:EXPECTED_SHA) { throw 'Artifact product SHA does not match checkout' }
          $changed = @(Get-Content current/upgrade-modified-files.txt)
          if ($changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin @('package.json','package-lock.json') }).Count) { throw 'Unexpected build modifications' }
          Copy-Item current/upgrade-* evidence/
      - name: Download the third signed version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-x64
          path: third
          run-id: ${{ inputs.third_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the third artifact identity and signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          THIRD_RUN: ${{ inputs.third_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SIGNING_SHA: ${{ inputs.signing_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:THIRD_RUN -notmatch '^\d+$') { throw 'Third signed run required' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:THIRD_RUN"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $json | Set-Content evidence/third-signing-run.json
          $run = $json | ConvertFrom-Json
          if ($run.head_sha -ne $env:SIGNING_SHA -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/signpath-test.yml') { throw 'Third artifact source mismatch' }
          if ((Get-Content third/upgrade-product-sha.txt -Raw).Trim() -ne $env:EXPECTED_SHA) { throw 'Third product SHA mismatch' }
          $changed = @(Get-Content third/upgrade-modified-files.txt)
          if ($changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin @('package.json','package-lock.json') }).Count) { throw 'Unexpected third-version source modifications' }
          $files = @(Get-ChildItem third -Filter '*-win-x64-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one third installer' }
          $file = $files[0]
          $signature = Get-AuthenticodeSignature $file.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|, )CN=AIPOCH PTE\. LTD\.' -or [version]$file.VersionInfo.ProductVersion -ne [version]'1.0.2') { throw 'Third installer trust/version mismatch' }
          @{version=$file.VersionInfo.ProductVersion;sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash;signature=$signature.Status.ToString();publisher=$signature.SignerCertificate.Subject} | ConvertTo-Json | Set-Content evidence/third-installer.json
          Get-ChildItem third/upgrade-* | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'evidence' ('third-' + $_.Name)) }
      - name: Download the exact current PR 1.0.0 baseline
        if: matrix.baseline == 'pr'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-x64
          path: previous
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - name: Verify current PR baseline identity
        if: matrix.baseline == 'pr'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
          BASELINE_SIGNING_SHA: ${{ inputs.baseline_signing_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BASELINE_RUN"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $json | Set-Content evidence/pr-baseline-signing-run.json
          $baseline = $json | ConvertFrom-Json
          if ($baseline.head_sha -ne $env:BASELINE_SIGNING_SHA -or $baseline.conclusion -ne 'success' -or $baseline.path -ne '.github/workflows/signpath-test.yml') { throw 'PR baseline artifact is not the exact successfully signed build' }
          if ((Get-Content previous/upgrade-product-sha.txt -Raw).Trim() -ne $env:EXPECTED_SHA) { throw 'PR baseline product identity differs from candidate checkout' }
          $modified = @(Get-Content previous/upgrade-modified-files.txt | Where-Object { $_.Trim() })
          if ($modified.Count -ne 0) { throw 'PR 1.0.0 baseline has unexpected source modifications' }
          Get-ChildItem previous/upgrade-* | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'evidence' ('baseline-' + $_.Name)) }
      - name: Fetch the signed lower-version baseline
        if: matrix.baseline == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          New-Item -ItemType Directory -Path previous -Force | Out-Null
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-win-x64-setup.exe' --pattern '*-win-x64-setup.exe.blockmap' --dir previous
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify signatures, versions and immutable installer hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $records = foreach ($directory in @('current','previous')) {
            $installers = @(Get-ChildItem $directory -Recurse -Filter '*-win-x64-setup.exe')
            if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
            $file = $installers[0]
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|, )CN=AIPOCH PTE\. LTD\.') { throw "Installer trust verification failed: $($signature.Status)" }
            @{role=$directory;file=$file.FullName;version=$file.VersionInfo.ProductVersion;sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash;signature=$signature.Status.ToString();publisher=$signature.SignerCertificate.Subject}
          }
          $records | ConvertTo-Json -Depth 5 | Set-Content evidence/installers.json
          if ([version]$records[0].version -ne [version]'1.0.1' -or [version]$records[1].version -ne [version]'1.0.0') { throw 'Expected the explicitly requested 1.0.0 to 1.0.1 transition' }
          if ([version]$records[0].version -le [version]$records[1].version) { throw 'Candidate must be newer than baseline' }
      - name: Install only the existing upgrade harness dependencies
        working-directory: candidate-source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: candidate-source
        run: npx prisma generate
      - name: Prepare scoped process evidence without changing product binaries
        shell: pwsh
        run: |
          node validation-tools/scripts/diagnostics/pr3599/prepare-direct-successor.mjs candidate-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check candidate-source/scripts/pr3599-upgrade-certification.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node validation-tools/scripts/diagnostics/pr3599/test-chain-generation.mjs candidate-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File candidate-source/scripts/windows-upgrade-diagnostics/test-observer-operation.ps1 -Output evidence/observer-operation-self-check.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash candidate-source/scripts/pr3599-*,candidate-source/scripts/HandoffObserver.cs,candidate-source/scripts/user-update-proxy.ps1 -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/harness-hashes.json
          git -C candidate-source status --porcelain | Set-Content evidence/source-status.txt
      - name: Exercise actual application update under an isolated standard Windows account
        env:
          OPEN_SCIENCE_UPGRADE_TEST_BASELINE: ${{ matrix.baseline }}
        shell: pwsh
        run: |
          ./validation-tools/scripts/diagnostics/pr3599/run-as-standard-user.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE\candidate-source" -CurrentDirectory "$env:GITHUB_WORKSPACE\current" -PreviousDirectory "$env:GITHUB_WORKSPACE\previous" -ThirdDirectory "$env:GITHUB_WORKSPACE\third" -OutputDirectory "$env:GITHUB_WORKSPACE\evidence"
      - name: Preserve original evidence even when the first stage fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr3599-real-upgrade-${{ matrix.baseline }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
