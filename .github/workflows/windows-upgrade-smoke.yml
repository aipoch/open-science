name: Windows Upgrade Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Build v1.3.1 and the pinned main candidate with one disposable certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $base = git rev-parse 'v1.3.1^{commit}'
          if ($base -ne '9861032aa449009449e913188f8bd73a131df908') { throw "Unexpected v1.3.1 commit $base" }
          $candidate = 'b6d47ed1009cc122a0c55614761b41b48faed9f3'
          $sourceA = Join-Path $env:RUNNER_TEMP 'version-a'
          $sourceB = Join-Path $env:RUNNER_TEMP 'version-b'
          git worktree add --detach $sourceA $base
          git worktree add --detach $sourceB $candidate
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Open Science CI' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddDays(1)
          "TEST_SIGNER=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $public = Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP/upgrade-test.cer"
          Import-Certificate -FilePath $public.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          ./scripts/ci/build-upgrade-fixture.ps1 $sourceA '1.3.1' "$env:RUNNER_TEMP/upgrade-a" $cert.Thumbprint
          ./scripts/ci/build-upgrade-fixture.ps1 $sourceB '1.3.2' "$env:RUNNER_TEMP/upgrade-b" $cert.Thumbprint
      - name: Run one automatic update from 1.3.1 to 1.3.2
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP/version-b"
          node scripts/windows-updater-certification.mjs --previous-dir "$env:RUNNER_TEMP/upgrade-a" --current-dir "$env:RUNNER_TEMP/upgrade-b" --output "$env:GITHUB_WORKSPACE/upgrade.json"
      - name: Remove temporary signing identity
        if: always() && env.TEST_SIGNER != ''
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:TEST_SIGNER" -DeleteKey
          Remove-Item -LiteralPath "Cert:\LocalMachine\Root\$env:TEST_SIGNER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-upgrade-1.3.1-to-1.3.2-evidence
          path: upgrade.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-1.3.2-test-package
          path: ${{ runner.temp }}/upgrade-b
          if-no-files-found: warn
          retention-days: 7
