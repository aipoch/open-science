name: Windows Upgrade Smoke

# Advisory post-release validation. It consumes published assets, so it cannot extend or block the
# stable Release workflow. A failure is intentionally red here and can be rerun for the same tag.
on:
  repository_dispatch:
    types:
      - windows-upgrade-smoke
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to validate
        type: string
        required: false
      current_artifact_run_id:
        description: Build run containing the target windows-x64 package (no release publication)
        type: string
        default: ''
      previous_artifact_run_id:
        description: Build run containing the source windows-x64 package, including the fix under test
        type: string
        default: ''
      diagnostic_version:
        description: Build an internal source or target version (for example 1.0.6 or 1.0.7), without publishing
        type: string
        default: ''
      platform_name:
        description: Native platform for an internal diagnostic build
        type: choice
        default: windows-x64
        options:
          - windows-x64
          - macos-arm64
          - macos-x64
          - linux-x64
          - linux-arm64

      dry_run:
        description: Test baseline selection and the installer observer without downloading or installing releases
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-upgrade-smoke-${{ github.event.client_payload.tag || inputs.tag || inputs.current_artifact_run_id || format('{0}-{1}', inputs.platform_name, inputs.diagnostic_version) }}
  cancel-in-progress: false

jobs:
  diagnostic-inputs:
    if: ${{ inputs.diagnostic_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate internal build mode
        env:
          DIAGNOSTIC_VERSION: ${{ inputs.diagnostic_version }}
          TAG: ${{ inputs.tag }}
          CURRENT_RUN: ${{ inputs.current_artifact_run_id }}
          PREVIOUS_RUN: ${{ inputs.previous_artifact_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$DIAGNOSTIC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
          [[ -z "$TAG$CURRENT_RUN$PREVIOUS_RUN" ]] && [[ "$DRY_RUN" != true ]]
  diagnostic-build:
    needs: diagnostic-inputs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      platform_name: ${{ inputs.platform_name }}
      diagnostic_version: ${{ inputs.diagnostic_version }}
      sign_windows: ${{ inputs.platform_name == 'windows-x64' }}
  diagnostic-package-smoke:
    needs: diagnostic-build
    uses: ./.github/workflows/package-smoke.yml
    with:
      platform_name: ${{ inputs.platform_name }}
      require_windows_signing: ${{ inputs.platform_name == 'windows-x64' }}
  windows-upgrade-smoke:
    if: ${{ !inputs.dry_run && !inputs.current_artifact_run_id && !inputs.previous_artifact_run_id && !inputs.diagnostic_version }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CURRENT_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve released revision
        id: current
        shell: pwsh
        run: |
          $releasedSha = git rev-parse "$($env:CURRENT_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releasedSha)) {
            exit 1
          }
          git merge-base --is-ancestor $releasedSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Released revision $releasedSha is not an ancestor of smoke harness $env:GITHUB_SHA."
            exit 1
          }
          $migrationFiles = @(
            git ls-tree -r --name-only $releasedSha -- src/main/database/migrations
          )
          if ($LASTEXITCODE -ne 0 -or $migrationFiles.Count -eq 0) {
            Write-Error "Released revision $releasedSha has no application migrations."
            exit 1
          }
          $migrationPattern = '^src/main/database/migrations/(?<sequence>\d{4})-[a-z0-9]+(?:-[a-z0-9]+)*\.ts$'
          for ($index = 0; $index -lt $migrationFiles.Count; $index += 1) {
            if ($migrationFiles[$index] -notmatch $migrationPattern) {
              Write-Error "Unexpected released migration path: $($migrationFiles[$index])"
              exit 1
            }
            $expectedSequence = $index + 1
            if ([int]$Matches.sequence -ne $expectedSequence) {
              Write-Error "Released migrations are not a continuous prefix at $($migrationFiles[$index])."
              exit 1
            }
          }
          # Contract-boundary commits for the Artifact RPC methods (artifactSaveVersion / artifactReserveWrite,
          # src/main/notebook/local-rpc-server.ts); scripts/windows-installer-smoke.mjs replays the matching contract.
          $artifactSaveCommit = '1a6faf134836d417b8bb1cdf89571f5d9dee2a0b'
          $artifactReservationCommit = 'f12fd1f871022c7a9b771d193202d9ecf98aca96'
          $artifactSaveBase = git merge-base $artifactSaveCommit $releasedSha
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($artifactSaveBase)) {
            Write-Error "Could not resolve the released Artifact RPC contract at $releasedSha."
            exit 1
          }
          $artifactReservationBase = git merge-base $artifactReservationCommit $releasedSha
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($artifactReservationBase)) {
            Write-Error "Could not resolve the released Artifact RPC contract at $releasedSha."
            exit 1
          }
          if ($artifactSaveBase -eq $artifactSaveCommit) {
            $artifactRpcContract = 'save'
          } elseif ($artifactReservationBase -eq $artifactReservationCommit) {
            $artifactRpcContract = 'reservation'
          } else {
            $artifactRpcContract = 'legacy'
          }
          "sha=$releasedSha" >> $env:GITHUB_OUTPUT
          "migration_count=$($migrationFiles.Count)" >> $env:GITHUB_OUTPUT
          "artifact_rpc_contract=$artifactRpcContract" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Download current Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force current | Out-Null
          gh release download $env:CURRENT_TAG --pattern '*-win-x64-setup.exe' --pattern '*-win-x64-setup.exe.blockmap' --pattern 'latest.yml' --dir current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download previous stable Windows installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          $stableTag = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          if ($env:CURRENT_TAG -notmatch $stableTag) { throw "Current tag must be stable SemVer." }
          $current = [version]$env:CURRENT_TAG.Substring(1)
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = @($pages | ConvertFrom-Json | ForEach-Object { $_ })
          $eligible = @($releases | Where-Object {
            if ($_.draft -or $_.prerelease -or $_.tag_name -notmatch $stableTag) { return $false }
            $version = [version]$_.tag_name.Substring(1)
            $installer = "aipoch-open-science-$version-win-x64-setup.exe"
            $version -lt $current -and $_.assets.name -contains $installer -and
              $_.assets.name -contains "$installer.blockmap"
          })
          $tag = ($eligible | Sort-Object { [version]$_.tag_name.Substring(1) } -Descending | Select-Object -First 1).tag_name
          if ([string]::IsNullOrWhiteSpace($tag)) {
            "available=false" >> $env:GITHUB_OUTPUT
            "reason=no-previous-stable-release" >> $env:GITHUB_OUTPUT
            Write-Host "No eligible previous stable Windows installer is available; fresh-install smoke already passed."
            exit 0
          }
          gh release download $tag --pattern '*-win-x64-setup.exe' --pattern '*-win-x64-setup.exe.blockmap' --dir previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "available=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Certify Windows electron-updater differential update
        id: updater
        env:
          OPEN_SCIENCE_E2E_STORAGE_ROOT: ${{ runner.temp }}\open-science-updater-certification
        if: steps.previous.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-updater-certification.mjs `
            --current-dir current `
            --previous-dir previous `
            --output windows-updater-observation.json 2>&1 |
            Tee-Object -FilePath windows-updater-certification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Drill Windows silent upgrade, process lock, rollback, and restart
        id: installer
        env:
          OPEN_SCIENCE_E2E_STORAGE_ROOT: ${{ runner.temp }}\open-science-installer-certification
        if: always() && steps.previous.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-installer-smoke.mjs `
            --installer-dir current `
            --previous-installer-dir previous `
            --artifact-rpc-contract '${{ steps.current.outputs.artifact_rpc_contract }}' `
            --expected-migration-count '${{ steps.current.outputs.migration_count }}' 2>&1 |
            Tee-Object -FilePath windows-installer-certification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Windows update-drill evidence
        if: always()
        shell: pwsh
        env:
          GITHUB_SHA: ${{ steps.current.outputs.sha }}
        run: |
          $available = '${{ steps.previous.outputs.available }}' -eq 'true'
          $passed = '${{ steps.updater.outcome }}' -eq 'success' -and '${{ steps.installer.outcome }}' -eq 'success'
          $status = if (-not $available) { 'not-applicable' } elseif ($passed) { 'passed' } else { 'failed' }
          $arguments = @(
            'scripts/ci/release-certification-evidence.mjs', 'write-windows-update',
            '--output', 'certification-windows-update.json',
            '--current-tag', $env:CURRENT_TAG,
            '--status', $status
          )
          if ($available) {
            $arguments += @('--previous-tag', '${{ steps.previous.outputs.tag }}')
            if (Test-Path 'windows-updater-observation.json') {
              $arguments += @('--updater-observation', 'windows-updater-observation.json')
            }
            if (Test-Path 'current/database-migration-certification.json') {
              $arguments += @('--database-migration-certification', 'current/database-migration-certification.json')
            }
            if (-not $passed) {
              $arguments += @('--reason', 'updater=${{ steps.updater.outcome }},installer=${{ steps.installer.outcome }}')
            }
          } else {
            $arguments += @('--reason', '${{ steps.previous.outputs.reason }}')
          }
          & node @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows update-drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-update-certification-${{ env.CURRENT_TAG }}
          retention-days: 7
          path: |
            certification-windows-update.json
            windows-*-certification.log
            windows-updater-observation.json
          if-no-files-found: error

      - name: Report Windows update-drill outcome
        if: >-
          always() && steps.previous.outputs.available == 'true' &&
          (steps.updater.outcome != 'success' || steps.installer.outcome != 'success')
        run: exit 1

  artifact-upgrade:
    if: ${{ !inputs.dry_run && !inputs.diagnostic_version && (inputs.current_artifact_run_id || inputs.previous_artifact_run_id) }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            basic,
            workload,
            active-work,
            downgrade,
            multi-profile,
            unresponsive-profile,
            no-protocol-runtime,
            missing-exe-recovery,
            cancel-cleanup,
            writer-shortcut-wait
          ]
    steps:
      - name: Checkout certification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate both immutable artifact sources
        shell: pwsh
        env:
          CURRENT_RUN: ${{ inputs.current_artifact_run_id }}
          PREVIOUS_RUN: ${{ inputs.previous_artifact_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -or $env:CURRENT_RUN -notmatch '^\d+$' -or $env:PREVIOUS_RUN -notmatch '^\d+$') {
            throw 'Artifact certification requires both build run IDs and no release tag.'
          }
          $evidence = @()
          foreach ($run in @($env:PREVIOUS_RUN, $env:CURRENT_RUN)) {
            $details = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $details.conclusion -ne 'success') { throw "Build run $run has not passed." }
            $evidence += @{ runId=$run; commit=$details.head_sha; branch=$details.head_branch; url=$details.html_url }
          }
          $evidence | ConvertTo-Json | Set-Content artifact-builds.json
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Download target package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: current
          run-id: ${{ inputs.current_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: previous
          run-id: ${{ inputs.previous_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Require both internal packages to contain this reviewed commit
        shell: pwsh
        env:
          CURRENT_RUN: ${{ inputs.current_artifact_run_id }}
          PREVIOUS_RUN: ${{ inputs.previous_artifact_run_id }}
        run: |
          foreach ($pair in @(@('previous', $env:PREVIOUS_RUN), @('current', $env:CURRENT_RUN))) {
            $identity = Get-Content -Raw (Join-Path $pair[0] 'diagnostic-build.json') | ConvertFrom-Json
            if (-not $identity.internalTestBuild -or $identity.commit -ne $env:GITHUB_SHA -or [string]$identity.runId -ne $pair[1]) {
              throw "Package $($pair[0]) does not identify this reviewed source commit and build run."
            }
          }
      - name: Certify production Windows update and automatic readiness
        shell: pwsh
        env:
          UPDATE_SCENARIO: ${{ matrix.scenario }}
        run: |
          node scripts/windows-updater-certification.mjs --current-dir current --previous-dir previous --scenario $env:UPDATE_SCENARIO --output "windows-updater-$env:UPDATE_SCENARIO-observation.json" 2>&1 | Tee-Object "windows-updater-$env:UPDATE_SCENARIO-certification.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload immutable package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-artifact-update-certification-${{ matrix.scenario }}
          retention-days: 7
          path: |
            artifact-builds.json
            windows-updater-*-observation.json
            windows-updater-*-certification.log
            test-results/windows-installer-smoke/
          if-no-files-found: error

  baseline-dry-run:
    if: ${{ inputs.dry_run }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selection harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate test database client
        run: npx prisma generate
      - name: Test actual Windows baseline selection and installer observation
        run: npx vitest run scripts/windows-upgrade-baseline.test.ts scripts/windows-updater-certification.test.ts
