name: Windows Full Test

# Preserve complete real-Windows coverage after merge without adding its runtime to ordinary PRs or
# blocking a stable release. The native Notebook sandbox lifecycle runs once per batch, outside the
# sharded suite, and remains available as a focused workflow dry-run.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope
        required: true
        type: choice
        default: full
        options:
          - full
          - notebook-sandbox
          - regressions

permissions:
  actions: read
  contents: read

# A newer batch or manual run on the same ref supersedes stale advisory coverage.
concurrency:
  group: windows-full-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check for untested main changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.decide.outputs.should_test }}
    steps:
      - name: Check for untested main changes
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch always runs the selected ref."
            exit 0
          fi

          last_successful_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-full-test.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          if [[ "$last_successful_sha" == "$GITHUB_SHA" ]]; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "Windows full coverage already passed for $GITHUB_SHA."
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "Latest successful Windows full coverage is ${last_successful_sha:-unavailable}; testing $GITHUB_SHA."
          fi

  windows_full_test:
    name: Windows full test (${{ matrix.shard }}/3)
    needs: plan
    if: ${{ needs.plan.outputs.should_test == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'notebook-sandbox') }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VITEST_WINDOWS_FULL_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mode == 'regressions' && '[1]' || '[1,2,3]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs

      - name: Test complete suite shard
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        # SQLite-heavy integration suites contend heavily for Windows disk I/O when Vitest uses
        # every available core, and hosted-runner disk latency occasionally exceeds the default
        # per-test/hook budgets. Keep files serial and use bounded 60-second budgets; individual
        # tests still fail at that bound. The 35-minute job timeout covers checkout, npm ci, and a
        # slow serial suite without treating a still-progressing shard as a hang.
        run: npm test -- --shard=${{ matrix.shard }}/3 --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000

      - name: Test recent Windows regressions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'regressions' }}
        # Reuse the full job's runner, install and effective project budgets without running the
        # unrelated shards or native sandbox. These are the suites from the recent failed batches.
        run: >-
          npm test --
          vitest.config.test.ts
          scripts/ci/release-workflows.test.ts
          src/main/database/database-null-and-version-bounds.test.ts
          src/main/database/migration-service.test.ts
          src/main/notebook/runtime-service.test.ts
          src/main/artifacts/provenance-repository.test.ts
          src/main/artifacts/provenance-write-contract.test.ts
          src/main/delegation/production-composition.test.ts
          --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000

  notebook_sandbox:
    name: Windows Notebook sandbox lifecycle
    needs: plan
    if: ${{ needs.plan.outputs.should_test == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'regressions') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Report Windows toolchain
        shell: powershell
        run: |
          node --version
          npm --version
          rustc -Vv
          cargo --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $installationVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $toolsVersion = (Get-Content -LiteralPath (Join-Path $installationPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          Write-Host "Visual Studio $installationVersion"
          Write-Host "MSVC tools $toolsVersion"

      - name: Test Windows sandbox native source
        run: cargo test --locked --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml

      - name: Build Windows sandbox native host
        run: node packages/notebook-network-sandbox/vendor/windows/build.mjs x64

      - name: Test AppContainer ownership and removal lifecycle
        shell: powershell
        run: >-
          packages/notebook-network-sandbox/vendor/windows-src/ci/smoke.ps1
          -Exe packages/notebook-network-sandbox/vendor/windows/x64/notebook-appcontainer-host.exe
          -Mode Full
