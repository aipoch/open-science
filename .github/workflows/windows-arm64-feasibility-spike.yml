name: Temporary Windows ARM64 feasibility spike

on:
  push:
    branches:
      - feat/windows-arm64-feasibility-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: Native Windows ARM64 probe
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies without lifecycle builds
        run: npm ci --ignore-scripts --no-audit

      - name: Verify native Node architecture
        shell: pwsh
        run: |
          $arch = node -p "process.arch"
          if ($arch -ne 'arm64') { throw "Expected native ARM64 Node, got $arch" }
          "Node architecture: $arch" >> $env:GITHUB_STEP_SUMMARY

      - name: Probe ARM64 native npm dependencies
        shell: pwsh
        run: |
          $sharpScript = @'
          const sharp = require('sharp')
          sharp({ create: { width: 2, height: 2, channels: 4, background: { r: 255, g: 0, b: 0, alpha: 1 } } })
            .png()
            .toBuffer()
            .then((buffer) => console.log(`Sharp ARM64 transform: passed (${buffer.length} bytes)`))
            .catch((error) => { console.error(error); process.exit(1) })
          '@
          $sharpOutput = ($sharpScript | node 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Sharp ARM64 transform failed: $sharpOutput" }
          $sharpOutput >> $env:GITHUB_STEP_SUMMARY

          $engineCandidates = @(
            (Join-Path $PWD 'node_modules/@prisma/engines/query_engine-windows.dll.node'),
            (Join-Path $PWD 'node_modules/.prisma/client/query_engine-windows.dll.node')
          )
          if (-not ($engineCandidates | Where-Object { Test-Path $_ })) {
            $prismaGenerateOutput = (& npx prisma generate 2>&1 | Out-String)
            $prismaGenerateExitCode = $LASTEXITCODE
            $prismaGenerateOutput
            $global:LASTEXITCODE = 0
            if ($prismaGenerateExitCode -ne 0) {
              'Prisma native ARM64: generate failed; native engine remains unverified (expected blocker)' >> $env:GITHUB_STEP_SUMMARY
            }
          }

          $enginePath = $engineCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($enginePath) {
            $bytes = [IO.File]::ReadAllBytes($enginePath)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $prismaOutput = (& node -e "require('$($enginePath.Replace('\', '/'))')" 2>&1 | Out-String)
            $prismaExitCode = $LASTEXITCODE
            $prismaOutput
            if ($machine -eq 0xaa64 -and $prismaExitCode -eq 0) {
              'Prisma query engine: native ARM64' >> $env:GITHUB_STEP_SUMMARY
            } elseif ($machine -eq 0x8664 -and $prismaOutput -match 'not a valid Win32 application|invalid ELF header|Unable to require') {
              'Prisma query engine: incompatible x64 binary on native ARM64 (expected blocker)' >> $env:GITHUB_STEP_SUMMARY
            } else {
              throw ("Unexpected Prisma ARM64 probe result: PE 0x{0:x4}, exit {1}, output {2}" -f $machine, $prismaExitCode, $prismaOutput)
            }
          } else {
            'Prisma query engine: no generated engine available on ARM64' >> $env:GITHUB_STEP_SUMMARY
          }
          $global:LASTEXITCODE = 0

      - name: Fetch and execute pinned native ARM64 micromamba
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'micromamba-win-arm64.exe'
          node scripts/fetch-micromamba.mjs win-arm64 $dest
          $version = (& $dest --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "win-arm64 micromamba failed --version" }
          $bytes = [IO.File]::ReadAllBytes($dest)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xaa64) { throw ("Expected PE ARM64 0xaa64, got 0x{0:x4}" -f $machine) }
          "Micromamba: $version" >> $env:GITHUB_STEP_SUMMARY
          "PE machine: 0x{0:x4}" -f $machine >> $env:GITHUB_STEP_SUMMARY

      - name: Create and execute Anaconda Python 3.12 ARM64 notebook runtime
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'python-win-arm64-3.12'
          $mm = Join-Path $env:RUNNER_TEMP 'micromamba-win-arm64.exe'
          & $mm create --prefix $prefix --platform win-arm64 -y --channel https://repo.anaconda.com/pkgs/main python=3.12 matplotlib-base nomkl
          if ($LASTEXITCODE -ne 0) { throw 'Anaconda win-arm64 Python 3.12 environment creation failed' }
          $python = Join-Path $prefix 'python.exe'
          $version = (& $python --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Python failed --version' }
          $figures = Join-Path $env:RUNNER_TEMP 'python-3.12-figures'
          New-Item -ItemType Directory -Force $figures | Out-Null
          $env:OPEN_SCIENCE_KERNEL_FIGURES_DIR = $figures
          @'
          {"req_id":"arm64-python-3.12","code":"import sys\nimport matplotlib\nimport numpy as np\nimport matplotlib.pyplot as plt\nplt.plot([1, 2], [3, 4])\nprint(sys.version)\nprint(matplotlib.__version__)\nprint(np.__version__)"}
          '@ | & $python resources/notebook/python_loop.py | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'python-loop.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Python notebook loop failed' }
          $response = Get-Content (Join-Path $env:RUNNER_TEMP 'python-loop.jsonl') -Raw | ConvertFrom-Json
          if ($response.error) { throw "Notebook Python returned an error: $($response.error)" }
          if (-not $response.figures -or $response.figures.Count -lt 1) { throw 'Notebook Python produced no figure' }
          "Python runtime: $version" >> $env:GITHUB_STEP_SUMMARY
          "Notebook Python figure: passed" >> $env:GITHUB_STEP_SUMMARY

      - name: Probe Anaconda R 4.4 ARM64 closure
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'r-win-arm64-4.4'
          $mm = Join-Path $env:RUNNER_TEMP 'micromamba-win-arm64.exe'
          $output = (& $mm create --dry-run --json --prefix $prefix --platform win-arm64 -y --channel https://repo.anaconda.com/pkgs/main r-base=4.4 r-jsonlite r-biocmanager r-ggplot2 2>&1 | Out-String)
          $solveExitCode = $LASTEXITCODE
          $output | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'r-solve.json')
          $output
          if ($output -match '"success"\s*:\s*true') { throw 'Unexpectedly found a complete Anaconda win-arm64 R 4.4 closure' }
          if ($output -notmatch '"success"\s*:\s*false') { throw "R closure probe returned no solver result (exit $solveExitCode)" }
          $global:LASTEXITCODE = 0
          "Anaconda R 4.4 closure: unavailable (expected)" >> $env:GITHUB_STEP_SUMMARY

      - name: Create and execute Anaconda Python 3.13 ARM64 notebook runtime
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'python-win-arm64-3.13'
          $mm = Join-Path $env:RUNNER_TEMP 'micromamba-win-arm64.exe'
          & $mm create --prefix $prefix --platform win-arm64 -y --channel https://repo.anaconda.com/pkgs/main python=3.13 matplotlib-base nomkl
          if ($LASTEXITCODE -ne 0) { throw 'Anaconda win-arm64 Python 3.13 environment creation failed' }
          $python = Join-Path $prefix 'python.exe'
          $version = (& $python --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Python 3.13 failed --version' }
          $figures = Join-Path $env:RUNNER_TEMP 'python-3.13-figures'
          New-Item -ItemType Directory -Force $figures | Out-Null
          $env:OPEN_SCIENCE_KERNEL_FIGURES_DIR = $figures
          @'
          {"req_id":"arm64-python-3.13","code":"import sys\nimport matplotlib\nimport numpy as np\nimport matplotlib.pyplot as plt\nplt.plot([1, 2], [3, 4])\nprint(sys.version)\nprint(matplotlib.__version__)\nprint(np.__version__)"}
          '@ | & $python resources/notebook/python_loop.py | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'python-3.13-loop.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Python 3.13 notebook loop failed' }
          $response = Get-Content (Join-Path $env:RUNNER_TEMP 'python-3.13-loop.jsonl') -Raw | ConvertFrom-Json
          if ($response.error) { throw "Notebook Python 3.13 returned an error: $($response.error)" }
          if (-not $response.figures -or $response.figures.Count -lt 1) { throw 'Notebook Python 3.13 produced no figure' }
          "Python runtime: $version" >> $env:GITHUB_STEP_SUMMARY
          "Notebook Python 3.13 figure: passed" >> $env:GITHUB_STEP_SUMMARY

      - name: Report official win-arm64 conda closure
        shell: pwsh
        run: |
          node scripts/windows-arm64-conda-availability.mjs | Tee-Object -FilePath $env:RUNNER_TEMP\conda-report.json
          $report = Get-Content $env:RUNNER_TEMP\conda-report.json -Raw | ConvertFrom-Json
          "Package availability complete: $($report.packageAvailabilityComplete)" >> $env:GITHUB_STEP_SUMMARY
          "Dependency solve: $($report.dependencySolve)" >> $env:GITHUB_STEP_SUMMARY
          if ($report.packageAvailabilityComplete) {
            throw 'The expected incomplete upstream package closure changed; review before enabling ARM64 runtime staging.'
          }

      - name: Report official ARM64 runtime artifacts
        run: node scripts/windows-arm64-runtime-availability.mjs

      - name: Run focused ARM64 probe tests
        run: npx vitest run scripts/windows-arm64-conda-availability.test.ts scripts/windows-arm64-runtime-availability.test.ts scripts/fetch-micromamba.test.ts scripts/windows-arm64-feasibility-spike.test.ts

      - name: Check ARM64 AppContainer host target
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked --target aarch64-pc-windows-msvc --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml
