name: Nightly Publish

# Publish successful scheduled Nightlies, or explicitly promote a verified main run. Certification and
# regression jobs must also pass. The low-privilege triggering workflow prepares all metadata; this
# publisher uses gate code from main and never executes triggering-run code. Branch dry-runs may
# exercise candidate gate code without credentials; release writes require main.
on:
  workflow_run:
    workflows:
      - Nightly
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full Nightly run on main to recover
        required: true
        type: string
      dry_run:
        description: Validate artifacts and gates without changing the release or tag
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

# Serialize recovery and automatic publication; never cancel during asset replacement.
concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.dry_run)) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      # Candidate gate code is permitted only for an explicit dry-run and receives no credentials.
      - name: Checkout trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.sha || 'refs/heads/main' }}
          persist-credentials: false
          sparse-checkout: scripts/ci/nightly-publish-gates.mjs
          sparse-checkout-cone-mode: false

      - name: Fetch source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          source_file="$RUNNER_TEMP/nightly-source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$source_file"
          source_sha=$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' "$source_file")
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...main" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]] || exit 1

      - name: Validate source run
        id: source
        run: node scripts/ci/nightly-publish-gates.mjs --source-run "$RUNNER_TEMP/nightly-source.json"

      # runtime-certification and regression are continue-on-error in Nightly so the build and its
      # artifacts stay diagnosable, which means the run concludes `success` even when they failed.
      # The jobs API still reports each job's real conclusion, so gate publication on it here.
      - name: Fetch publication jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jobs_file="$RUNNER_TEMP/nightly-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | {name, conclusion}' | jq -s . > "$jobs_file"

      - name: Require advisory certification and regression jobs to have passed
        id: gates
        run: node scripts/ci/nightly-publish-gates.mjs --jobs "$RUNNER_TEMP/nightly-jobs.json" --publish

      - name: Check for an unpublished build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATES_OK: ${{ steps.gates.outputs.ok }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          if [ "$GATES_OK" != "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Nightly $SOURCE_RUN_ID has blocked publication gates; skipping publication of $SOURCE_SHA."
            exit 0
          fi

          error_file="$RUNNER_TEMP/nightly-published-error.log"
          if ! published=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>"$error_file"); then
            if grep -Eq 'HTTP (404|422)' "$error_file"; then
              published=
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi
          if [ -z "$published" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$published" = "$SOURCE_SHA" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Nightly already points at $SOURCE_SHA; skipping duplicate publication."
            exit 0
          fi

          # This check runs after the workflow-level publication lock is acquired. GitHub does not
          # guarantee concurrency queue ordering, so an older workflow may run after a newer one.
          # Only move the rolling tag forward along the same history; never let that older run
          # overwrite a newer publication.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$published...$SOURCE_SHA" --jq .status)
          case "$status" in
            ahead)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            identical|behind)
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "Nightly at $published is not older than $SOURCE_SHA; skipping stale publication."
              ;;
            *)
              echo "::error::Cannot safely advance nightly from $published to $SOURCE_SHA (comparison: $status)."
              exit 1
              ;;
          esac

  publish:
    permissions:
      actions: read
      contents: write
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - name: Download prepared nightly artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: artifacts
          pattern: '@(macos-*|linux-*|windows-x64|cli-*|nightly-ready)'
          merge-multiple: true

      - name: Verify prepared nightly metadata
        run: |
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/RELEASE-CERTIFICATION.json
          test -s artifacts/CLI-SHA256SUMS.txt
          cd artifacts
          sha256sum --check --strict SHA256SUMS.txt
          sha256sum --check --strict CLI-SHA256SUMS.txt
          # Require the exact five-target CLI set from this source, including in recovery dry-runs.
          for target in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64; do
            filename=$(jq -er --arg sha "$SOURCE_SHA" --arg target "$target" '
              select(.sourceSha == $sha and .target == $target and
                (.version | endswith("-nightly.g" + $sha[0:7])) ) | .filename' "$target.json")
            test -s "$filename"
            awk -v name="$filename" '$2 == name { found=1 } END { exit !found }' CLI-SHA256SUMS.txt
          done

      # Keep one long-lived GitHub Release and only update its assets and tag. Zenodo archives newly
      # published releases but ignores edits, so deleting and recreating this release would create a
      # new Zenodo version on every scheduled run. Advance the tag last so a failed upload is retried.
      - name: Check existing nightly release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          error_file="$RUNNER_TEMP/nightly-refresh-error.log"
          if ! release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id 2>"$error_file"); then
            cat "$error_file" >&2
            echo "The long-lived nightly release is missing; refusing to create a new Zenodo-visible release." >&2
            echo "Follow the recovery procedure in release-notes/README.md." >&2
            exit 1
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>"$error_file"; then
            cat "$error_file" >&2
            echo "The long-lived nightly tag is missing; refusing to publish without a retry marker." >&2
            echo "Follow the recovery procedure in release-notes/README.md." >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Refresh nightly release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ steps.release.outputs.release_id }}
        run: |
          asset_file="$RUNNER_TEMP/nightly-assets.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[].id' > "$asset_file"
          while IFS= read -r asset_id; do
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < "$asset_file"

      - name: Publish nightly pre-release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: nightly
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Nightly (latest main)
          prerelease: true
          body: |
            Automated build of the latest `main` (${{ env.SOURCE_SHA }}).

            Warning: unstable pre-release. macOS builds are ad-hoc signed (not notarized): on first
            launch, right-click -> Open, or run `xattr -dr com.apple.quarantine "<app>"`.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/open-science-cli-*.tar.gz
            artifacts/CLI-SHA256SUMS.txt
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json

      - name: Advance nightly tag
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly"
          -f sha="$SOURCE_SHA" -F force=true
