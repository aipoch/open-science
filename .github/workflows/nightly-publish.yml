name: Nightly Publish

# Publish only after a successful scheduled Nightly on main whose advisory certification and
# regression jobs also passed. The low-privilege triggering workflow prepares all metadata; this
# privileged workflow only checks out trusted gate code from main and never executes triggering-run code.
on:
  workflow_run:
    workflows:
      - Nightly
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

# Publication is a short serialized phase. Never cancel it between deleting and recreating the
# rolling release; a newer successful build waits its turn instead.
concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Trusted gate code comes from main, never from the triggering revision.
      - name: Checkout trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: scripts/ci/nightly-publish-gates.mjs
          sparse-checkout-cone-mode: false

      # runtime-certification and regression are continue-on-error in Nightly so the build and its
      # artifacts stay diagnosable, which means the run concludes `success` even when they failed.
      # The jobs API still reports each job's real conclusion, so gate publication on it here.
      - name: Require advisory certification and regression jobs to have passed
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jobs_file="$RUNNER_TEMP/nightly-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | {name, conclusion}' | jq -s . > "$jobs_file"
          node scripts/ci/nightly-publish-gates.mjs --jobs "$jobs_file"

      - name: Check for an unpublished build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATES_OK: ${{ steps.gates.outputs.ok }}
        run: |
          if [ "$GATES_OK" != "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Nightly $SOURCE_RUN_ID has blocked publication gates; skipping publication of $SOURCE_SHA."
            exit 0
          fi

          error_file="$RUNNER_TEMP/nightly-published-error.log"
          if ! published=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>"$error_file"); then
            if grep -Eq 'HTTP (404|422)' "$error_file"; then
              published=
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi
          if [ -z "$published" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$published" = "$SOURCE_SHA" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Nightly already points at $SOURCE_SHA; skipping duplicate publication."
            exit 0
          fi

          # This check runs after the workflow-level publication lock is acquired. GitHub does not
          # guarantee concurrency queue ordering, so an older workflow may run after a newer one.
          # Only move the rolling tag forward along the same history; never let that older run
          # overwrite a newer publication.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$published...$SOURCE_SHA" --jq .status)
          case "$status" in
            ahead)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            identical|behind)
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "Nightly at $published is not older than $SOURCE_SHA; skipping stale publication."
              ;;
            *)
              echo "::error::Cannot safely advance nightly from $published to $SOURCE_SHA (comparison: $status)."
              exit 1
              ;;
          esac

  publish:
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download prepared nightly artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: artifacts
          merge-multiple: true

      - name: Verify prepared nightly metadata
        run: |
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/RELEASE-CERTIFICATION.json

      # Keep one long-lived GitHub Release and only update its assets and tag. Zenodo archives newly
      # published releases but ignores edits, so deleting and recreating this release would create a
      # new Zenodo version on every scheduled run. Advance the tag last so a failed upload is retried.
      - name: Refresh nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          error_file="$RUNNER_TEMP/nightly-refresh-error.log"
          if ! release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id 2>"$error_file"); then
            cat "$error_file" >&2
            echo "The long-lived nightly release is missing; refusing to create a new Zenodo-visible release." >&2
            echo "Follow the recovery procedure in release-notes/README.md." >&2
            exit 1
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>"$error_file"; then
            cat "$error_file" >&2
            echo "The long-lived nightly tag is missing; refusing to publish without a retry marker." >&2
            echo "Follow the recovery procedure in release-notes/README.md." >&2
            exit 1
          fi

          asset_file="$RUNNER_TEMP/nightly-assets.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[].id' > "$asset_file"
          while IFS= read -r asset_id; do
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < "$asset_file"

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: nightly
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Nightly (latest main)
          prerelease: true
          body: |
            Automated build of the latest `main` (${{ env.SOURCE_SHA }}).

            Warning: unstable pre-release. macOS builds are ad-hoc signed (not notarized): on first
            launch, right-click -> Open, or run `xattr -dr com.apple.quarantine "<app>"`.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json

      - name: Advance nightly tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly"
          -f sha="$SOURCE_SHA" -F force=true
