name: CI Integrity

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-integrity-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: CI Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # Merge groups start from the target branch tip so stacked entries are inspected as one revision.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install trusted parsing toolchain
        run: npm ci --ignore-scripts --no-audit

      - name: Resolve inspected revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid pull request number" >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
            head_sha="$(git rev-parse FETCH_HEAD)"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ ! "$MERGE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid merge-group head SHA" >&2
              exit 1
            fi
            git check-ref-format "$MERGE_HEAD_REF"
            git fetch --no-tags origin "$MERGE_HEAD_REF"
            head_sha="$(git rev-parse FETCH_HEAD)"
            if [[ "$head_sha" != "$MERGE_HEAD_SHA" ]]; then
              echo "Merge-group head changed while resolving revisions" >&2
              exit 1
            fi
            # Inspect the whole group against the target branch tip, matching PR Gate preflight.
            base_sha="$(git merge-base --all HEAD "$head_sha")"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Merge group must have exactly one merge base with its target branch" >&2
              exit 1
            fi
          else
            echo "Unsupported CI Integrity event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve merge-group squash subject
        id: merge_group_title
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$MERGE_HEAD_REF" =~ ^(refs/heads/)?gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
            echo "Merge-group head ref does not identify a pull request: $MERGE_HEAD_REF" >&2
            exit 1
          fi
          pr_number="${BASH_REMATCH[2]}"
          title="$(gh pr view "$pr_number" --json title --jq .title)"
          if [[ -z "$title" ]]; then
            echo "Could not resolve the title of pull request #$pr_number" >&2
            exit 1
          fi
          delimiter="PR_TITLE_EOF_$(head -c 16 /dev/urandom | xxd -p)"
          {
            echo "title<<${delimiter}"
            echo "$title"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate pull request metadata
        env:
          EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title || steps.merge_group_title.outputs.title }}
          POLICY_SCOPE: title
        run: node scripts/ci/check-pr-policy.mjs

      - name: Inspect CI-sensitive changes
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: node scripts/ci/check-ci-integrity.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
