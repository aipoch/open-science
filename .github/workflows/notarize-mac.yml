name: Notarize macOS

# Decoupled macOS notarization + stapling.
#
# The build (build.yml) only SIGNS the mac dmg/zip; this workflow submits them to Apple's notary
# service, waits (with a hard time cap — no custom polling), staples the ticket, and re-emits the
# stapled artifacts. Splitting it out of the build means a slow notarization never ties up the build
# matrix, and it can be re-run on its own without a rebuild.
#
# Only unpublished run artifacts may change bytes. Re-run the normal release pipeline under a new
# version to replace an already published installer; its certification and CDN URL are immutable.
# workflow_dispatch remains as a clear failure for operators using the former backfill entry point.
# from_run distinguishes reusable calls from dispatch, including the manual notarization dry run.
#
# Time cap is enforced two ways: each dmg is submitted, then waited on for at most 15m
# (`notarytool wait --timeout 15m`), and the job as a whole is bounded by `timeout-minutes: 30`.
# The submission id is captured before waiting, so on a timeout the log still shows it plus the
# `notarytool info <id>` command to check the real status. A timeout is NOT a rejection — the Apple
# submission keeps running; publish (which needs this job) is skipped, so nothing bad is published,
# and staple-only dry runs can recover existing tickets without another submission.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Unused by the release path (operates on run artifacts); present for symmetry.'
        required: false
        type: string
        default: ''
      from_run:
        description: >-
          Operate on THIS run's build artifacts (download by name, re-emit stapled) instead of an
          existing Release. True for every workflow_call caller (release.yml, notarize-dryrun.yml).
        required: false
        type: boolean
        default: true
      source_run:
        description: 'Dry-run only: download existing release artifacts without modifying that run.'
        type: string
        default: ''
      architecture:
        description: 'Native architecture for focused dry runs; all for release.'
        type: string
        default: 'all'
      operation:
        description: 'notarize, staple (existing Apple tickets), or smoke (already stapled artifacts).'
        type: string
        default: 'notarize'
      certified_build:
        description: >-
          Preserve release-certification evidence from a verified build. False for the manual
          notarization dry run, whose build intentionally skips verification.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Retired backfill entry point; publish a new version through the release workflow'
        required: true

# Notarization updates run artifacts, never published GitHub Release assets.
permissions:
  contents: read
  actions: read

# Keyed by caller workflow + ref so the release and dry-run callers never queue behind each other.
# Never cancel mid-run: an interrupted Apple submission still counts against the release wait.
concurrency:
  group: notarize-mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notarize:
    name: Notarize + staple ${{ matrix.arch }}
    # The final package smoke launches the stapled app. Keep it architecture-native so the x64
    # launch is not silently dependent on Rosetta being installed on an Apple Silicon runner.
    runs-on: ${{ matrix.os }}
    # Hard ceiling so a stuck notarization can never run forever (see also the wait --timeout below).
    timeout-minutes: 30
    strategy:
      # One arch's Apple hiccup must not cancel the other.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"arch":"arm64","os":"macos-15"}]' || inputs.architecture == 'x64' && '[{"arch":"x64","os":"macos-15-intel"}]' || '[{"arch":"arm64","os":"macos-15"},{"arch":"x64","os":"macos-15-intel"}]') }}
    steps:
      - name: Require unpublished build artifacts
        env:
          FROM_RUN: ${{ inputs.from_run }}
          SOURCE_RUN: ${{ inputs.source_run }}
          OPERATION: ${{ inputs.operation }}
          ARCHITECTURE: ${{ inputs.architecture }}
          CERTIFIED_BUILD: ${{ inputs.certified_build }}
        run: |
          if [ "$FROM_RUN" != "true" ]; then
            echo "Published installers are immutable. Publish a new version through the release workflow." >&2
            exit 1
          fi

          case "$ARCHITECTURE" in all|arm64|x64) ;; *) exit 1 ;; esac
          case "$OPERATION" in notarize|staple|smoke) ;; *) exit 1 ;; esac
          if [ "$CERTIFIED_BUILD" = "true" ] && { [ -n "$SOURCE_RUN" ] || [ "$OPERATION" != "notarize" ] || [ "$ARCHITECTURE" != "all" ]; }; then
            echo "Focused modes cannot produce release certification." >&2; exit 1
          fi

      # Notarization is optional: if the API key secret isn't configured, no-op so a tagged release
      # still succeeds with the ad-hoc mac build (today's behavior) instead of failing here. Every
      # real step below is gated on this.
      - name: Gate on API key presence
        id: gate
        env:
          P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          OPERATION: ${{ inputs.operation }}
          CERTIFIED_BUILD: ${{ inputs.certified_build }}
        run: |
          if [ "$OPERATION" != "notarize" ] || [ -n "${P8_B64:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$CERTIFIED_BUILD" != "true" ]; then
            echo "Dry run requires Apple credentials for notarization." >&2; exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_API_KEY_P8_BASE64 not set — skipping notarization; mac stays as built."
          fi

      - name: Checkout certification tooling
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Validate reused release source
        if: steps.gate.outputs.enabled == 'true' && inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: node scripts/ci/validate-notarize-source.mjs

      # The notarize smoke test imports database-migration-ledger-smoke.mjs, which requires
      # @prisma/client at runtime. Install dependencies so the smoke script can resolve them.
      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/ci/npm-ci.mjs

      # Call path (from_run): pull this run's signed artifacts for the arch (uploaded by build.yml).
      - name: Download signed mac artifact (from this run)
        if: steps.gate.outputs.enabled == 'true' && inputs.from_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-${{ matrix.arch }}
          path: mac
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download macOS certification evidence (from this run)
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          inputs.from_run &&
          inputs.certified_build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: certification-macos-${{ matrix.arch }}
          path: mac

      # App Store Connect API key (.p8), stored base64-encoded so it survives as a single secret.
      - name: Write App Store Connect API key
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'notarize'
        env:
          P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # Notarize the dmg (Apple ticks every cdhash inside it, including the .app), then staple. The
      # zip ships the same signed .app, so its ticket already exists from the dmg submission — just
      # staple that .app and repackage (stapler cannot target a .zip directly). No second submission.
      - name: Notarize + staple
        if: steps.gate.outputs.enabled == 'true'
        env:
          # Diagnose public ticket transport only; never log authenticated notary requests.
          CFNETWORK_DIAGNOSTICS: ${{ !inputs.certified_build && inputs.source_run != '' && inputs.operation != 'notarize' && '3' || '0' }}
          OPERATION: ${{ inputs.operation }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          nt="$RUNNER_TEMP/notarytool.json"
          shopt -s nullglob
          stapler_prefix=()

          if [ "${CFNETWORK_DIAGNOSTICS:-0}" = 3 ]; then
            # Diagnostic A/B: deny QUIC only in this child process; retain TLS and normal TCP.
            stapler_prefix=(/usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote udp "*:443"))')
            echo 'Stapler transport experiment: child-process UDP/443 denied'
            sw_vers
            xcodebuild -version
            xcrun --find stapler
            network_log="$RUNNER_TEMP/stapler-network.jsonl"
            (umask 077; touch "$network_log")
            sudo /usr/bin/log stream --style ndjson --level debug \
              --predicate 'process == "stapler"' > "$network_log" 2>&1 &
            network_pid=$!
            finish_network_diagnostics() {
              local code=$?
              trap - EXIT
              sudo kill -TERM "$network_pid" || true
              wait "$network_pid" || true
              node scripts/ci/apple-notarization-retry.mjs --summarize-network "$network_log" || \
                echo '::warning::CFNetwork summaries unavailable'
              rm -f "$network_log"
              exit "$code"
            }
            trap finish_network_diagnostics EXIT
          fi

          if [ "$OPERATION" = "notarize" ] && { [ -z "${KEY_ID:-}" ] || [ -z "${ISSUER:-}" ]; }; then
            echo "::error::APPLE_API_KEY_ID / APPLE_API_ISSUER are not set — cannot notarize"; exit 1
          fi

          # submit <file>: submit first (capture the id), then wait up to 15m for a verdict.
          # Splitting it out guarantees the submission id is known even if the wait times out, so
          # the log always shows how to check the real status independently (notarytool info).
          submit() {
            local f="$1" id status wait_code=0 submit_code=0
            echo "==> submit: $f"
            xcrun notarytool submit "$f" \
              --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" \
              --no-wait --output-format json > "$nt" || submit_code=$?
            cat "$nt"
            if [ "$submit_code" != 0 ]; then
              echo "Submission outcome is uncertain; do not blindly resubmit. Inspect the output and Apple history." >&2
              exit "$submit_code"
            fi
            id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).id || "")' "$nt")
            if [ -z "$id" ]; then echo "::error::could not read submission id for $f"; exit 1; fi

            echo "==> submission id: $id — waiting up to 15m"
            node scripts/ci/apple-notarization-retry.mjs notarytool wait "$id" \
              --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" \
              --timeout 15m --output-format json > "$nt" || wait_code=$?
            status=$(node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).status || "") } catch { console.log("Unknown") }' "$nt")
            cat "$nt"

            case "$status" in
              Accepted) [ "$wait_code" = 0 ] || exit "$wait_code"; return 0 ;;
              Invalid|Rejected)
                # Real bad build — will never pass Gatekeeper. Show the per-issue reasons.
                echo "::error::notarization REJECTED ($status) for $f — fix signing/entitlements:"
                node scripts/ci/apple-notarization-retry.mjs notarytool log "$id" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" || true
                exit 1 ;;
              *)
                # Timeout, transport or unknown failure: unresolved, not evidence of acceptance or rejection.
                echo "::error::notarization status is unresolved for $f (exit $wait_code); see preserved diagnostics."
                echo "::error::submission id: $id"
                echo "Check the real status any time (independent of CI), then use a staple-only dry run once Accepted:"
                echo "  xcrun notarytool info $id --key <AuthKey.p8> --key-id $KEY_ID --issuer $ISSUER"
                exit 1 ;;
            esac
          }

          dmgs=(mac/*-mac-*.dmg)
          zips=(mac/*-mac-*.zip)
          if [ "${#dmgs[@]}" != 1 ] || [ "${#zips[@]}" != 1 ]; then
            echo "Expected exactly one DMG and ZIP." >&2; exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            if [ "$OPERATION" = "notarize" ]; then submit "$dmg"; fi
            if [ "$OPERATION" != "smoke" ]; then
              "${stapler_prefix[@]}" node scripts/ci/apple-notarization-retry.mjs stapler staple "$dmg"
            fi
            "${stapler_prefix[@]}" node scripts/ci/apple-notarization-retry.mjs stapler validate "$dmg"
          done

          for zip in "${zips[@]}"; do
            work=$(mktemp -d)
            ditto -x -k "$zip" "$work"
            app=$(find "$work" -maxdepth 1 -name '*.app' -print -quit)
            if [ -z "$app" ]; then echo "no .app inside $zip" >&2; exit 1; fi
            if [ "$OPERATION" != "smoke" ]; then
              "${stapler_prefix[@]}" node scripts/ci/apple-notarization-retry.mjs stapler staple "$app"
            fi
            "${stapler_prefix[@]}" node scripts/ci/apple-notarization-retry.mjs stapler validate "$app"
            if [ "$OPERATION" != "smoke" ]; then
              ditto -c -k --keepParent "$app" "$zip"
            fi
            rm -rf "$work"
          done

      # Stapling/repacking changes the shipped bytes. Mount/extract and launch both final artifacts,
      # and require Gatekeeper assessment before their refreshed hashes can be certified.
      - name: Smoke test final macOS packages
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 10
        run: node scripts/macos-package-smoke.mjs --artifact-dir mac --gatekeeper

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Stapling repackaged the zip (new bytes), so the build-time feed — written over the PRE-staple
      # zip — now carries a stale sha512/size that would fail the updater's signature check. The build
      # runs the default `latest` channel, so it emits `latest-mac.yml` per arch; drop that stale copy
      # and regenerate a per-arch intermediate `${arch}-mac.yml` from the stapled zip (recompute sha512
      # base64 + size, minimal zip-only feed, no blockmap -> full-zip mac updates for v1). The publish
      # job merges the two arch intermediates into the single `latest-mac.yml` the updater polls.
      # Derived purely from the final stapled zip in this unpublished run.
      - name: Regenerate mac update feed
        if: steps.gate.outputs.enabled == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -f mac/latest-mac.yml
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const arch = process.env.ARCH;
            const zips = fs.readdirSync("mac").filter((f) => f.endsWith(`-mac-${arch}.zip`));
            if (zips.length !== 1) {
              console.error(`::error::expected exactly one mac-${arch} zip, found ${zips.length}`);
              process.exit(1);
            }
            const zip = zips[0];
            const buf = fs.readFileSync(path.join("mac", zip));
            const sha512 = crypto.createHash("sha512").update(buf).digest("base64");
            const m = zip.match(/-(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)-mac-/);
            const version = m ? m[1] : "0.0.0";
            const yml =
              `version: ${version}\n` +
              `files:\n` +
              `  - url: ${zip}\n` +
              `    sha512: ${sha512}\n` +
              `    size: ${buf.length}\n` +
              `path: ${zip}\n` +
              `sha512: ${sha512}\n` +
              `releaseDate: ${JSON.stringify(new Date().toISOString())}\n`;
            fs.writeFileSync(path.join("mac", `${arch}-mac.yml`), yml);
            process.stdout.write(yml);
          '

      # Stapling changes the installer bytes. Re-hash the final artifacts while preserving the
      # package certification signal already established by the separate smoke job.
      - name: Refresh macOS certification evidence
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          inputs.from_run &&
          inputs.certified_build
        run: >-
          node scripts/ci/release-certification-evidence.mjs write
          --platform "macos-${{ matrix.arch }}"
          --artifact-dir mac
          --output "mac/certification-macos-${{ matrix.arch }}.json"
          --electron-p0 not-applicable
          --visual-regression not-applicable
          --package-smoke passed
          --database-migration-certification mac/database-migration-certification.json
          --authenticode not-applicable

      - name: Preserve final database certification name
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          inputs.from_run &&
          inputs.certified_build
        run: >-
          mv mac/database-migration-certification.json
          "mac/database-migration-certification-macos-${{ matrix.arch }}.json"

      - name: Replace macOS certification evidence
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          inputs.from_run &&
          inputs.certified_build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: certification-macos-${{ matrix.arch }}
          overwrite: true
          retention-days: 7
          path: |
            mac/certification-macos-${{ matrix.arch }}.json
            mac/database-migration-certification-macos-${{ matrix.arch }}.json
          if-no-files-found: error

      # Call path: replace this run's signed artifacts with the stapled ones (same names) plus the
      # regenerated ${arch}-mac.yml feed, so the publish job's merge-multiple download picks them up.
      # overwrite deletes the prior artifacts of this name in the run. The stale mac blockmap is dropped
      # (v1 does full-zip mac updates), leaving the dmg, zip, and per-arch feed.
      - name: Re-emit stapled artifact (for publish)
        if: steps.gate.outputs.enabled == 'true' && inputs.from_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.arch }}
          overwrite: true
          retention-days: 7
          path: |
            mac/*-mac-*.dmg
            mac/*-mac-*.zip
            mac/*-mac.yml
          if-no-files-found: error
