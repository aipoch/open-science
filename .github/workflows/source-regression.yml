name: Source Regression

# Batch supplemental source coverage independently of package certification/publication.
on:
  schedule:
    - cron: '37 19 * * *' # UTC; overnight in Asia/Singapore
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: source-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Check for untested main changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.decide.outputs.should_test }}
    steps:
      - name: Check last successful scheduled revision
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/source-regression.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
          if [[ "$previous" == "$GITHUB_SHA" ]]; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          fi

  regression:
    name: Supplemental source regression (macOS)
    needs: plan
    if: needs.plan.outputs.should_test == 'true'
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Build Electron application
        run: npm run build:e2e
      # Collect both outcomes using one build and one macOS slot. Neither failure is advisory.
      - name: Run supplemental regressions
        id: regressions
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: regressions
          include-capacity: 'true'
      - name: Run supplemental delegation
        id: delegation
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: delegation
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-regression-${{ github.run_attempt }}
          retention-days: 5
          path: |
            blob-report/
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Enforce both supplemental suites
        if: always()
        shell: bash
        env:
          REGRESSIONS: ${{ steps.regressions.outcome }}
          DELEGATION: ${{ steps.delegation.outcome }}
        run: |
          [[ "$REGRESSIONS" == "success" && "$DELEGATION" == "success" ]]
