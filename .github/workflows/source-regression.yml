name: Agent Recovery Native Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, python: .scratch/lifecycle-python/bin/python }
          - { os: macos-latest, platform: macos, python: .scratch/lifecycle-python/bin/python }
          - { os: windows-latest, platform: windows, python: .scratch/lifecycle-python/Scripts/python.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LIFECYCLE_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Load unchanged harness from pinned PR revision
        run: |
          git fetch origin 153c5e3628e1fe263b28b772b2976ca600cba713
          git restore --source=153c5e3628e1fe263b28b772b2976ca600cba713 -- scripts/ci/lifecycle-process-table.py scripts/ci/process-lifecycle-observer.mjs scripts/ci/process-lifecycle-canary.mjs scripts/ci/process-lifecycle-observer.node-test.mjs scripts/ci/process-lifecycle.integration.test.ts scripts/ci/run-process-lifecycle.mjs
          python -m venv .scratch/lifecycle-python
          "$LIFECYCLE_PYTHON" -m pip install psutil==7.1.0
      - run: node scripts/ci/npm-ci.mjs
      - name: Owner and portable fail-closed regressions
        run: npm test -- src/main/process-tree.test.ts src/main/process-tree-cold-recovery.test.ts src/main/process-tree-darwin-recovery.test.ts src/main/delegation/process-ownership.test.ts src/main/notebook/shell-process-ownership.test.ts
      - name: Original agent-recovery and agent-stop scenarios
        env:
          RUN_PROCESS_LIFECYCLE: '1'
          LIFECYCLE_OUTPUT: test-results/agent-focused
        run: npx vitest run scripts/ci/process-lifecycle.integration.test.ts -t 'agent-(recovery|stop)'
      - name: Full original Linux harness including known independent MCP failures
        if: matrix.platform == 'linux'
        continue-on-error: true
        env:
          LIFECYCLE_OUTPUT: test-results/full-linux
        run: node scripts/ci/run-process-lifecycle.mjs core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-recovery-${{ matrix.platform }}
          path: test-results/
