name: Agent Recovery Native Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LIFECYCLE_PYTHON: .scratch/lifecycle-python/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Load unchanged harness from pinned PR revision
        run: |
          git fetch origin 153c5e3628e1fe263b28b772b2976ca600cba713
          git restore --source=153c5e3628e1fe263b28b772b2976ca600cba713 -- scripts/ci/lifecycle-process-table.py scripts/ci/process-lifecycle-observer.mjs scripts/ci/process-lifecycle-canary.mjs scripts/ci/process-lifecycle-observer.node-test.mjs scripts/ci/process-lifecycle.integration.test.ts scripts/ci/run-process-lifecycle.mjs
          python -m venv .scratch/lifecycle-python
          "$LIFECYCLE_PYTHON" -m pip install psutil==7.1.0
      - run: node scripts/ci/npm-ci.mjs
      - run: npm run pretest
      - name: Preserve controlled baseline failure with parser-only fix
        continue-on-error: true
        run: |
          git fetch origin 74bcfc6a042678344a4398658d49132a840c8d79
          git show 74bcfc6a042678344a4398658d49132a840c8d79:src/main/process-tree.ts > src/main/process-tree.ts
          npx vitest run src/main/delegation/process-ownership.test.ts -t 'newer unrelated process'
      - name: Restore final product and run controlled recovery regression
        run: |
          git restore --source=HEAD -- src/main/process-tree.ts
          npm test -- src/main/process-tree.test.ts src/main/process-tree-cold-recovery.test.ts src/main/process-tree-darwin-recovery.test.ts src/main/delegation/process-ownership.test.ts src/main/notebook/shell-process-ownership.test.ts
      - name: Full unchanged Linux lifecycle harness
        env:
          LIFECYCLE_OUTPUT: test-results/full-linux-final
        run: node scripts/ci/run-process-lifecycle.mjs core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-recovery-controlled-final
          path: test-results/
