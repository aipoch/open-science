name: Agent Recovery Native Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LIFECYCLE_PYTHON: .scratch/lifecycle-python/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Load unchanged harness from pinned PR revision
        run: |
          git fetch origin 153c5e3628e1fe263b28b772b2976ca600cba713
          git restore --source=153c5e3628e1fe263b28b772b2976ca600cba713 -- scripts/ci/lifecycle-process-table.py scripts/ci/process-lifecycle-observer.mjs scripts/ci/process-lifecycle-canary.mjs scripts/ci/process-lifecycle-observer.node-test.mjs scripts/ci/process-lifecycle.integration.test.ts scripts/ci/run-process-lifecycle.mjs
          python -m venv .scratch/lifecycle-python
          "$LIFECYCLE_PYTHON" -m pip install psutil==7.1.0
      - run: node scripts/ci/npm-ci.mjs
      - name: Instrument recovery decisions
        run: node scripts/ci/agent-recovery-probe.cjs
      - name: Diagnose full unchanged harness
        continue-on-error: true
        env:
          LIFECYCLE_OUTPUT: test-results/full-linux-diagnostic
        run: node scripts/ci/run-process-lifecycle.mjs core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-recovery-full-diagnostic
          path: test-results/
