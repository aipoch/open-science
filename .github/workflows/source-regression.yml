name: Source Regression

# Run complete portable and Mac source coverage twice daily, independently of package publication.
# Scheduled failures open or refresh a tracking issue labelled ci-scheduled-failure.
on:
  schedule:
    - cron: '37 5,17 * * *' # UTC; 01:37 and 13:37 Asia/Singapore
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope
        required: true
        type: choice
        default: full
        options:
          - full
          - portable
          - functional
          - workspace
          - regressions
          - capacity
          - delegation
          - scheduled-fixes
          - presentation
          - workspace-images
          - presentation-screening
          - runtime-evidence
          - static-impact
      shard:
        description: Regression shard for a focused regressions dry-run
        type: choice
        default: all
        options: [all, '1', '2', '3']
      test_pattern:
        description: Optional Playwright title regex for the scheduled-fixes diagnostic only
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: source-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_impact:
    name: Static impact tool (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'static-impact' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify isolated tool and installed consumer
        run: npm run check:test-impact-package

  runtime_evidence:
    name: Runtime module evidence (diagnostic sample)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'runtime-evidence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Prepare project tests
        run: npm run pretest
      - name: Collect independent test observations
        run: node scripts/ci/runtime-module-evidence.mjs
      - name: Upload diagnostic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-module-evidence-${{ github.run_attempt }}
          path: coverage/runtime-module-evidence/
          retention-days: 7
          if-no-files-found: warn

  macos_setup:
    name: Prepare complete Mac source regression
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && inputs.mode != 'portable' && inputs.mode != 'runtime-evidence' && inputs.mode != 'static-impact' }}
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      node_version: ${{ steps.node.outputs.node-version }}
    steps:
      - name: Select Mac suites
        id: select
        shell: node {0}
        env:
          MODE: ${{ inputs.mode || 'full' }}
          SHARD: ${{ inputs.shard || 'all' }}
        run: |
          const { appendFileSync } = require('node:fs')
          const groups = ['functional', 'workspace', 'presentation', 'regressions', 'capacity', 'delegation']
          const diagnostics = ['scheduled-fixes', 'workspace-images', 'presentation-screening']
          const { MODE: mode, SHARD: shard } = process.env
          if (!['full', ...groups, ...diagnostics].includes(mode)) throw new Error('Invalid Mac scope')
          if (!['all', '1', '2', '3'].includes(shard)) throw new Error('Invalid regression shard')
          const selected = mode === 'full' ? groups : [mode]
          const include = selected.flatMap(group => group === 'regressions'
            ? (mode === 'regressions' && shard !== 'all' ? [Number(shard)] : [1, 2, 3]).map(shard => ({ group, shard }))
            : [{ group, shard: 1 }])
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Build Electron application
        run: npm run build:e2e
      - name: Build web application
        run: npm run build:web
      - name: Test snapshot transport
        run: npx vitest run scripts/ci/e2e-setup-snapshot.test.ts
      - name: Pack E2E setup
        run: node scripts/ci/e2e-setup-snapshot.mjs pack "$RUNNER_TEMP/e2e-setup"
      - name: Upload E2E setup
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-regression-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-setup/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  regression:
    name: Mac source (${{ matrix.group }}, shard ${{ matrix.shard }})
    needs: [macos_setup]
    if: ${{ !cancelled() && needs.macos_setup.result == 'success' }}
    runs-on: macos-15
    # Presentation has up to 35 minutes of suite budgets; reserve restore/upload time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.macos_setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.macos_setup.outputs.node_version }}
          package-manager-cache: false
      - name: Download E2E setup
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.macos_setup.outputs.artifact_id }}
          path: ${{ runner.temp }}/e2e-setup/
          merge-multiple: true
      - name: Restore E2E setup
        run: node scripts/ci/e2e-setup-snapshot.mjs restore "$RUNNER_TEMP/e2e-setup"
      - name: Install headless Chromium
        if: ${{ matrix.group == 'functional' || matrix.group == 'presentation' || matrix.group == 'presentation-screening' }}
        run: npx playwright install chromium --only-shell
      - name: Test scheduled regression fixes
        id: scheduled_fixes
        continue-on-error: true
        if: ${{ matrix.group == 'scheduled-fixes' }}
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: |
          if [[ -n "$TEST_PATTERN" ]]; then
            npx playwright test --grep "$TEST_PATTERN" --retries=0 --fail-on-flaky-tests --global-timeout=1200000
          else
            npx playwright test e2e/session-turn-outcome.spec.ts \
              e2e/auto-review-stop-resume.spec.ts e2e/transcript-capacity.spec.ts \
              e2e/desktop-runtime-restart.spec.ts e2e/desktop-runtime-preview-recovery.spec.ts \
              e2e/pdf-workspace-translation.spec.ts \
              --retries=0 --fail-on-flaky-tests --global-timeout=1200000
          fi
      - name: Run complete Mac functional journeys
        id: functional
        if: ${{ matrix.group == 'functional' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/functional
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/functional.json
        # Leave headroom for slower macOS runners to finish every journey and teardown.
        run: npm run test:e2e:journey -- --fail-on-flaky-tests --global-timeout=900000
      - name: Run complete Mac workspace journeys
        id: workspace
        if: ${{ matrix.group == 'workspace' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/workspace
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/workspace.json
        run: npm run test:e2e:workspace -- --fail-on-flaky-tests --global-timeout=1500000
      - name: Test workspace message images
        id: workspace_images
        if: ${{ matrix.group == 'workspace-images' }}
        run: >-
          npx playwright test e2e/workspace-files.spec.ts
          --grep 'normalizes OpenCode inline thinking before publishing sanitized message images'
          --fail-on-flaky-tests
      - name: Run complete Mac browser and visual coverage
        id: presentation
        if: ${{ matrix.group == 'presentation' }}
        continue-on-error: true
        run: |
          # All 462 browser tests passed before the 10-minute budget expired in
          # teardown. Keep visual's separate budget and collect both outcomes.
          browser_status=0
          PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report/browser PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/browser.json npx playwright test --config e2e/playwright.browser.config.ts --fail-on-flaky-tests --global-timeout=900000 || browser_status=$?
          PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report/visual PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/visual.json npm run test:e2e:visual -- --fail-on-flaky-tests --global-timeout=600000 --output=test-results/visual
          exit "$browser_status"
      - name: Test concurrent screening flights
        id: presentation_screening
        if: ${{ matrix.group == 'presentation-screening' }}
        run: >-
          PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report/browser PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/browser.json npx playwright test --config e2e/playwright.browser.config.ts
          e2e/browser/smart-screening.spec.ts
          --grep 'flies all four committed papers per second concurrently into the same pile'
          --repeat-each=5
          --fail-on-flaky-tests
      - name: Run complete Mac accessibility checks
        id: accessibility
        if: ${{ matrix.group == 'presentation' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/accessibility
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/accessibility.json
        run: npm run test:e2e:accessibility:signal
      - name: Run supplemental regressions
        id: regressions
        if: ${{ matrix.group == 'regressions' || matrix.group == 'capacity' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: ${{ matrix.group }}
          include-capacity: 'false'
          shard: ${{ matrix.group == 'regressions' && format('{0}/3', matrix.shard) || '' }}
      - name: Run supplemental delegation
        id: delegation
        if: ${{ matrix.group == 'delegation' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: delegation
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-regression-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_attempt }}
          retention-days: 5
          path: |
            blob-report/
            test-results/
            playwright-report/
          if-no-files-found: error
      - name: Enforce selected Mac suite
        if: always()
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          FUNCTIONAL: ${{ steps.functional.outcome }}
          WORKSPACE: ${{ steps.workspace.outcome }}
          PRESENTATION: ${{ steps.presentation.outcome }}
          ACCESSIBILITY: ${{ steps.accessibility.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          DELEGATION: ${{ steps.delegation.outcome }}
          SCHEDULED_FIXES: ${{ steps.scheduled_fixes.outcome }}
          WORKSPACE_IMAGES: ${{ steps.workspace_images.outcome }}
          PRESENTATION_SCREENING: ${{ steps.presentation_screening.outcome }}
        run: |
          case "$GROUP" in
            functional) test "$FUNCTIONAL" = success ;;
            workspace) test "$WORKSPACE" = success ;;
            presentation) [[ "$PRESENTATION" == success && "$ACCESSIBILITY" == success ]] ;;
            regressions|capacity) test "$REGRESSIONS" = success ;;
            delegation) test "$DELEGATION" = success ;;
            scheduled-fixes) test "$SCHEDULED_FIXES" = success ;;
            workspace-images) test "$WORKSPACE_IMAGES" = success ;;
            presentation-screening) test "$PRESENTATION_SCREENING" = success ;;
            *) exit 1 ;;
          esac

  portable:
    name: Complete portable ${{ matrix.scope }} tests (Ubuntu, shard ${{ matrix.shard }}/${{ matrix.total }})
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'portable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: host, shard: 1, total: 4 }
          - { scope: host, shard: 2, total: 4 }
          - { scope: host, shard: 3, total: 4 }
          - { scope: host, shard: 4, total: 4 }
          - { scope: packages, shard: 1, total: 2 }
          - { scope: packages, shard: 2, total: 2 }
    env:
      VITEST_PORTABLE_CI: '1'
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
      OPEN_SCIENCE_CI_PORTABLE_SCOPE: ${{ matrix.scope }}
      OPEN_SCIENCE_CI_EXCLUDED_PACKAGE_ROOTS: '[]'
      OPEN_SCIENCE_CI_SELECTED_PACKAGE_ROOTS: '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test complete portable shard
        run: >-
          npm test -- --coverage --coverage.reporter=text-summary --testTimeout=30000
          --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=dot --reporter=blob --reporter=github-actions
          --outputFile=vitest-reports/blob-${{ matrix.scope }}-${{ matrix.shard }}.json
      - name: Upload portable reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scheduled-portable-${{ matrix.scope }}-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 5
          if-no-files-found: error

  portable_report:
    name: Complete portable coverage
    needs: [portable]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'portable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_PORTABLE_CI: '1'
      OPEN_SCIENCE_CI_EXCLUDED_PACKAGE_ROOTS: '[]'
      OPEN_SCIENCE_CI_SELECTED_PACKAGE_ROOTS: '[]'
    steps:
      - name: Require every portable shard
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: test "$PORTABLE_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install report dependencies
        run: node scripts/ci/npm-ci.mjs --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Download every portable report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: scheduled-portable-*
          path: vitest-reports
          merge-multiple: true
      - name: Require all host and package reports
        shell: bash
        run: |
          for shard in 1 2 3 4; do test -s "vitest-reports/blob-host-${shard}.json"; done
          for shard in 1 2; do test -s "vitest-reports/blob-packages-${shard}.json"; done
      - name: Merge complete coverage
        run: npx vitest run --merge-reports=vitest-reports --coverage --passWithNoTests
      - name: Test i18n catalog excluded from portable shards
        env:
          VITEST_PORTABLE_CI: '0'
        run: npx vitest run src/renderer/src/i18n/resources.test.ts
      - name: Upload complete portable coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scheduled-portable-coverage
          path: coverage/
          retention-days: 5
          if-no-files-found: warn

  packages:
    name: Complete installed package verification (Ubuntu)
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify all installed consumers
        uses: ./.github/actions/verify-packages

  # Scheduled failures open or refresh one tracking issue; a later scheduled success closes it.
  report:
    name: Report scheduled outcome
    needs: [macos_setup, regression, packages, portable, portable_report]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/report-scheduled-failure.mjs
          sparse-checkout-cone-mode: false
      - name: Open, refresh, or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CONCLUSION: ${{ needs.macos_setup.result == 'success' && needs.regression.result == 'success' && needs.packages.result == 'success' && needs.portable.result == 'success' && needs.portable_report.result == 'success' && 'success' || 'failure' }}
        with:
          script: |
            const { reportScheduledOutcome } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/report-scheduled-failure.mjs`)
            await reportScheduledOutcome({
              github,
              repo: context.repo,
              workflowFile: 'source-regression.yml',
              workflowName: context.workflow,
              runId: context.runId,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: context.sha,
              conclusion: process.env.CONCLUSION,
              log: core.info
            })
