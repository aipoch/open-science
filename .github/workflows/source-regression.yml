name: Linux Agent Recovery Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Load pinned independent harness
        run: |
          git fetch origin 153c5e3628e1fe263b28b772b2976ca600cba713
          git restore --source=153c5e3628e1fe263b28b772b2976ca600cba713 -- scripts/ci/lifecycle-process-table.py scripts/ci/process-lifecycle-observer.mjs scripts/ci/process-lifecycle-canary.mjs scripts/ci/process-lifecycle-observer.node-test.mjs scripts/ci/process-lifecycle.integration.test.ts scripts/ci/run-process-lifecycle.mjs
          python3 -m venv .scratch/lifecycle-python
          .scratch/lifecycle-python/bin/pip install psutil==7.1.0
      - run: node scripts/ci/npm-ci.mjs
      - name: Original unchanged agent-recovery
        continue-on-error: true
        env:
          RUN_PROCESS_LIFECYCLE: '1'
          LIFECYCLE_PYTHON: .scratch/lifecycle-python/bin/python
          LIFECYCLE_OUTPUT: test-results/baseline
        run: npm test -- scripts/ci/process-lifecycle.integration.test.ts -t agent-recovery
      - name: Instrument blocked branches
        run: node scripts/ci/agent-recovery-probe.cjs
      - name: Diagnostic agent-recovery
        continue-on-error: true
        env:
          RUN_PROCESS_LIFECYCLE: '1'
          LIFECYCLE_PYTHON: .scratch/lifecycle-python/bin/python
          LIFECYCLE_OUTPUT: test-results/diagnostic
        run: npx vitest run scripts/ci/process-lifecycle.integration.test.ts -t agent-recovery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-agent-recovery-probe
          path: test-results/
