name: Windows PR upgrade version signing (manual, no publish)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: pr3599-upgrade-version-signing
  cancel-in-progress: false
jobs:
  build:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      platform_name: windows-x64
      skip_verify: true
      sign_windows: true
