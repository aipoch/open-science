name: Windows signing (dry-run)

# Manual, no-publish Windows Authenticode integration check. Azure mode signs the app and NSIS
# installer during packaging, then smoke-tests the signed artifact. SignPath mode keeps the
# existing test-certificate check for the unsigned installer.
#
# Reuses the release build workflow for Windows x64 only, extracts exactly one NSIS setup EXE from
# its immutable build artifact, and submits that raw PE file to SignPath's test-signing policy. The
# signed installer is retained as a run artifact for inspection. This workflow never creates or
# modifies a GitHub Release and does not change the release/nightly publishing path.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Signing provider for this dry run
        type: choice
        default: signpath
        options:
          - signpath
          - azure
      updater_target_run:
        description: Optional signed stable artifact run to upgrade to from a fresh signed prerelease
        type: string
        default: ''
      updater_source_run:
        description: Optional existing signed prerelease artifact run for certification-only retries
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-signing-dry-run-${{ github.ref }}-${{ inputs.updater_source_run || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.updater_source_run == '' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      platform_name: windows-x64
      skip_verify: true
      sign_windows: ${{ inputs.provider == 'azure' }}
      nightly: ${{ inputs.updater_target_run != '' }}

  updater-recovery:
    name: Certify signed Windows update and owned process cleanup
    if: ${{ !cancelled() && inputs.provider == 'azure' && inputs.updater_target_run != '' && (needs.build.result == 'success' || inputs.updater_source_run != '') }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install certification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Download signed prerelease source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: previous
          run-id: ${{ inputs.updater_source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download signed stable target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: current
          run-id: ${{ inputs.updater_target_run }}
          github-token: ${{ github.token }}
      - name: Verify both installer signatures
        shell: pwsh
        run: |
          foreach ($directory in @('previous', 'current')) {
            $installers = @(Get-ChildItem -LiteralPath $directory -Filter '*-win-x64-setup.exe' -File)
            if ($installers.Count -ne 1) { throw "Expected one installer in $directory." }
            $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'AIPOCH PTE\. LTD\.') {
              throw "Invalid installer signature in $directory."
            }
          }
      - name: Certify blocked update and successful retry
        shell: pwsh
        env:
          OPEN_SCIENCE_E2E_STORAGE_ROOT: ${{ runner.temp }}\open-science-updater-recovery
        run: |
          node scripts/windows-updater-certification.mjs --current-dir current --previous-dir previous --foreign-process --owned-processes --windows-recovery --notebook --output windows-updater-recovery.json 2>&1 |
            Tee-Object -FilePath windows-updater-recovery.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload updater recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-updater-recovery
          path: windows-updater-recovery.*
          if-no-files-found: warn
          retention-days: 7

  azure-package-smoke:
    name: Smoke signed Windows installer
    if: ${{ inputs.provider == 'azure' }}
    needs: build
    uses: ./.github/workflows/package-smoke.yml
    with:
      platform_name: windows-x64
      require_windows_signing: true

  sign-installer:
    name: Sign Windows installer with SignPath test certificate
    if: ${{ inputs.provider == 'signpath' }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: unsigned

      - name: Select unsigned NSIS installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path unsigned -Filter '*-win-x64-setup.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one Windows setup EXE, found $($installers.Count)."
            exit 1
          }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # SignPath's artifact configuration is a raw <pe-file>. upload-artifact@v7's archive:false
      # keeps the GitHub artifact as the EXE instead of wrapping it in the default ZIP container.
      - name: Upload raw installer for SignPath
        id: upload-unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Submit SignPath test signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: open-science
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Verify Authenticode signature was added
        id: signed-installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path '${{ runner.temp }}/signpath-signed' -Filter '*.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one signed EXE, found $($installers.Count)."
            exit 1
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($null -eq $signature.SignerCertificate) {
            Write-Error "SignPath returned an artifact without a signer certificate. Status: $($signature.Status)."
            exit 1
          }

          Write-Host "Initial signature status: $($signature.Status)"
          Write-Host "Initial status message: $($signature.StatusMessage)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          $expectedTestCertificateSubject = "CN=Test certificate for 'Open Science [OSS]'"
          $expectedUntrustedRootMessage = 'A certificate chain processed, but terminated in a root certificate which is not trusted by the trust provider.'
          $isExpectedSelfSignedTestCertificate = (
            $signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer -and
            $signature.SignerCertificate.Subject -eq $expectedTestCertificateSubject
          )
          $isExpectedUntrustedStatus = (
            $signature.Status -eq 'NotTrusted' -or
            ($signature.Status -eq 'UnknownError' -and $signature.StatusMessage -eq $expectedUntrustedRootMessage)
          )

          if ($signature.Status -ne 'Valid' -and -not (
            $isExpectedSelfSignedTestCertificate -and $isExpectedUntrustedStatus
          )) {
            Write-Error "SignPath returned an unacceptable Authenticode signature: $($signature.Status) — $($signature.StatusMessage)"
            exit 1
          }

          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signpath-test-windows-x64
          path: ${{ steps.signed-installer.outputs.path }}
          retention-days: 7
          if-no-files-found: error
