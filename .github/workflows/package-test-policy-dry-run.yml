name: Package test policy dry-run
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated independent package names, or all
        type: string
        default: diagnostics
      source_tests:
        description: Include complete isolated source suites (false exercises merge queue consumers)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  policy:
    name: Package test direction and lossless registration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/npm-ci.mjs
      # Exercise the same selector and registration guard as PR Gate, including real
      # Git history and Vitest configuration, without full tests or publishing.
      - run: >-
          npx vitest run
          scripts/ci/package-test-impact.test.ts
          scripts/ci/check-module-ownership.test.ts
          scripts/ci/module-test-impact.test.ts
          scripts/ci/module-impact-inputs.test.ts
          scripts/ci/pr-gate-workflow.test.ts
          --maxWorkers=2
      - name: Prepare isolated downstream-change fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/package-policy-fixture"
          node --input-type=module <<'JS'
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const fixture = join(process.env.RUNNER_TEMP, 'package-policy-fixture')
          mkdirSync(join(fixture, 'scripts/ci'), { recursive: true })
          for (const file of ['package-test-impact.mjs', 'package-test-boundaries.json'])
            copyFileSync(`scripts/ci/${file}`, join(fixture, 'scripts/ci', file))
          const registry = JSON.parse(readFileSync('scripts/ci/package-test-boundaries.json', 'utf8'))
          for (const { root } of registry.packages) {
            const directory = join(fixture, root)
            const name = root.slice('packages/'.length)
            mkdirSync(join(directory, 'src'), { recursive: true })
            writeFileSync(join(directory, 'package.json'), JSON.stringify({ name: `fixture-${name}`, scripts: { test: 'vitest run' } }))
            writeFileSync(join(directory, 'vitest.config.ts'), `export default ${JSON.stringify({ root: directory, test: { name, include: ['src/**/*.test.ts'] } })}`)
            writeFileSync(join(directory, 'src/contract.test.ts'), '')
          }
          mkdirSync(join(fixture, 'src'), { recursive: true })
          writeFileSync(join(fixture, 'src/host.test.ts'), '')
          JS
          git -C "$fixture" init -q
          git -C "$fixture" -c user.name=CI -c user.email=ci@example.invalid add .
          git -C "$fixture" -c user.name=CI -c user.email=ci@example.invalid commit -qm baseline
          echo "base=$(git -C "$fixture" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo '// downstream change' > "$fixture/src/host.ts"
          git -C "$fixture" add .
          git -C "$fixture" -c user.name=CI -c user.email=ci@example.invalid commit -qm downstream
          echo "head=$(git -C "$fixture" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select through the production action
        uses: ./.github/actions/select-package-tests
        with:
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.head }}
          trusted-base: ${{ steps.fixture.outputs.base }}
          working-directory: ${{ runner.temp }}/package-policy-fixture
      - name: Verify actual Vitest discovery from exported environment
        env:
          VITEST_PORTABLE_CI: '1'
        run: |
          npx vitest list --config "$GITHUB_WORKSPACE/vitest.config.ts" --root "$RUNNER_TEMP/package-policy-fixture" --filesOnly --json > "$RUNNER_TEMP/package-policy-files.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const files = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package-policy-files.json`, 'utf8'))
          assert.deepEqual(files.map(({ file }) => file), [`${process.env.RUNNER_TEMP}/package-policy-fixture/src/host.test.ts`])
          JS
      - name: Retain the complete manual baseline
        uses: ./.github/actions/select-package-tests
        with:
          enabled: 'false'
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.head }}
          trusted-base: ${{ steps.fixture.outputs.base }}
          working-directory: ${{ runner.temp }}/package-policy-fixture
      - name: Verify the baseline includes the upstream package
        env:
          VITEST_PORTABLE_CI: '1'
        run: |
          npx vitest list --config "$GITHUB_WORKSPACE/vitest.config.ts" --root "$RUNNER_TEMP/package-policy-fixture" --filesOnly --json > "$RUNNER_TEMP/package-policy-files.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const files = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package-policy-files.json`, 'utf8'))
          const registry = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package-policy-fixture/scripts/ci/package-test-boundaries.json`, 'utf8'))
          const expected = ['src/host.test.ts', ...registry.packages.map(({ root }) => `${root}/src/contract.test.ts`)]
          assert.deepEqual(files.map(({ file }) => file).sort(), expected.map(file => `${process.env.RUNNER_TEMP}/package-policy-fixture/${file}`).sort())
          JS

  isolation:
    name: Independent installed consumers
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify through the production package entry
        uses: ./.github/actions/verify-packages
        with:
          selection: ${{ inputs.packages }}
          source-tests: ${{ inputs.source_tests }}
