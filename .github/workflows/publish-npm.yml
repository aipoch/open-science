name: Runtime distribution dry-run

# Manual dispatch never writes to npm, releases, or tags.
on:
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        description: Standalone archive (default) or deferred npm package validation.
        options: [archive, npm]
        default: archive
      target:
        type: choice
        description: Start with one native leg; all is required before release.
        options:
          - linux-x64-gnu
          - all
          - linux-arm64-gnu
          - darwin-arm64
          - darwin-x64
          - win32-x64
        default: linux-x64-gnu

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/runtime-packages.yml
    with:
      distribution: ${{ inputs.distribution }}
      target: ${{ inputs.target }}
