name: Runtime distribution dry-run

# Manual dispatch never writes to npm, releases, or tags.
on:
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        description: Standalone archive, Linux CLI deb/rpm, or deferred npm validation.
        options: [archive, npm, linux-packages]
        default: archive
      source_release:
        type: string
        description: Published stable Release to repack for linux-packages only.
        default: v0.37.1
      desktop_run_id:
        type: string
        description: Existing desktop artifact run to verify without rebuilding or repackaging.
        default: ''
      target:
        type: choice
        description: Start with one native leg; all is required before release.
        options:
          - linux-x64-gnu
          - all
          - linux-arm64-gnu
          - darwin-arm64
          - darwin-x64
          - win32-x64
        default: linux-x64-gnu

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.distribution != 'linux-packages'
    uses: ./.github/workflows/runtime-packages.yml
    with:
      distribution: ${{ inputs.distribution }}
      target: ${{ inputs.target }}
      desktop_run_id: ${{ inputs.desktop_run_id }}
      verify_desktop_only: ${{ inputs.desktop_run_id != '' }}

  linux-packages:
    if: inputs.distribution == 'linux-packages'
    uses: ./.github/workflows/linux-cli-packages.yml
    with:
      source_release: ${{ inputs.source_release }}
      target: ${{ inputs.target }}
