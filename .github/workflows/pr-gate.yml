      - name: Setup Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs --prefer-offline --no-audit --fund=false
      - name: Build Electron application
        run: npm run build:e2e
      - name: Test snapshot transport
        run: npx vitest run scripts/ci/e2e-setup-snapshot.test.ts
      - name: Pack E2E setup
        shell: bash
        run: node scripts/ci/e2e-setup-snapshot.mjs pack "$RUNNER_TEMP/e2e-setup"
      - name: Upload E2E setup
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-setup-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-setup/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  macos_e2e:
    name: macOS build and E2E (${{ matrix.group }})
    needs: [preflight, macos_e2e_setup]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'macos_e2e') && ((fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) || needs.macos_e2e_setup.result == 'success') }}
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Explicit manual full plans can omit group selection; run the complete matrix.
        group: ${{ fromJSON(needs.preflight.outputs.plan).macosGroups || fromJSON('["journeys","presentation","regressions","delegation"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.macos_e2e_setup.outputs.node_version || '22' }}
          cache: ${{ (fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) && 'npm' || '' }}
          package-manager-cache: false
      - name: Install short Mac dependencies
        if: ${{ (fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) }}
        run: node scripts/ci/npm-ci.mjs
      - name: Build short Mac application
        id: smoke_build
        if: ${{ (fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) }}
        run: npm run build:e2e
      # Artifact IDs survive failed-job reruns without selecting another producer attempt.
      - name: Download E2E setup
        if: ${{ !(fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.macos_e2e_setup.outputs.artifact_id }}
          path: ${{ runner.temp }}/e2e-setup/
          merge-multiple: true
      - name: Restore E2E setup
        if: ${{ !(fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) }}
        id: setup
        run: node scripts/ci/e2e-setup-snapshot.mjs restore "$RUNNER_TEMP/e2e-setup"
      - name: Test macOS-native behavior
        id: unit_macos_native
        if: ${{ matrix.group == 'journeys' && ((fromJSON(needs.preflight.outputs.plan).macosProfile != 'smoke' && fromJSON(needs.preflight.outputs.plan).mode == 'full') || (contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos') && fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded')) }}
        continue-on-error: true
        run: |
          npx vitest run \
            packages/notebook-network-sandbox/src/filesystem-enforcement.integration.test.ts \
            packages/notebook-network-sandbox/src/network-enforcement.integration.test.ts \
            src/main/delegation/acp-execution.test.ts \
            src/main/delegation/production-framework-runtime.test.ts \
            src/main/second-instance-router.test.ts \
            src/main/windows.test.ts \
            src/main/net/network-info.test.ts \
            src/main/notebook/managed-runtime-guard.test.ts
          npx vitest run src/main/notebook/kernel-executor.test.ts \
            -t 'executes the repl loop through the production network sandbox'
      - name: Test short macOS platform checks
        id: unit_macos_smoke
        if: ${{ matrix.group == 'journeys' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos') }}
        continue-on-error: true
        run: npx vitest run src/main/net/network-info.test.ts src/main/notebook/managed-runtime-guard.test.ts
      # PR/queue business E2E relies on Playwright retries to absorb single-attempt flakes;
      # strict --fail-on-flaky-tests stays in the scheduled Source Regression paths.
      - name: Run short macOS core
        id: e2e_smoke_macos
        if: ${{ matrix.group == 'journeys' && (steps.smoke_build.outcome == 'success' || steps.setup.outcome == 'success') && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos') }}
        continue-on-error: true
        run: >-
          npx playwright test e2e/electron-foundation.spec.ts e2e/settings-persistence.spec.ts e2e/window-presentation.spec.ts
          --grep 'creates a project through the desktop stack and reloads it after relaunch|persists the selected theme after closing settings and relaunching|keeps the E2E window hidden across relaunch'
          --global-timeout=180000
      - name: Run functional journeys
        id: e2e_functional_macos
        if: ${{ matrix.group == 'journeys' && steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_functional_macos') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/functional_macos
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/functional_macos.json
        run: npm run test:e2e:journey -- --global-timeout=600000
      - name: Upload functional failure artifacts
        if: ${{ steps.e2e_functional_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-macos-${{ matrix.group }}-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run workspace journeys
        id: e2e_workspace_macos
        if: ${{ matrix.group == 'journeys' && steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_workspace_macos') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/workspace_macos
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/workspace_macos.json
        run: npm run test:e2e:workspace -- --global-timeout=900000
      - name: Upload workspace failure artifacts
        if: ${{ steps.e2e_workspace_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-macos-${{ matrix.group }}-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Install headless Chromium
        if: ${{ matrix.group == 'presentation' }}
        run: npx playwright install chromium --only-shell
      - name: Run supplemental regressions
        id: e2e_regressions_macos
        if: ${{ matrix.group == 'regressions' && steps.setup.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: regressions
          include-capacity: 'false'
      - name: Run supplemental delegation
        id: e2e_delegation_macos
        if: ${{ matrix.group == 'delegation' && steps.setup.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: delegation
      - name: Run renderer layout pilot
        id: renderer_layout
        if: ${{ matrix.group == 'presentation' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_visual_macos') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/renderer-layout
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/renderer-layout.json
        run: npm run test:e2e:browser -- --global-timeout=300000
      - name: Run accessibility checks
        id: e2e_accessibility_macos
        if: ${{ matrix.group == 'presentation' && steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_accessibility_macos') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/accessibility-macos
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/accessibility-macos.json
        run: npm run test:e2e:accessibility:signal
      - name: Upload accessibility diagnostics
        if: ${{ steps.e2e_accessibility_macos.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-macos-${{ matrix.group }}-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run visual regression
        id: e2e_visual_macos
        if: ${{ matrix.group == 'presentation' && steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_visual_macos') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/visual_macos
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/visual_macos.json
        run: npm run test:e2e:visual -- --global-timeout=300000
      - name: Upload visual failure artifacts
        if: ${{ steps.e2e_visual_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-macos-${{ matrix.group }}-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Upload E2E timing and blob reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-reports-macos-${{ matrix.group }}
          overwrite: true
          path: |
            blob-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected macOS checks
        if: ${{ always() }}
        shell: bash
        env:
          RENDERER_LAYOUT_OUTCOME: ${{ steps.renderer_layout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          E2E_ACCESSIBILITY_OUTCOME: ${{ steps.e2e_accessibility_macos.outcome }}
          E2E_FUNCTIONAL_OUTCOME: ${{ steps.e2e_functional_macos.outcome }}
          E2E_VISUAL_OUTCOME: ${{ steps.e2e_visual_macos.outcome }}
          E2E_WORKSPACE_OUTCOME: ${{ steps.e2e_workspace_macos.outcome }}
          E2E_REGRESSIONS_OUTCOME: ${{ steps.e2e_regressions_macos.outcome }}
          E2E_DELEGATION_OUTCOME: ${{ steps.e2e_delegation_macos.outcome }}
          E2E_GROUP: ${{ matrix.group }}
          UNIT_MACOS_SMOKE_OUTCOME: ${{ steps.unit_macos_smoke.outcome }}
          E2E_SMOKE_SELECTED: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos') }}
          E2E_SMOKE_OUTCOME: ${{ steps.e2e_smoke_macos.outcome }}
          UNIT_MACOS_NATIVE_OUTCOME: ${{ steps.unit_macos_native.outcome }}
          MACOS_PROFILE: ${{ fromJSON(needs.preflight.outputs.plan).macosProfile }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check renderer_layout "$RENDERER_LAYOUT_OUTCOME"
          check setup "$SETUP_OUTCOME"
          check e2e_functional_macos "$E2E_FUNCTIONAL_OUTCOME"
          check e2e_workspace_macos "$E2E_WORKSPACE_OUTCOME"
          check e2e_accessibility_macos "$E2E_ACCESSIBILITY_OUTCOME"
          check e2e_visual_macos "$E2E_VISUAL_OUTCOME"
          check unit_macos_native "$UNIT_MACOS_NATIVE_OUTCOME"
          check unit_macos_smoke "$UNIT_MACOS_SMOKE_OUTCOME"
          check e2e_smoke_macos "$E2E_SMOKE_OUTCOME"
          if [[ "${E2E_GROUP:-}" == "journeys" && "${E2E_SMOKE_SELECTED:-}" == "true" && ( "${E2E_SMOKE_OUTCOME:-}" != "success" || "${UNIT_MACOS_SMOKE_OUTCOME:-}" != "success" ) ]]; then failed=1; fi
          if [[ "${E2E_GROUP:-}" == "journeys" && "${E2E_SMOKE_SELECTED:-}" == "true" && "${MACOS_PROFILE:-}" == "expanded" && "${UNIT_MACOS_NATIVE_OUTCOME:-}" != "success" ]]; then failed=1; fi
          # These groups are selected whenever this bundle runs; skipped is not success.
          if [[ "${E2E_GROUP:-}" == "regressions" && "${E2E_REGRESSIONS_OUTCOME:-}" != "success" ]]; then failed=1; fi
          if [[ "${E2E_GROUP:-}" == "delegation" && "${E2E_DELEGATION_OUTCOME:-}" != "success" ]]; then failed=1; fi
          exit "$failed"

  windows_arm64_host:
    name: Windows arm64 sandbox host artifact
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'windows_core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust Windows arm64 target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked
      - name: Build Windows arm64 sandbox host
        run: >-
          cargo xwin build --locked --release
          --target aarch64-pc-windows-msvc
          --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml
      - name: Upload rebuilt Windows arm64 sandbox host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-sandbox-host-arm64
          path: packages/notebook-network-sandbox/vendor/windows-src/target/aarch64-pc-windows-msvc/release/notebook-appcontainer-host.exe
          retention-days: 5
          if-no-files-found: error

  windows_e2e:
    name: Windows E2E (shard ${{ matrix.shard }}/3)
    needs: [preflight, windows_e2e_setup]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'windows_e2e') && needs.windows_e2e_setup.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.windows_e2e_setup.outputs.node_version }}
          package-manager-cache: false
      - name: Download E2E setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.windows_e2e_setup.outputs.artifact_id }}
          path: ${{ runner.temp }}/e2e-setup/
          merge-multiple: true
      - name: Restore E2E setup
        id: setup
        shell: bash
        run: node scripts/ci/e2e-setup-snapshot.mjs restore "$RUNNER_TEMP/e2e-setup"
      - name: Install headless Chromium
        run: npx playwright install chromium --only-shell
      # PR/queue business E2E relies on Playwright retries to absorb single-attempt flakes;
      # strict --fail-on-flaky-tests stays in the scheduled Source Regression paths.
      - name: Run renderer layout pilot
        id: renderer_layout
        if: ${{ steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_browser_windows') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/renderer-layout-windows
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/renderer-layout-windows.json
        # NetLog traced blank fixtures to Windows WSAENOBUFS after hundreds of asset reloads.
        # Keep each browser process serialized and cap its loopback socket churn with runner shards.
        shell: node scripts/ci/run-windows-browser-diagnostics.mjs {0}
        run: npm run test:e2e:browser -- --workers=1 --global-timeout=420000 --shard=${{ matrix.shard }}/3
      - name: Run functional journeys
        id: e2e_functional_windows
        if: ${{ steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_functional_windows') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/functional_windows
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/functional_windows.json
        # Isolate Electron desktops: parallelize across runners, never within one runner.
        run: npm run test:e2e:journey -- --workers=1 --fully-parallel --shard=${{ matrix.shard }}/3 --global-timeout=600000
      - name: Upload functional failure artifacts
        if: ${{ steps.e2e_functional_windows.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-windows-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run workspace journeys
        id: e2e_workspace_windows
        if: ${{ steps.setup.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_workspace_windows') }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/workspace_windows
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/workspace_windows.json
        run: npm run test:e2e:workspace -- --workers=1 --fully-parallel --shard=${{ matrix.shard }}/3 --global-timeout=900000
      - name: Upload workspace failure artifacts
        if: ${{ steps.e2e_workspace_windows.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-windows-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Upload E2E timing and blob reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-reports-windows-${{ matrix.shard }}
          overwrite: true
          path: |
            blob-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected Windows E2E checks
        if: ${{ always() }}
        shell: bash
        env:
          E2E_BROWSER_SELECTED: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_browser_windows') }}
          RENDERER_LAYOUT_OUTCOME: ${{ steps.renderer_layout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          E2E_FUNCTIONAL_OUTCOME: ${{ steps.e2e_functional_windows.outcome }}
          E2E_WORKSPACE_OUTCOME: ${{ steps.e2e_workspace_windows.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          # The browser suite is selected per plan; when selected, skipped is not success.
          if [[ "${E2E_BROWSER_SELECTED:-}" == "true" && "$RENDERER_LAYOUT_OUTCOME" != "success" ]]; then
            echo "Required Windows browser suite ended with ${RENDERER_LAYOUT_OUTCOME:-no outcome}" >&2
            failed=1
          fi
          check renderer_layout "$RENDERER_LAYOUT_OUTCOME"
          check setup "$SETUP_OUTCOME"
          check e2e_functional_windows "$E2E_FUNCTIONAL_OUTCOME"
          check e2e_workspace_windows "$E2E_WORKSPACE_OUTCOME"
          exit "$failed"

  e2e_reports:
    name: E2E timing and merged report
    needs: [macos_e2e, windows_e2e]
    if: ${{ !cancelled() && (needs.macos_e2e.result != 'skipped' || needs.windows_e2e.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install report tools
        run: npm ci --ignore-scripts --no-audit --fund=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: e2e-reports-*
          path: test-results/downloaded-e2e
      - name: Summarize timing and merge reports
        run: node scripts/ci/merge-e2e-reports.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: e2e-combined-report
          overwrite: true
          path: |
            playwright-report/
            test-results/e2e-timing.md
          retention-days: 5

  gate:
    name: PR Gate
    if: ${{ always() }}
    needs:
      - preflight
      - policy
      - static
      - unit
      - linux_runtime
      - windows_core
      - macos_e2e
      - windows_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted gate evaluator
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          # Pull requests keep the base evaluator so a PR cannot rewrite its own gate.
          # Merge groups use the preflight merge base with the target branch (same trusted base as the classifier).
          # Manual dry-runs evaluate HEAD so a newly introduced lane can be dogfooded.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha || needs.preflight.outputs.base }}
      - name: Setup Node
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Evaluate deterministic gate from trusted base
        shell: bash
        # Keep process environment bounded. Embedding the complete needs payload in job env includes
        # the preflight plan and exceeds Linux ARG_MAX on large diffs before checkout can start.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_GATE_PLATFORM_POLICY: risk-v1
          PR_GATE_EXECUTION_MODE: bundles
          PR_GATE_PLAN: ${{ needs.preflight.outputs.plan }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PR_GATE_NEEDS: '{"preflight":{"result":"${{ needs.preflight.result }}"},"policy":{"result":"${{ needs.policy.result }}"},"static":{"result":"${{ needs.static.result }}"},"unit":{"result":"${{ needs.unit.result }}"},"linux_runtime":{"result":"${{ needs.linux_runtime.result }}"},"windows_core":{"result":"${{ needs.windows_core.result }}"},"macos_e2e":{"result":"${{ needs.macos_e2e.result }}"},"windows_e2e":{"result":"${{ needs.windows_e2e.result }}"}}'
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "Preflight did not succeed" >&2
            exit 1
          fi
          if [[ -f scripts/ci/evaluate-pr-gate.mjs ]]; then
            node scripts/ci/evaluate-pr-gate.mjs
            exit 0
          fi

          # Bootstrap-only strict evaluator. Future runs use the evaluator checked out from base.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const plan = JSON.parse(process.env.PR_GATE_PLAN)
          const needs = JSON.parse(process.env.PR_GATE_NEEDS)
          const conclusions = Object.fromEntries(
            Object.entries(needs).map(([bundle, value]) => [bundle, value?.result ?? 'missing'])
          )
          const failures = []
          if (plan.schemaVersion !== 1) failures.push('unsupported plan schema')
          // Bootstrap plans carry no platform policy; that requires the trusted evaluator.
          if ('macosProfile' in plan) failures.push('platform policy requires the trusted evaluator')
          if (conclusions.preflight !== 'success') failures.push('preflight did not succeed')
          if (!Array.isArray(plan.bundles)) failures.push('execution bundle plan is missing')
          const selected = new Set(Array.isArray(plan.bundles) ? plan.bundles : [])
          for (const bundle of selected) {
            if (conclusions[bundle] !== 'success') {
              failures.push(bundle + ' ended with ' + (conclusions[bundle] ?? 'missing'))
            }
          }
          for (const [bundle, conclusion] of Object.entries(conclusions)) {
            if (
              bundle !== 'preflight' &&
              !selected.has(bundle) &&
              conclusion !== 'success' &&
              conclusion !== 'skipped'
            ) {
              failures.push(bundle + ' unexpectedly ended with ' + conclusion)
            }
          }
          const summary =
            '## PR Gate\n\nResult: **' +
            (failures.length === 0 ? 'pass' : 'fail') +
            '**\n\n- Selected lanes: ' +
            plan.lanes.join(', ') +
            '\n- Execution bundles: ' +
            [...selected].join(', ') +
            '\n\n### Failures\n\n' +
            (failures.length === 0 ? '- None' : failures.map((failure) => '- ' + failure).join('\n')) +
            '\n'
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          } else {
            process.stdout.write(summary)
          }
          if (failures.length > 0) process.exit(1)
          NODE
