name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Focused no-side-effect validation plan
        required: false
        default: classified
        type: choice
        options:
          - classified
          - unit-coverage
          - i18n
          - windows-e2e

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base: ${{ steps.revisions.outputs.base }}
      head: ${{ steps.revisions.outputs.head }}
      lanes: ${{ steps.classify.outputs.lanes }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Resolve changed revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_BASE_SHA"
            head_sha="$PULL_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_BASE_SHA"
            head_sha="$MERGE_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
            head_sha="$(git rev-parse HEAD)"
          else
            base_sha="$(git rev-parse HEAD)"
            head_sha="$base_sha"
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Preflight revisions must be full Git commit SHAs" >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted classifier
        id: trusted_classifier
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/pr-gate-trusted-classifier"
          mkdir -p "$trusted_dir"
          echo "dir=$trusted_dir" >> "$GITHUB_OUTPUT"

          required=(
            scripts/ci/module-impact-authority.mjs
            scripts/ci/module-impact-shadow.mjs
            scripts/ci/module-test-impact.mjs
            scripts/ci/module-impact.json
            scripts/ci/validate-module-impact.mjs
            scripts/ci/classify-pr-changes.mjs
            scripts/ci/change-impact.json
          )
          for file in "${required[@]}"; do
            if ! git cat-file -e "${BASE_SHA}:${file}" 2>/dev/null; then
              echo "source=bootstrap" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for file in "${required[@]}"; do
            git show "${BASE_SHA}:${file}" > "$trusted_dir/${file##*/}"
          done
          echo "source=base" >> "$GITHUB_OUTPUT"

      - name: Classify change impact
        id: classify
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          DRY_RUN_MODE: ${{ inputs.dry_run || 'classified' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          TRUSTED_CLASSIFIER_DIR: ${{ steps.trusted_classifier.outputs.dir }}
          TRUSTED_CLASSIFIER_SOURCE: ${{ steps.trusted_classifier.outputs.source }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "unit-coverage" ]]; then
            plan='{"schemaVersion":1,"mode":"full","roots":["manual:unit-coverage"],"lanes":["policy","unit_macos"],"bundles":["policy","unit"],"reasonChains":["workflow_dispatch unit-coverage -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","unit_macos"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '## PR Gate preflight' \
              '' \
              '- Mode: **full (focused dry-run)**' \
              '- Selected lanes: policy, unit_macos' \
              '- Execution bundles: policy, unit' \
              '' \
              '### Reason chains' \
              '' \
              '- `workflow_dispatch unit-coverage -> focused dry-run`' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "i18n" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:i18n"],"lanes":["policy","i18n"],"bundles":["policy","static"],"reasonChains":["workflow_dispatch i18n -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","i18n"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '## PR Gate preflight' \
              '' \
              '- Mode: **selective (focused dry-run)**' \
              '- Selected lanes: policy, i18n' \
              '- Execution bundles: policy, static' \
              '' \
              '### Reason chains' \
              '' \
              '- `workflow_dispatch i18n -> focused dry-run`' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "windows-e2e" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:windows-e2e"],"lanes":["policy","e2e_functional_windows","e2e_workspace_windows"],"bundles":["policy","windows_e2e"],"reasonChains":["workflow_dispatch windows-e2e -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","e2e_functional_windows","e2e_workspace_windows"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## PR Gate preflight' '' '- Focused dry-run: Windows E2E shards' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$TRUSTED_CLASSIFIER_SOURCE" == "base" ]]; then
            node "$TRUSTED_CLASSIFIER_DIR/module-impact-authority.mjs" --base "$BASE_SHA" --head "$HEAD_SHA"
            exit 0
          fi

          # The introducing PR has no trusted classifier in its base. Bootstrap with a strict full
          # plan so the stable gate still fails closed until the trusted implementation is available.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const lanes = [
            'policy',
            'docs',
            'format',
            'lint',
            'typecheck_node',
            'typecheck_web',
            'interface_contracts',
            'cli_sdk',
            'i18n',
            'unit_macos',
            'linux_runtime',
            'windows_runtime',
            'windows_path',
            'build',
            'e2e_functional_macos',
            'e2e_functional_windows',
            'e2e_workspace_macos',
            'e2e_workspace_windows',
            'e2e_accessibility_macos',
            'e2e_visual_macos'
          ]
          const bundles = [
            'policy',
            'static',
            'unit',
            'linux_runtime',
            'windows_core',
            'macos_e2e',
            'windows_e2e'
          ]
          const plan = {
            schemaVersion: 1,
            mode: 'full',
            roots: ['bootstrap'],
            lanes,
            bundles,
            reasonChains: ['trusted base classifier unavailable -> bootstrap -> full']
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            'plan=' + JSON.stringify(plan) + '\nlanes=' + JSON.stringify(lanes) + '\n'
          )
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## PR Gate preflight\n\n- Mode: **full**\n- Roots: bootstrap\n- Selected lanes: ' +
                lanes.join(', ') +
                '\n- Execution bundles: ' +
                bundles.join(', ') +
                '\n\n### Reason chains\n\n- `trusted base classifier unavailable -> bootstrap -> full`\n'
            )
          }
          NODE

  policy:
    name: PR policy
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'policy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ needs.preflight.outputs.base }}
          fail-on-severity: high
          fail-on-scopes: runtime, development
          head-ref: ${{ needs.preflight.outputs.head }}
          license-check: false
          show-openssf-scorecard: false
      - name: Validate pull request policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          POLICY_SCOPE: commits
        run: node scripts/ci/check-pr-policy.mjs

  static:
    name: Static checks
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'static') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Check Markdown formatting
        id: docs
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'docs') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind markdown
      - name: Check formatting
        id: format
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'format') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind non-markdown
      - name: Lint
        id: lint
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'lint') }}
        continue-on-error: true
        run: npm run lint -- --concurrency auto
      - name: Typecheck node and web
        id: typechecks
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_node') || contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_web') }}
        continue-on-error: true
        shell: bash
        env:
          RUN_TYPECHECK_NODE: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_node') }}
          RUN_TYPECHECK_WEB: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_web') }}
        run: |
          set -uo pipefail
          failed=0
          node_outcome=skipped
          web_outcome=skipped
          node_log="$RUNNER_TEMP/typecheck-node.log"
          web_log="$RUNNER_TEMP/typecheck-web.log"

          if [[ "$RUN_TYPECHECK_NODE" == "true" ]]; then
            npm run typecheck:node >"$node_log" 2>&1 &
            node_pid=$!
          fi
          if [[ "$RUN_TYPECHECK_WEB" == "true" ]]; then
            npm run typecheck:web >"$web_log" 2>&1 &
            web_pid=$!
          fi

          if [[ "$RUN_TYPECHECK_NODE" == "true" ]]; then
            if wait "$node_pid"; then node_outcome=success; else node_outcome=failure; failed=1; fi
            echo "::group::Typecheck node"
            cat "$node_log"
            echo "::endgroup::"
          fi
          if [[ "$RUN_TYPECHECK_WEB" == "true" ]]; then
            if wait "$web_pid"; then web_outcome=success; else web_outcome=failure; failed=1; fi
            echo "::group::Typecheck web"
            cat "$web_log"
            echo "::endgroup::"
          fi

          echo "node=$node_outcome" >> "$GITHUB_OUTPUT"
          echo "web=$web_outcome" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Check interface contract baseline (shadow)
        id: interface_contracts
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'interface_contracts') }}
        continue-on-error: true
        env:
          RUN_DEDICATED_TESTS: ${{ fromJSON(needs.preflight.outputs.plan).mode != 'full' || !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: |
          npm run check:web-api-map
          # Full portable shards already execute these tests. Keep the map check in this lane.
          if [[ "$RUN_DEDICATED_TESTS" == "true" ]]; then
            npx vitest run \
              src/preload/index.test.ts \
              src/preload/electron-renderer-contract-adapter.test.ts \
              src/shared/renderer-contract.test.ts \
              src/shared/renderer-contract-catalog.test.ts \
              src/shared/renderer-surface-inventory.test.ts \
              src/shared/renderer-surface-matrix.test.ts \
              src/shared/web-rpc-contract.test.ts
          fi
      - name: Test CLI and SDK
        id: cli_sdk
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'cli_sdk') }}
        continue-on-error: true
        env:
          RUN_DEDICATED_TESTS: ${{ fromJSON(needs.preflight.outputs.plan).mode != 'full' || !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: |
          if [[ "$RUN_DEDICATED_TESTS" == "true" ]]; then
            npx vitest run cli packages/open-science
          fi
          npm run check:cli-package
      - name: Check i18n catalog
        id: i18n
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'i18n') }}
        continue-on-error: true
        run: npx vitest run src/renderer/src/i18n/resources.test.ts
      - name: Enforce selected static checks
        if: ${{ always() }}
        shell: bash
        env:
          CLI_SDK_OUTCOME: ${{ steps.cli_sdk.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          I18N_OUTCOME: ${{ steps.i18n.outcome }}
          INTERFACE_CONTRACTS_OUTCOME: ${{ steps.interface_contracts.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_NODE_OUTCOME: ${{ steps.typechecks.outputs.node }}
          TYPECHECKS_OUTCOME: ${{ steps.typechecks.outcome }}
          TYPECHECK_WEB_OUTCOME: ${{ steps.typechecks.outputs.web }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check docs "$DOCS_OUTCOME"
          check format "$FORMAT_OUTCOME"
          check lint "$LINT_OUTCOME"
          check typecheck_node "$TYPECHECK_NODE_OUTCOME"
          check typecheck_web "$TYPECHECK_WEB_OUTCOME"
          check typechecks "$TYPECHECKS_OUTCOME"
          check interface_contracts "$INTERFACE_CONTRACTS_OUTCOME"
          check cli_sdk "$CLI_SDK_OUTCOME"
          check i18n "$I18N_OUTCOME"
          exit "$failed"

  unit_shard:
    name: Full portable tests (Ubuntu, shard ${{ matrix.shard }}/3)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') && (fromJSON(needs.preflight.outputs.plan).mode == 'full' || !contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos')) }}
    runs-on: ubuntu-latest
    env:
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
      VITEST_PORTABLE_CI: '1'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test complete suite shard
        id: unit_macos_shard
        continue-on-error: true
        # The static lane owns the i18n catalog guard. Real Linux and macOS sandbox behavior runs
        # in platform jobs with the required native dependencies, so do not duplicate those files.
        run: >-
          npx vitest run
          --coverage
          --coverage.reporter=text-summary
          --testTimeout=30000
          --shard=${{ matrix.shard }}/3
          --reporter=blob
          --outputFile=vitest-reports/blob-${{ matrix.shard }}.json
      - name: Upload full-suite blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-portable-blob-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 1
          if-no-files-found: error
      - name: Enforce full-suite shard
        if: ${{ always() }}
        shell: bash
        env:
          UNIT_MACOS_SHARD_OUTCOME: ${{ steps.unit_macos_shard.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$UNIT_MACOS_SHARD_OUTCOME" != "success" ]]; then
            echo "unit_macos_shard ended with $UNIT_MACOS_SHARD_OUTCOME" >&2
            failed=1
          fi
          exit "$failed"

  unit:
    name: Module tests and coverage
    needs: [preflight, unit_shard]
    if: ${{ always() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
    # Full plans merge Ubuntu shard reports on Ubuntu. Selective plans still execute affected
    # Modules on real macOS so native platform behavior remains covered for focused changes.
    runs-on: ${{ needs.unit_shard.result != 'skipped' && 'ubuntu-latest' || 'macos-14' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: ${{ needs.unit_shard.result == 'skipped' }}
        run: node scripts/ci/npm-ci.mjs
      - name: Install report merge dependencies
        if: ${{ needs.unit_shard.result != 'skipped' }}
        run: node scripts/ci/npm-ci.mjs --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Test affected Modules
        id: unit_macos_related
        if: ${{ fromJSON(needs.preflight.outputs.plan).mode == 'selective' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        # The module graph selects owner, contract, and consumer tests. Coverage remains scoped to
        # changed sources without handing test discovery back to Vitest's static --changed graph.
        run: npm run test:affected -- --base "$BASE_SHA" --head "$HEAD_SHA" --coverage-changed "$BASE_SHA"
      - name: Download full-suite blob reports
        if: ${{ needs.unit_shard.result != 'skipped' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unit-portable-blob-*
          path: vitest-reports
          merge-multiple: true
      - name: Merge full-suite reports and coverage
        id: unit_macos_full
        # The shard job covers both full plans and trusted pre-migration selective plans that select
        # the unit bundle without unit_macos. Merge once so thresholds see the complete suite.
        if: ${{ needs.unit_shard.result != 'skipped' }}
        continue-on-error: true
        # Blob reports retain their source test paths. The merge reconstructs coverage without
        # discovering or executing tests again, so coverage thresholds remain authoritative.
        run: npx vitest run --merge-reports=vitest-reports --coverage --passWithNoTests
      - name: Upload Module coverage report
        if: ${{ always() && (steps.unit_macos_related.outcome != 'skipped' || steps.unit_macos_full.outcome != 'skipped') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected unit checks
        if: ${{ always() }}
        shell: bash
        env:
          UNIT_MACOS_FULL_OUTCOME: ${{ steps.unit_macos_full.outcome }}
          UNIT_MACOS_RELATED_OUTCOME: ${{ steps.unit_macos_related.outcome }}
          UNIT_MACOS_SHARDS_RESULT: ${{ needs.unit_shard.result }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check unit_macos_related "$UNIT_MACOS_RELATED_OUTCOME"
          check unit_macos_full "$UNIT_MACOS_FULL_OUTCOME"
          check unit_macos_shards "$UNIT_MACOS_SHARDS_RESULT"
          if [[ "$UNIT_MACOS_RELATED_OUTCOME" == "skipped" && "$UNIT_MACOS_FULL_OUTCOME" == "skipped" ]]; then
            echo "Selected unit bundle did not execute a Module-test path" >&2
            failed=1
          fi
          exit "$failed"

  linux_runtime:
    name: Linux Notebook isolation
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'linux_runtime') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Install Linux sandbox dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap

          apparmor_userns_restriction="$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          )"
          if [[ "$apparmor_userns_restriction" == "1" ]]; then
            profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -r "$profile_source"
            sudo install -m 0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

          bwrap --unshare-all --ro-bind / / -- /bin/true
      - name: Test real Linux filesystem and network isolation
        run: >-
          npx vitest run --project process
          packages/notebook-network-sandbox/src/filesystem-enforcement.integration.test.ts
          packages/notebook-network-sandbox/src/network-enforcement.integration.test.ts

  # The trusted base classifier for the introducing PR still selects this legacy bundle.
  # It performs no tests and can be deleted after this workflow lands on main.
  coverage_macos:
    name: Legacy coverage plan compatibility
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'coverage_macos') }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout coverage-only legacy plan
        if: ${{ !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node for coverage-only legacy plan
        if: ${{ !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for coverage-only legacy plan
        if: ${{ !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: node scripts/ci/npm-ci.mjs
      - name: Test coverage-only legacy plan
        if: ${{ !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: npm run test:coverage
      - name: Upload legacy coverage report
        if: ${{ always() && !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5
          if-no-files-found: warn
      - name: Confirm coverage consolidated into Module tests
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: echo "Coverage thresholds are enforced by the macOS Module-test job."

  windows_core:
    name: Windows core
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'windows_core') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test Windows sandbox native source
        id: windows_sandbox_source
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        continue-on-error: true
        run: cargo test --locked --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml
      - name: Build Windows sandbox native host
        id: windows_sandbox_build
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        continue-on-error: true
        run: node packages/notebook-network-sandbox/vendor/windows/build.mjs x64
      - name: Upload rebuilt Windows sandbox native host
        if: ${{ steps.windows_sandbox_build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-sandbox-host-x64
          path: packages/notebook-network-sandbox/vendor/windows/x64/notebook-appcontainer-host.exe
          retention-days: 5
          if-no-files-found: error
      - name: Test Windows-specific behavior
        id: windows_runtime
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/windows.test.ts
          src/main/windows-icon-assets.test.ts
          src/main/windows-powershell.test.ts
          src/main/file-save.test.ts
          src/main/specialist/repository.test.ts
          src/main/notebook/micromamba-cache-powershell.test.ts
          src/main/notebook/micromamba-cache-acl.integration.test.ts
      - name: Test Windows notebook shell behavior
        id: windows_shell
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        continue-on-error: true
        run: npx vitest run src/main/notebook/windows-shell.integration.test.ts
      - name: Test Windows notebook shell service timeout
        id: windows_service_timeout
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/notebook/runtime-service.test.ts
          --testNamePattern
          "kills a command that outlasts the timeout and returns a non-normal result"
      - name: Test Windows AppContainer ownership and removal lifecycle
        id: windows_sandbox
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && steps.windows_sandbox_source.outcome == 'success' && steps.windows_sandbox_build.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: >-
          packages/notebook-network-sandbox/vendor/windows-src/ci/smoke.ps1
          -Exe packages/notebook-network-sandbox/vendor/windows/x64/notebook-appcontainer-host.exe
      - name: Test Windows path portability
        id: windows_path
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_path') }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/acp/workspace-path.test.ts
          src/main/file-save.test.ts
          src/main/notebook/run-document-data-paths.test.ts
          src/main/notebook/runtime-paths.test.ts
          src/main/session-persistence/conversation-export.test.ts
          src/main/session-persistence/data-path-roundtrip.test.ts
          src/main/settings/notebook-runtime-settings.test.ts
          src/main/settings/preferences.test.ts
          src/main/settings/shell-path.test.ts
          src/main/specialist/repository.test.ts
          src/main/storage/data-path.test.ts
          src/main/storage/normalize-legacy-paths.test.ts
          src/main/storage/path-presence.test.ts
          --maxWorkers=1
          --testTimeout=30000
          --hookTimeout=30000
      - name: Enforce selected Windows core checks
        if: ${{ always() }}
        shell: bash
        env:
          WINDOWS_PATH_OUTCOME: ${{ steps.windows_path.outcome }}
          WINDOWS_RUNTIME_OUTCOME: ${{ steps.windows_runtime.outcome }}
          WINDOWS_SANDBOX_BUILD_OUTCOME: ${{ steps.windows_sandbox_build.outcome }}
          WINDOWS_SANDBOX_OUTCOME: ${{ steps.windows_sandbox.outcome }}
          WINDOWS_SANDBOX_SOURCE_OUTCOME: ${{ steps.windows_sandbox_source.outcome }}
          WINDOWS_SERVICE_TIMEOUT_OUTCOME: ${{ steps.windows_service_timeout.outcome }}
          WINDOWS_SHELL_OUTCOME: ${{ steps.windows_shell.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check windows_runtime "$WINDOWS_RUNTIME_OUTCOME"
          check windows_sandbox_source "$WINDOWS_SANDBOX_SOURCE_OUTCOME"
          check windows_sandbox_build "$WINDOWS_SANDBOX_BUILD_OUTCOME"
          check windows_sandbox "$WINDOWS_SANDBOX_OUTCOME"
          check windows_shell "$WINDOWS_SHELL_OUTCOME"
          check windows_service_timeout "$WINDOWS_SERVICE_TIMEOUT_OUTCOME"
          check windows_path "$WINDOWS_PATH_OUTCOME"
          exit "$failed"

  macos_e2e:
    name: macOS build and E2E
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'macos_e2e') }}
    runs-on: macos-14
    # Builds and all four E2E groups share this runner; allow the final visual group to finish.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test macOS-native behavior
        id: unit_macos_native
        if: ${{ fromJSON(needs.preflight.outputs.plan).mode == 'full' }}
        continue-on-error: true
        run: |
          npx vitest run \
            packages/notebook-network-sandbox/src/filesystem-enforcement.integration.test.ts \
            packages/notebook-network-sandbox/src/network-enforcement.integration.test.ts \
            src/main/net/network-info.test.ts \
            src/main/notebook/managed-runtime-guard.test.ts
          npx vitest run src/main/notebook/kernel-executor.test.ts \
            -t 'executes the repl loop through the production network sandbox'
      - name: Build Electron application
        id: build_electron
        continue-on-error: true
        run: npm run build:e2e
      - name: Build web application
        id: build_web
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'build') }}
        continue-on-error: true
        run: npm run build:web
      - name: Run functional journeys
        id: e2e_functional_macos
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_functional_macos') }}
        continue-on-error: true
        run: npm run test:e2e:journey -- --fail-on-flaky-tests
      - name: Upload functional failure artifacts
        if: ${{ steps.e2e_functional_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run workspace journeys
        id: e2e_workspace_macos
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_workspace_macos') }}
        continue-on-error: true
        run: npm run test:e2e:workspace -- --fail-on-flaky-tests
      - name: Upload workspace failure artifacts
        if: ${{ steps.e2e_workspace_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run accessibility checks
        id: e2e_accessibility_macos
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_accessibility_macos') }}
        continue-on-error: true
        run: npm run test:e2e:accessibility:signal
      - name: Upload accessibility diagnostics
        if: ${{ steps.e2e_accessibility_macos.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-macos-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run visual regression
        id: e2e_visual_macos
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_visual_macos') }}
        continue-on-error: true
        run: npm run test:e2e:visual -- --fail-on-flaky-tests
      - name: Upload visual failure artifacts
        if: ${{ steps.e2e_visual_macos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected macOS checks
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_ELECTRON_OUTCOME: ${{ steps.build_electron.outcome }}
          BUILD_WEB_OUTCOME: ${{ steps.build_web.outcome }}
          E2E_ACCESSIBILITY_OUTCOME: ${{ steps.e2e_accessibility_macos.outcome }}
          E2E_FUNCTIONAL_OUTCOME: ${{ steps.e2e_functional_macos.outcome }}
          E2E_VISUAL_OUTCOME: ${{ steps.e2e_visual_macos.outcome }}
          E2E_WORKSPACE_OUTCOME: ${{ steps.e2e_workspace_macos.outcome }}
          UNIT_MACOS_NATIVE_OUTCOME: ${{ steps.unit_macos_native.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check build_electron "$BUILD_ELECTRON_OUTCOME"
          check build_web "$BUILD_WEB_OUTCOME"
          check e2e_functional_macos "$E2E_FUNCTIONAL_OUTCOME"
          check e2e_workspace_macos "$E2E_WORKSPACE_OUTCOME"
          check e2e_accessibility_macos "$E2E_ACCESSIBILITY_OUTCOME"
          check e2e_visual_macos "$E2E_VISUAL_OUTCOME"
          check unit_macos_native "$UNIT_MACOS_NATIVE_OUTCOME"
          exit "$failed"

  windows_e2e:
    name: Windows E2E (shard ${{ matrix.shard }}/2)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'windows_e2e') }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs --prefer-offline --no-audit --fund=false
      - name: Build Electron application
        id: build_electron
        continue-on-error: true
        run: npm run build:e2e
      - name: Run functional journeys
        id: e2e_functional_windows
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_functional_windows') }}
        continue-on-error: true
        # Split individual tests across runners while keeping each runner's two-worker cap.
        run: npm run test:e2e:journey -- --workers=2 --fully-parallel --shard=${{ matrix.shard }}/2 --fail-on-flaky-tests
      - name: Upload functional failure artifacts
        if: ${{ steps.e2e_functional_windows.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-windows-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Run workspace journeys
        id: e2e_workspace_windows
        if: ${{ steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_workspace_windows') }}
        continue-on-error: true
        run: npm run test:e2e:workspace -- --workers=2 --fully-parallel --shard=${{ matrix.shard }}/2 --fail-on-flaky-tests
      - name: Upload workspace failure artifacts
        if: ${{ steps.e2e_workspace_windows.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-windows-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      # The trusted pre-migration classifier can still select this lane while this workflow lands.
      # The new manifest never emits it, so ordinary PRs do not pay this Windows accessibility cost.
      - name: Run legacy Windows accessibility compatibility
        id: e2e_accessibility_windows
        if: ${{ matrix.shard == 1 && steps.build_electron.outcome == 'success' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_accessibility_windows') }}
        continue-on-error: true
        run: npm run test:e2e:accessibility -- --fail-on-flaky-tests
      - name: Upload legacy accessibility failure artifacts
        if: ${{ steps.e2e_accessibility_windows.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-e2e-windows-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected Windows E2E checks
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_ELECTRON_OUTCOME: ${{ steps.build_electron.outcome }}
          E2E_ACCESSIBILITY_OUTCOME: ${{ steps.e2e_accessibility_windows.outcome }}
          E2E_FUNCTIONAL_OUTCOME: ${{ steps.e2e_functional_windows.outcome }}
          E2E_WORKSPACE_OUTCOME: ${{ steps.e2e_workspace_windows.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check build_electron "$BUILD_ELECTRON_OUTCOME"
          check e2e_functional_windows "$E2E_FUNCTIONAL_OUTCOME"
          check e2e_workspace_windows "$E2E_WORKSPACE_OUTCOME"
          check e2e_accessibility_windows "$E2E_ACCESSIBILITY_OUTCOME"
          exit "$failed"

  gate:
    name: PR Gate
    if: ${{ always() }}
    needs:
      - preflight
      - policy
      - static
      - unit
      - linux_runtime
      - coverage_macos
      - windows_core
      - macos_e2e
      - windows_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted gate evaluator
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          # Pull requests keep the base evaluator so a PR cannot rewrite its own gate.
          # Manual dry-runs evaluate HEAD so a newly introduced lane can be dogfooded.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || needs.preflight.outputs.base }}
      - name: Setup Node
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Evaluate deterministic gate from trusted base
        shell: bash
        # Keep process environment bounded. Embedding the complete needs payload in job env includes
        # the preflight plan and exceeds Linux ARG_MAX on large diffs before checkout can start.
        env:
          PR_GATE_EXECUTION_MODE: bundles
          PR_GATE_PLAN: ${{ needs.preflight.outputs.plan }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PR_GATE_NEEDS: '{"preflight":{"result":"${{ needs.preflight.result }}"},"policy":{"result":"${{ needs.policy.result }}"},"static":{"result":"${{ needs.static.result }}"},"unit":{"result":"${{ needs.unit.result }}"},"linux_runtime":{"result":"${{ needs.linux_runtime.result }}"},"coverage_macos":{"result":"${{ needs.coverage_macos.result }}"},"windows_core":{"result":"${{ needs.windows_core.result }}"},"macos_e2e":{"result":"${{ needs.macos_e2e.result }}"},"windows_e2e":{"result":"${{ needs.windows_e2e.result }}"}}'
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "Preflight did not succeed" >&2
            exit 1
          fi
          if [[ -f scripts/ci/evaluate-pr-gate.mjs ]]; then
            node scripts/ci/evaluate-pr-gate.mjs
            exit 0
          fi

          # Bootstrap-only strict evaluator. Future runs use the evaluator checked out from base.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const plan = JSON.parse(process.env.PR_GATE_PLAN)
          const needs = JSON.parse(process.env.PR_GATE_NEEDS)
          const conclusions = Object.fromEntries(
            Object.entries(needs).map(([bundle, value]) => [bundle, value?.result ?? 'missing'])
          )
          const failures = []
          if (plan.schemaVersion !== 1) failures.push('unsupported plan schema')
          if (conclusions.preflight !== 'success') failures.push('preflight did not succeed')
          if (!Array.isArray(plan.bundles)) failures.push('execution bundle plan is missing')
          const selected = new Set(Array.isArray(plan.bundles) ? plan.bundles : [])
          for (const bundle of selected) {
            if (conclusions[bundle] !== 'success') {
              failures.push(bundle + ' ended with ' + (conclusions[bundle] ?? 'missing'))
            }
          }
          for (const [bundle, conclusion] of Object.entries(conclusions)) {
            if (
              bundle !== 'preflight' &&
              !selected.has(bundle) &&
              conclusion !== 'success' &&
              conclusion !== 'skipped'
            ) {
              failures.push(bundle + ' unexpectedly ended with ' + conclusion)
            }
          }
          const summary =
            '## PR Gate\n\nResult: **' +
            (failures.length === 0 ? 'pass' : 'fail') +
            '**\n\n- Selected lanes: ' +
            plan.lanes.join(', ') +
            '\n- Execution bundles: ' +
            [...selected].join(', ') +
            '\n\n### Failures\n\n' +
            (failures.length === 0 ? '- None' : failures.map((failure) => '- ' + failure).join('\n')) +
            '\n'
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          } else {
            process.stdout.write(summary)
          }
          if (failures.length > 0) process.exit(1)
          NODE
