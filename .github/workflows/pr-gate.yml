name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base: ${{ steps.revisions.outputs.base }}
      head: ${{ steps.revisions.outputs.head }}
      lanes: ${{ steps.classify.outputs.lanes }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Resolve changed revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_BASE_SHA"
            head_sha="$PULL_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_BASE_SHA"
            head_sha="$MERGE_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
            head_sha="$(git rev-parse HEAD)"
          else
            base_sha="$(git rev-parse HEAD)"
            head_sha="$base_sha"
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Preflight revisions must be full Git commit SHAs" >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted classifier
        id: trusted_classifier
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/pr-gate-trusted-classifier"
          mkdir -p "$trusted_dir"
          echo "dir=$trusted_dir" >> "$GITHUB_OUTPUT"

          required=(
            scripts/ci/classify-pr-changes.mjs
            scripts/ci/change-impact.json
          )
          for file in "${required[@]}"; do
            if ! git cat-file -e "${BASE_SHA}:${file}" 2>/dev/null; then
              echo "source=bootstrap" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for file in "${required[@]}"; do
            git show "${BASE_SHA}:${file}" > "$trusted_dir/${file##*/}"
          done
          echo "source=base" >> "$GITHUB_OUTPUT"

      - name: Classify change impact
        id: classify
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          TRUSTED_CLASSIFIER_DIR: ${{ steps.trusted_classifier.outputs.dir }}
          TRUSTED_CLASSIFIER_SOURCE: ${{ steps.trusted_classifier.outputs.source }}
        run: |
          set -euo pipefail
          if [[ "$TRUSTED_CLASSIFIER_SOURCE" == "base" ]]; then
            node "$TRUSTED_CLASSIFIER_DIR/classify-pr-changes.mjs" --base "$BASE_SHA" --head "$HEAD_SHA"
            exit 0
          fi

          # The introducing PR has no trusted classifier in its base. It is shadow-only, so bootstrap
          # with an explicit full plan. Once merged, every later PR executes the base revision above.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const lanes = [
            'policy',
            'docs',
            'format',
            'lint',
            'typecheck_node',
            'typecheck_web',
            'interface_contracts',
            'cli_sdk',
            'unit_linux',
            'coverage_macos',
            'windows_runtime',
            'windows_path',
            'unit_renderer',
            'build',
            'e2e_functional_macos',
            'e2e_functional_windows',
            'e2e_workspace_macos',
            'e2e_workspace_windows',
            'e2e_accessibility_macos',
            'e2e_accessibility_windows',
            'e2e_visual_macos'
          ]
          const plan = {
            schemaVersion: 1,
            mode: 'full',
            roots: ['bootstrap'],
            lanes,
            reasonChains: ['trusted base classifier unavailable -> bootstrap -> full']
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            'plan=' + JSON.stringify(plan) + '\nlanes=' + JSON.stringify(lanes) + '\n'
          )
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## PR Gate preflight\n\n- Mode: **full**\n- Roots: bootstrap\n- Selected lanes: ' +
                lanes.join(', ') +
                '\n\n### Reason chains\n\n- `trusted base classifier unavailable -> bootstrap -> full`\n'
            )
          }
          NODE

  policy:
    name: PR policy
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'policy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Validate pull request policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          POLICY_SCOPE: commits
        run: node scripts/ci/check-pr-policy.mjs

  docs:
    name: Documentation
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'docs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install formatting toolchain
        run: npm ci --ignore-scripts

      - name: Check Markdown formatting
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind markdown

  format:
    name: Format
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'format') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind non-markdown

  lint:
    name: Lint
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'lint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck_node:
    name: Typecheck node
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'typecheck_node') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck node
        run: npm run typecheck:node

  typecheck_web:
    name: Typecheck web
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'typecheck_web') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web
        run: npm run typecheck:web

  interface_contracts:
    name: Interface contract baseline (shadow)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'interface_contracts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check web API map
        run: npm run check:web-api-map
      - name: Test existing cross-process contracts
        run: npx vitest run src/preload/index.test.ts src/shared/web-rpc-contract.test.ts

  cli_sdk:
    name: CLI and SDK
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'cli_sdk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test CLI and SDK
        run: npx vitest run cli packages/open-science
      - name: Check CLI package
        run: npm run check:cli-package

  unit_linux:
    name: Unit Linux (advisory during shadow rollout)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'unit_linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test complete portable suite
        continue-on-error: true
        run: npm test

  coverage_macos:
    name: Coverage macOS
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'coverage_macos') }}
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5
          if-no-files-found: warn

  windows_runtime:
    name: Windows runtime
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'windows_runtime') }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Windows-specific behavior
        run: >-
          npx vitest run
          src/main/windows.test.ts
          src/main/windows-icon-assets.test.ts
          src/main/windows-powershell.test.ts
          src/main/file-save.test.ts
          src/main/specialist/repository.test.ts
          src/main/notebook/micromamba-cache-powershell.test.ts
          src/main/notebook/micromamba-cache-acl.integration.test.ts
      - name: Test Windows notebook shell behavior
        run: npx vitest run src/main/notebook/windows-shell.integration.test.ts
      - name: Test Windows notebook shell service timeout
        run: >-
          npx vitest run
          src/main/notebook/runtime-service.test.ts
          --testNamePattern
          "kills a command that outlasts the timeout and returns a non-normal result"

  windows_path:
    name: Windows path portability
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'windows_path') }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Windows path portability
        run: >-
          npx vitest run
          src/main/acp/workspace-path.test.ts
          src/main/file-save.test.ts
          src/main/notebook/run-document-data-paths.test.ts
          src/main/notebook/runtime-paths.test.ts
          src/main/session-persistence/conversation-export.test.ts
          src/main/session-persistence/data-path-roundtrip.test.ts
          src/main/settings/notebook-runtime-settings.test.ts
          src/main/settings/preferences.test.ts
          src/main/settings/shell-path.test.ts
          src/main/specialist/repository.test.ts
          src/main/storage/data-path.test.ts
          src/main/storage/normalize-legacy-paths.test.ts
          src/main/storage/path-presence.test.ts
          --maxWorkers=1
          --testTimeout=30000
          --hookTimeout=30000

  unit_renderer:
    name: Renderer unit
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'unit_renderer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Renderer
        run: npx vitest run src/renderer

  build:
    name: Build macOS
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'build') }}
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build desktop and web applications
        run: npm run build:e2e && npm run build:web

  e2e_functional_macos:
    name: Electron functional E2E (macOS)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_functional_macos') }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run functional journeys
        run: npm run test:e2e:journey
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_functional_windows:
    name: Electron functional E2E (Windows)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_functional_windows') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run functional journeys
        run: npm run test:e2e:journey
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-e2e-windows-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_workspace_macos:
    name: Electron workspace E2E (macOS)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_workspace_macos') }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run workspace journeys
        run: npm run test:e2e:workspace
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_workspace_windows:
    name: Electron workspace E2E (Windows)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_workspace_windows') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run workspace journeys
        run: npm run test:e2e:workspace
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-e2e-windows-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_accessibility_macos:
    name: Electron accessibility (macOS)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_accessibility_macos') }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run accessibility checks
        run: npm run test:e2e:accessibility
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_accessibility_windows:
    name: Electron accessibility (Windows)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_accessibility_windows') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run accessibility checks
        run: npm run test:e2e:accessibility
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-windows-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  e2e_visual_macos:
    name: Electron visual regression (macOS)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.lanes), 'e2e_visual_macos') }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron application
        run: npm run build:e2e
      - name: Run visual regression
        run: npm run test:e2e:visual
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

  gate:
    name: PR Gate
    if: ${{ always() }}
    needs:
      - preflight
      - policy
      - docs
      - format
      - lint
      - typecheck_node
      - typecheck_web
      - interface_contracts
      - cli_sdk
      - unit_linux
      - coverage_macos
      - windows_runtime
      - windows_path
      - unit_renderer
      - build
      - e2e_functional_macos
      - e2e_functional_windows
      - e2e_workspace_macos
      - e2e_workspace_windows
      - e2e_accessibility_macos
      - e2e_accessibility_windows
      - e2e_visual_macos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PR_GATE_NEEDS: ${{ toJSON(needs) }}
      PR_GATE_PLAN: ${{ needs.preflight.outputs.plan }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
    steps:
      - name: Checkout trusted gate evaluator
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || needs.preflight.outputs.base }}
      - name: Setup Node
        if: ${{ needs.preflight.result == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Evaluate deterministic gate from trusted base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "Preflight did not succeed" >&2
            exit 1
          fi
          if [[ -f scripts/ci/evaluate-pr-gate.mjs ]]; then
            node scripts/ci/evaluate-pr-gate.mjs
            exit 0
          fi

          # Bootstrap-only strict evaluator. Future runs use the evaluator checked out from base.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const plan = JSON.parse(process.env.PR_GATE_PLAN)
          const needs = JSON.parse(process.env.PR_GATE_NEEDS)
          const conclusions = Object.fromEntries(
            Object.entries(needs).map(([lane, value]) => [lane, value?.result ?? 'missing'])
          )
          const failures = []
          if (plan.schemaVersion !== 1) failures.push('unsupported plan schema')
          if (conclusions.preflight !== 'success') failures.push('preflight did not succeed')
          const selected = new Set(plan.lanes)
          for (const lane of plan.lanes) {
            if (conclusions[lane] !== 'success') {
              failures.push(lane + ' ended with ' + (conclusions[lane] ?? 'missing'))
            }
          }
          for (const [lane, conclusion] of Object.entries(conclusions)) {
            if (
              lane !== 'preflight' &&
              !selected.has(lane) &&
              conclusion !== 'success' &&
              conclusion !== 'skipped'
            ) {
              failures.push(lane + ' unexpectedly ended with ' + conclusion)
            }
          }
          const summary =
            '## PR Gate\n\nResult: **' +
            (failures.length === 0 ? 'pass' : 'fail') +
            '**\n\n- Selected lanes: ' +
            plan.lanes.join(', ') +
            '\n\n### Failures\n\n' +
            (failures.length === 0 ? '- None' : failures.map((failure) => '- ' + failure).join('\n')) +
            '\n'
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          } else {
            process.stdout.write(summary)
          }
          if (failures.length > 0) process.exit(1)
          NODE
