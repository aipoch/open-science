name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Focused no-side-effect validation plan
        required: false
        default: classified
        type: choice
        options:
          - classified
          - unit-coverage
          - module-coverage
          - i18n
          - runtime-bundle
          - windows-e2e
          - windows-process
          - e2e
          - source-regressions
          - macos-smoke
      comparison_base_sha:
        description: Test-selection diff base for module-coverage (full SHA; runs dispatch ref)
        type: string
      comparison_head_sha:
        description: Test-selection diff head (full SHA; only CI files may differ from dispatch ref)
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base: ${{ steps.revisions.outputs.base }}
      head: ${{ steps.revisions.outputs.head }}
      lanes: ${{ steps.classify.outputs.lanes }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Resolve changed revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRY_RUN_MODE: ${{ inputs.dry_run || 'classified' }}
          INPUT_COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          INPUT_COMPARISON_HEAD_SHA: ${{ inputs.comparison_head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_BASE_SHA"
            head_sha="$PULL_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            # The group head stacks every queued PR ahead of this one. Classify the whole
            # combined revision against the protected branch tip it will land on, not
            # against merge_group.base_sha, which is the previous queue entry's head.
            if [[ ! "$MERGE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid merge-group head SHA" >&2
              exit 1
            fi
            git check-ref-format "$MERGE_BASE_REF"
            git fetch --no-tags origin "$MERGE_BASE_REF"
            head_sha="$MERGE_HEAD_SHA"
            base_sha="$(git merge-base --all FETCH_HEAD "$head_sha")"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Merge group must have exactly one merge base with its target branch" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "module-coverage" ]]; then
            base_sha="$INPUT_COMPARISON_BASE_SHA"
            head_sha="$INPUT_COMPARISON_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
            head_sha="$(git rev-parse HEAD)"
          else
            base_sha="$(git rev-parse HEAD)"
            head_sha="$base_sha"
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Preflight revisions must be full Git commit SHAs" >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "module-coverage" ]]; then
            # Replay the original selection using updated CI code, never a different application.
            # Checking out comparison head would discard the runner fix being validated.
            git merge-base --is-ancestor "$head_sha" HEAD
            if ! git diff --quiet "$head_sha" HEAD -- . ':!scripts/ci/**' ':!.github/**'; then
              echo "Module dry-run dispatch ref must match comparison head outside CI files" >&2
              exit 1
            fi
          fi
          # Keep policy at the current trusted base, but classify only the PR contribution.
          trusted_base_sha="$base_sha"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$(git merge-base --all "$base_sha" "$head_sha")"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "PR must have exactly one merge base" >&2
              exit 1
            fi
          fi
          echo "trusted-base=$trusted_base_sha" >> "$GITHUB_OUTPUT"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted classifier
        id: trusted_classifier
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.trusted-base }}
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/pr-gate-trusted-classifier"
          mkdir -p "$trusted_dir"
          echo "dir=$trusted_dir" >> "$GITHUB_OUTPUT"

          required=(
            scripts/ci/module-impact-authority.mjs
            scripts/ci/module-impact-shadow.mjs
            scripts/ci/module-test-impact.mjs
            scripts/ci/module-impact.json
            scripts/ci/validate-module-impact.mjs
            scripts/ci/classify-pr-changes.mjs
            scripts/ci/change-impact.json
          )
          for file in "${required[@]}"; do
            if ! git cat-file -e "${BASE_SHA}:${file}" 2>/dev/null; then
              echo "source=bootstrap" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for file in "${required[@]}"; do
            git show "${BASE_SHA}:${file}" > "$trusted_dir/${file##*/}"
          done
          # Older trusted bases predate the loader; retain their original classifier.
          if git cat-file -e "${BASE_SHA}:scripts/ci/load-module-impact.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/load-module-impact.mjs" > "$trusted_dir/load-module-impact.mjs"
            # Materialize the trusted manifest through its reader. Never execute candidate code.
            BASE_SHA="$BASE_SHA" TRUSTED_DIR="$trusted_dir" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const { loadModuleImpactManifestAtRevision } = await import(
            pathToFileURL(join(process.env.TRUSTED_DIR, 'load-module-impact.mjs')).href
          )
          const manifest = loadModuleImpactManifestAtRevision(process.env.BASE_SHA)
          writeFileSync(join(process.env.TRUSTED_DIR, 'module-impact.json'), JSON.stringify(manifest))
          NODE
          fi
          echo "source=base" >> "$GITHUB_OUTPUT"

      - name: Classify change impact
        id: classify
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          DRY_RUN_MODE: ${{ inputs.dry_run || 'classified' }}
          PR_GATE_PLATFORM_POLICY: risk-v1
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          TRUSTED_CLASSIFIER_DIR: ${{ steps.trusted_classifier.outputs.dir }}
          TRUSTED_CLASSIFIER_SOURCE: ${{ steps.trusted_classifier.outputs.source }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "macos-smoke" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:macos-smoke"],"lanes":["policy","build","e2e_smoke_macos"],"bundles":["policy","macos_e2e"],"macosProfile":"smoke","macosGroups":["journeys"],"reasonChains":["focused single-runner macOS smoke"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","build","e2e_smoke_macos"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "module-coverage" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:module-coverage"],"lanes":["policy","unit_macos"],"bundles":["policy","unit"],"macosProfile":"smoke","reasonChains":["workflow_dispatch module-coverage -> portable module shards and merged coverage"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","unit_macos"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "unit-coverage" ]]; then
            plan='{"schemaVersion":1,"mode":"full","roots":["manual:unit-coverage"],"lanes":["policy","unit_macos"],"bundles":["policy","unit"],"reasonChains":["workflow_dispatch unit-coverage -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","unit_macos"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '## PR Gate preflight' \
              '' \
              '- Mode: **full (focused dry-run)**' \
              '- Selected lanes: policy, unit_macos' \
              '- Execution bundles: policy, unit' \
              '' \
              '### Reason chains' \
              '' \
              '- `workflow_dispatch unit-coverage -> focused dry-run`' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "i18n" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:i18n"],"lanes":["policy","i18n"],"bundles":["policy","static"],"reasonChains":["workflow_dispatch i18n -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","i18n"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '## PR Gate preflight' \
              '' \
              '- Mode: **selective (focused dry-run)**' \
              '- Selected lanes: policy, i18n' \
              '- Execution bundles: policy, static' \
              '' \
              '### Reason chains' \
              '' \
              '- `workflow_dispatch i18n -> focused dry-run`' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "runtime-bundle" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:runtime-bundle"],"lanes":["policy","runtime_bundle"],"bundles":["policy","static"],"reasonChains":["workflow_dispatch runtime-bundle -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","runtime_bundle"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '## PR Gate preflight' \
              '' \
              '- Mode: **selective (focused dry-run)**' \
              '- Selected lanes: policy, runtime_bundle' \
              '- Execution bundles: policy, static' \
              '' \
              '### Reason chains' \
              '' \
              '- `workflow_dispatch runtime-bundle -> focused dry-run`' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "source-regressions" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:source-regressions"],"lanes":["policy","e2e_regressions_macos","e2e_delegation_macos"],"bundles":["policy","macos_e2e"],"macosGroups":["regressions","delegation"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","e2e_regressions_macos","e2e_delegation_macos"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "e2e" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:e2e"],"lanes":["policy","build","e2e_functional_macos","e2e_workspace_macos","e2e_accessibility_macos","e2e_visual_macos","e2e_functional_windows","e2e_workspace_windows","e2e_browser_windows"],"bundles":["policy","macos_e2e","windows_e2e"],"macosGroups":["journeys","presentation"],"reasonChains":["workflow_dispatch e2e -> real desktop jobs and renderer pilot"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo "lanes=$(node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1]).lanes))' "$plan")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "windows-process" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:windows-process"],"lanes":["policy","windows_runtime"],"bundles":["policy","windows_core"],"reasonChains":["workflow_dispatch windows-process -> delegated native process ownership dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","windows_runtime"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## PR Gate preflight' '' '- Focused dry-run: delegated Windows process ownership' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_MODE" == "windows-e2e" ]]; then
            plan='{"schemaVersion":1,"mode":"selective","roots":["manual:windows-e2e"],"lanes":["policy","e2e_functional_windows","e2e_workspace_windows","e2e_browser_windows"],"bundles":["policy","windows_e2e"],"reasonChains":["workflow_dispatch windows-e2e -> focused dry-run"]}'
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo 'lanes=["policy","e2e_functional_windows","e2e_workspace_windows","e2e_browser_windows"]' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## PR Gate preflight' '' '- Focused dry-run: Windows E2E shards' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$TRUSTED_CLASSIFIER_SOURCE" == "base" ]]; then
            node "$TRUSTED_CLASSIFIER_DIR/module-impact-authority.mjs" --base "$BASE_SHA" --head "$HEAD_SHA"
            exit 0
          fi

          # The introducing PR has no trusted classifier in its base. Bootstrap with a strict full
          # plan so the stable gate still fails closed until the trusted implementation is available.
          # Pull requests never allocate desktop E2E runners here; that policy lives in the classifier.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const pullRequest = process.env.EVENT_NAME === 'pull_request'
          const lanes = [
            'policy',
            'docs',
            'format',
            'lint',
            'typecheck_node',
            'typecheck_web',
            'interface_contracts',
            'cli_sdk',
            'i18n',
            'runtime_bundle',
            'unit_macos',
            'linux_runtime',
            'windows_runtime',
            'windows_path',
            ...(pullRequest
              ? []
              : [
                  'build',
                  'e2e_functional_macos',
                  'e2e_functional_windows',
                  'e2e_workspace_macos',
                  'e2e_workspace_windows',
                  'e2e_accessibility_macos',
                  'e2e_visual_macos'
                ])
          ]
          const bundles = [
            'policy',
            'static',
            'unit',
            'linux_runtime',
            'windows_core',
            ...(pullRequest ? [] : ['macos_e2e', 'windows_e2e'])
          ]
          const plan = {
            schemaVersion: 1,
            mode: 'full',
            roots: ['bootstrap'],
            lanes,
            bundles,
            reasonChains: ['trusted base classifier unavailable -> bootstrap -> full']
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            'plan=' + JSON.stringify(plan) + '\nlanes=' + JSON.stringify(lanes) + '\n'
          )
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## PR Gate preflight\n\n- Mode: **full**\n- Roots: bootstrap\n- Selected lanes: ' +
                lanes.join(', ') +
                '\n- Execution bundles: ' +
                bundles.join(', ') +
                '\n\n### Reason chains\n\n- `trusted base classifier unavailable -> bootstrap -> full`\n'
            )
          }
          NODE

  policy:
    name: PR policy
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'policy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ needs.preflight.outputs.base }}
          fail-on-severity: high
          fail-on-scopes: runtime, development
          head-ref: ${{ needs.preflight.outputs.head }}
          license-check: false
          show-openssf-scorecard: false
      - name: Validate pull request policy
        env:
          # Preflight already narrowed merge groups to the target branch tip, so the migration set
          # is validated across every queued change rather than only the trailing entry.
          BASE_SHA: ${{ github.event.pull_request.base.sha || needs.preflight.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.preflight.outputs.head || github.sha }}
          POLICY_SCOPE: commits
        run: node scripts/ci/check-pr-policy.mjs

  static:
    name: Static checks
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'static') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check GitHub Actions correctness
        id: actionlint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --show-error --silent \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Keep this gate scoped to workflow YAML, expressions, and action schemas. Optional
          # ShellCheck/Pyflakes integrations vary with runner images and have separate baselines.
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
      - name: Audit GitHub Actions security with zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-confidence: high
          min-severity: medium
          version: v1.30.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Check Markdown formatting
        id: docs
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'docs') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind markdown
      - name: Check formatting
        id: format
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'format') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: node scripts/ci/check-changed-format.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --kind non-markdown
      - name: Lint
        id: lint
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'lint') }}
        continue-on-error: true
        run: npm run lint -- --concurrency auto
      - name: Typecheck node and web
        id: typechecks
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_node') || contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_web') }}
        continue-on-error: true
        shell: bash
        env:
          RUN_TYPECHECK_NODE: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_node') }}
          RUN_TYPECHECK_WEB: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'typecheck_web') }}
        run: |
          set -uo pipefail
          failed=0
          node_outcome=skipped
          web_outcome=skipped
          node_log="$RUNNER_TEMP/typecheck-node.log"
          web_log="$RUNNER_TEMP/typecheck-web.log"

          if [[ "$RUN_TYPECHECK_NODE" == "true" ]]; then
            npm run typecheck:node >"$node_log" 2>&1 &
            node_pid=$!
          fi
          if [[ "$RUN_TYPECHECK_WEB" == "true" ]]; then
            npm run typecheck:web >"$web_log" 2>&1 &
            web_pid=$!
          fi

          if [[ "$RUN_TYPECHECK_NODE" == "true" ]]; then
            if wait "$node_pid"; then node_outcome=success; else node_outcome=failure; failed=1; fi
            echo "::group::Typecheck node"
            cat "$node_log"
            echo "::endgroup::"
          fi
          if [[ "$RUN_TYPECHECK_WEB" == "true" ]]; then
            if wait "$web_pid"; then web_outcome=success; else web_outcome=failure; failed=1; fi
            echo "::group::Typecheck web"
            cat "$web_log"
            echo "::endgroup::"
          fi

          echo "node=$node_outcome" >> "$GITHUB_OUTPUT"
          echo "web=$web_outcome" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Check complete module ownership and consumer evidence
        # Full portable shards already run these guards. Selective source plans must also
        # detect newly introduced imports that make their checked-in consumer evidence stale.
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') && fromJSON(needs.preflight.outputs.plan).mode != 'full' }}
        run: npx vitest run scripts/ci/audit-module-ownership.test.ts scripts/ci/module-consumer-coverage.test.ts
      - name: Check interface contract baseline (shadow)
        id: interface_contracts
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'interface_contracts') }}
        continue-on-error: true
        env:
          RUN_DEDICATED_TESTS: ${{ fromJSON(needs.preflight.outputs.plan).mode != 'full' || !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: |
          npm run check:web-api-map
          # Full portable shards already execute these tests. Keep the map check in this lane.
          if [[ "$RUN_DEDICATED_TESTS" == "true" ]]; then
            npx vitest run \
              src/preload/index.test.ts \
              src/preload/electron-renderer-contract-adapter.test.ts \
              src/shared/renderer-contract.test.ts \
              src/shared/renderer-contract-catalog.test.ts \
              src/shared/renderer-surface-inventory.test.ts \
              src/shared/renderer-surface-matrix.test.ts \
              src/shared/web-rpc-contract.test.ts
          fi
      - name: Test CLI and SDK
        id: cli_sdk
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'cli_sdk') }}
        continue-on-error: true
        env:
          RUN_DEDICATED_TESTS: ${{ fromJSON(needs.preflight.outputs.plan).mode != 'full' || !contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
        run: |
          if [[ "$RUN_DEDICATED_TESTS" == "true" ]]; then
            npx vitest run cli packages/open-science
          fi
          npm run check:cli-package
      - name: Check i18n catalog
        id: i18n
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'i18n') }}
        continue-on-error: true
        run: npx vitest run src/renderer/src/i18n/resources.test.ts
      - name: Verify published runtime bundle
        id: runtime_bundle
        # Trusted-base classification cannot name a lane that does not exist on main yet, so the
        # introducing PR's full plan would otherwise skip this check. After merge, version-file
        # changes select the overlay lane; full plans keep fail-closed CDN coverage.
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'runtime_bundle') || fromJSON(needs.preflight.outputs.plan).mode == 'full' }}
        continue-on-error: true
        run: node scripts/verify-runtime-bundle.mjs linux-64 osx-arm64 osx-64 win-64
      - name: Enforce selected static checks
        if: ${{ always() }}
        shell: bash
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          CLI_SDK_OUTCOME: ${{ steps.cli_sdk.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          I18N_OUTCOME: ${{ steps.i18n.outcome }}
          INTERFACE_CONTRACTS_OUTCOME: ${{ steps.interface_contracts.outcome }}
          RUNTIME_BUNDLE_OUTCOME: ${{ steps.runtime_bundle.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_NODE_OUTCOME: ${{ steps.typechecks.outputs.node }}
          TYPECHECKS_OUTCOME: ${{ steps.typechecks.outcome }}
          TYPECHECK_WEB_OUTCOME: ${{ steps.typechecks.outputs.web }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check actionlint "$ACTIONLINT_OUTCOME"
          check docs "$DOCS_OUTCOME"
          check format "$FORMAT_OUTCOME"
          check lint "$LINT_OUTCOME"
          check typecheck_node "$TYPECHECK_NODE_OUTCOME"
          check typecheck_web "$TYPECHECK_WEB_OUTCOME"
          check typechecks "$TYPECHECKS_OUTCOME"
          check interface_contracts "$INTERFACE_CONTRACTS_OUTCOME"
          check cli_sdk "$CLI_SDK_OUTCOME"
          check i18n "$I18N_OUTCOME"
          check runtime_bundle "$RUNTIME_BUNDLE_OUTCOME"
          exit "$failed"

  unit_shard:
    name: Portable tests (Ubuntu, shard ${{ matrix.shard }}/4)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || fromJSON(needs.preflight.outputs.plan).mode == 'full' || !contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos')) }}
    runs-on: ubuntu-latest
    env:
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
      VITEST_PORTABLE_CI: '1'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test complete suite shard
        id: unit_macos_shard
        if: ${{ fromJSON(needs.preflight.outputs.plan).mode == 'full' || !contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos') }}
        continue-on-error: true
        # The static lane owns the i18n catalog guard. Real Linux and macOS sandbox behavior runs
        # in platform jobs with the required native dependencies, so do not duplicate those files.
        run: >-
          npx vitest run
          --coverage
          --coverage.reporter=text-summary
          --testTimeout=30000
          --shard=${{ matrix.shard }}/4
          --reporter=dot
          --reporter=blob
          --reporter=github-actions
          --outputFile=vitest-reports/blob-${{ matrix.shard }}.json
      - name: Test affected Module shard
        id: unit_macos_related_shard
        if: ${{ fromJSON(needs.preflight.outputs.plan).mode == 'selective' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos') }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        run: >-
          npm run test:affected -- --base "$BASE_SHA" --head "$HEAD_SHA" --coverage-changed "$BASE_SHA" --
          --coverage.reporter=text-summary
          --testTimeout=30000
          --shard=${{ matrix.shard }}/4
          --reporter=dot
          --reporter=blob
          --reporter=github-actions
          --outputFile=vitest-reports/blob-${{ matrix.shard }}.json
      - name: Upload full-suite blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-portable-blob-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 1
          if-no-files-found: error
      - name: Enforce full-suite shard
        if: ${{ always() }}
        shell: bash
        env:
          UNIT_MACOS_SHARD_OUTCOME: ${{ steps.unit_macos_shard.outcome }}
          UNIT_MACOS_RELATED_SHARD_OUTCOME: ${{ steps.unit_macos_related_shard.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$UNIT_MACOS_SHARD_OUTCOME" != "success" && "$UNIT_MACOS_RELATED_SHARD_OUTCOME" != "success" ]]; then
            echo "unit_macos_shard ended with $UNIT_MACOS_SHARD_OUTCOME" >&2
            echo "unit_macos_related_shard ended with $UNIT_MACOS_RELATED_SHARD_OUTCOME" >&2
            failed=1
          fi
          exit "$failed"

  unit:
    name: Module tests and coverage
    needs: [preflight, unit_shard]
    if: ${{ always() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'unit') }}
    # PR and queue module coverage is portable. Darwin-only checks run inside the queue core job.
    # Manual plans retain their explicitly selected native runner.
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || needs.unit_shard.result != 'skipped' || fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke') && 'ubuntu-latest' || 'macos-14' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: ${{ needs.unit_shard.result == 'skipped' }}
        run: node scripts/ci/npm-ci.mjs
      - name: Install report merge dependencies
        if: ${{ needs.unit_shard.result != 'skipped' }}
        run: node scripts/ci/npm-ci.mjs --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Test affected Modules
        id: unit_macos_related
        if: ${{ needs.unit_shard.result == 'skipped' && fromJSON(needs.preflight.outputs.plan).mode == 'selective' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos') }}
        continue-on-error: true
        env:
          VITEST_PORTABLE_CI: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke') && '1' || '0' }}
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        # The module graph selects owner, contract, and consumer tests. Coverage remains scoped to
        # changed sources without handing test discovery back to Vitest's static --changed graph.
        run: npm run test:affected -- --base "$BASE_SHA" --head "$HEAD_SHA" --coverage-changed "$BASE_SHA"
      - name: Download full-suite blob reports
        if: ${{ needs.unit_shard.result != 'skipped' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unit-portable-blob-*
          path: vitest-reports
          merge-multiple: true
      - name: Merge full-suite reports and coverage
        id: unit_macos_full
        # The shard job covers both full plans and trusted pre-migration selective plans that select
        # the unit bundle without unit_macos. Merge once so thresholds see the complete suite.
        if: ${{ needs.unit_shard.result != 'skipped' && (fromJSON(needs.preflight.outputs.plan).mode == 'full' || !contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos')) }}
        continue-on-error: true
        # Blob reports retain their source test paths. The merge reconstructs coverage without
        # discovering or executing tests again, so coverage thresholds remain authoritative.
        run: npx vitest run --merge-reports=vitest-reports --coverage --passWithNoTests
      - name: Merge Module reports and coverage
        id: unit_macos_related_merge
        if: ${{ needs.unit_shard.result != 'skipped' && fromJSON(needs.preflight.outputs.plan).mode == 'selective' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'unit_macos') }}
        continue-on-error: true
        env:
          VITEST_PORTABLE_CI: '1'
          BASE_SHA: ${{ needs.preflight.outputs.base }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
        # Enforce changed-source thresholds only after all partial coverage maps are combined.
        run: npm run test:affected -- --base "$BASE_SHA" --head "$HEAD_SHA" --coverage-changed "$BASE_SHA" -- --merge-reports=vitest-reports --passWithNoTests
      - name: Upload Module coverage report
        if: ${{ always() && (steps.unit_macos_related.outcome != 'skipped' || steps.unit_macos_full.outcome != 'skipped' || steps.unit_macos_related_merge.outcome != 'skipped') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5
          if-no-files-found: warn
      - name: Enforce selected unit checks
        if: ${{ always() }}
        shell: bash
        env:
          UNIT_MACOS_FULL_OUTCOME: ${{ steps.unit_macos_full.outcome }}
          UNIT_MACOS_RELATED_OUTCOME: ${{ steps.unit_macos_related.outcome }}
          UNIT_MACOS_RELATED_MERGE_OUTCOME: ${{ steps.unit_macos_related_merge.outcome }}
          UNIT_MACOS_SHARDS_RESULT: ${{ needs.unit_shard.result }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check unit_macos_related "$UNIT_MACOS_RELATED_OUTCOME"
          check unit_macos_related_merge "$UNIT_MACOS_RELATED_MERGE_OUTCOME"
          check unit_macos_full "$UNIT_MACOS_FULL_OUTCOME"
          check unit_macos_shards "$UNIT_MACOS_SHARDS_RESULT"
          if [[ "$UNIT_MACOS_RELATED_OUTCOME" == "skipped" && "$UNIT_MACOS_FULL_OUTCOME" == "skipped" && "$UNIT_MACOS_RELATED_MERGE_OUTCOME" == "skipped" ]]; then
            echo "Selected unit bundle did not execute a Module-test path" >&2
            failed=1
          fi
          exit "$failed"

  linux_runtime:
    name: Linux Notebook isolation
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'linux_runtime') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Install Linux sandbox dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap

          apparmor_userns_restriction="$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          )"
          if [[ "$apparmor_userns_restriction" == "1" ]]; then
            profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -r "$profile_source"
            sudo install -m 0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

          bwrap --unshare-all --ro-bind / / -- /bin/true
      - name: Test real Linux filesystem and network isolation
        run: >-
          npx vitest run --project process
          packages/notebook-network-sandbox/src/filesystem-enforcement.integration.test.ts
          packages/notebook-network-sandbox/src/network-enforcement.integration.test.ts
          src/main/session-plan/plan-context-file.shell.integration.test.ts

  windows_core:
    name: Windows core
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'windows_core') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Test delegated Windows process ownership
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') }}
        run: >-
          npx vitest run
          src/main/process-tree.windows.integration.test.ts
          src/main/delegation/process-ownership.test.ts
          src/main/delegation/production-composition.test.ts
          --maxWorkers=1
          --testTimeout=30000
          --hookTimeout=30000
      - name: Test Windows sandbox native source
        id: windows_sandbox_source
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        run: cargo test --locked --manifest-path packages/notebook-network-sandbox/vendor/windows-src/Cargo.toml
      - name: Build Windows sandbox native host
        id: windows_sandbox_build
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        run: node packages/notebook-network-sandbox/vendor/windows/build.mjs x64
      - name: Upload rebuilt Windows sandbox native host
        if: ${{ steps.windows_sandbox_build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-sandbox-host-x64
          path: packages/notebook-network-sandbox/vendor/windows/x64/notebook-appcontainer-host.exe
          retention-days: 5
          if-no-files-found: error
      - name: Test Windows-specific behavior
        id: windows_runtime
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        run: >-
          npx vitest run
          scripts/ci/run-windows-browser-diagnostics.test.ts
          scripts/windows-updater-certification.test.ts
          src/main/windows.test.ts
          src/main/windows-icon-assets.test.ts
          src/main/windows-powershell.test.ts
          src/main/delegation/acp-execution.test.ts
          src/main/delegation/production-framework-runtime.test.ts
          src/main/file-save.test.ts
          src/main/specialist/repository.test.ts
          src/main/notebook/micromamba-cache-powershell.test.ts
          src/main/notebook/micromamba-cache-acl.integration.test.ts
      - name: Test Windows wheel evidence recovery
        id: windows_wheel_evidence
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        shell: pwsh
        env:
          RUN_KERNEL: '1'
        run: |
          $env:OPEN_SCIENCE_TEST_PYTHON = python -c "import sys, pip, ensurepip; print(sys.executable)"
          if ($LASTEXITCODE -ne 0 -or -not $env:OPEN_SCIENCE_TEST_PYTHON) { throw 'Python with pip and ensurepip is required for wheel evidence tests.' }
          npm test -- src/main/notebook/pip-wheel-evidence.test.ts src/main/notebook/pip-install-evidence.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows notebook shell behavior
        id: windows_shell
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/notebook/windows-shell.integration.test.ts
          src/main/notebook/powershell-search-parser.windows.test.ts
          src/main/notebook/shell-search-scope.test.ts
      - name: Test Windows notebook shell service timeout
        id: windows_service_timeout
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/notebook/runtime-service.test.ts
          --testNamePattern
          "kills a command that outlasts the timeout and returns a non-normal result"
      - name: Test Windows AppContainer ownership and removal lifecycle
        id: windows_sandbox
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_runtime') && inputs.dry_run != 'windows-process' && steps.windows_sandbox_source.outcome == 'success' && steps.windows_sandbox_build.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: >-
          packages/notebook-network-sandbox/vendor/windows-src/ci/smoke.ps1
          -Exe packages/notebook-network-sandbox/vendor/windows/x64/notebook-appcontainer-host.exe
      - name: Test Windows path portability
        id: windows_path
        if: ${{ contains(fromJSON(needs.preflight.outputs.plan).lanes, 'windows_path') }}
        continue-on-error: true
        run: >-
          npx vitest run
          src/main/acp/workspace-path.test.ts
          src/main/file-save.test.ts
          src/main/notebook/run-document-data-paths.test.ts
          src/main/notebook/runtime-paths.test.ts
          src/main/session-persistence/conversation-export.test.ts
          src/main/session-persistence/data-path-roundtrip.test.ts
          src/main/settings/notebook-runtime-settings.test.ts
          src/main/settings/preferences.test.ts
          src/main/settings/shell-path.test.ts
          src/main/specialist/repository.test.ts
          src/main/storage/data-path.test.ts
          src/main/storage/normalize-legacy-paths.test.ts
          src/main/storage/path-presence.test.ts
          --maxWorkers=1
          --testTimeout=30000
          --hookTimeout=30000
      - name: Enforce selected Windows core checks
        if: ${{ always() }}
        shell: bash
        env:
          WINDOWS_PATH_OUTCOME: ${{ steps.windows_path.outcome }}
          WINDOWS_RUNTIME_OUTCOME: ${{ steps.windows_runtime.outcome }}
          WINDOWS_SANDBOX_BUILD_OUTCOME: ${{ steps.windows_sandbox_build.outcome }}
          WINDOWS_SANDBOX_OUTCOME: ${{ steps.windows_sandbox.outcome }}
          WINDOWS_SANDBOX_SOURCE_OUTCOME: ${{ steps.windows_sandbox_source.outcome }}
          WINDOWS_SERVICE_TIMEOUT_OUTCOME: ${{ steps.windows_service_timeout.outcome }}
          WINDOWS_SHELL_OUTCOME: ${{ steps.windows_shell.outcome }}
          WINDOWS_WHEEL_EVIDENCE_OUTCOME: ${{ steps.windows_wheel_evidence.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "$1 ended with $2" >&2
              failed=1
            fi
          }
          check windows_runtime "$WINDOWS_RUNTIME_OUTCOME"
          check windows_sandbox_source "$WINDOWS_SANDBOX_SOURCE_OUTCOME"
          check windows_sandbox_build "$WINDOWS_SANDBOX_BUILD_OUTCOME"
          check windows_sandbox "$WINDOWS_SANDBOX_OUTCOME"
          check windows_wheel_evidence "$WINDOWS_WHEEL_EVIDENCE_OUTCOME"
          check windows_shell "$WINDOWS_SHELL_OUTCOME"
          check windows_service_timeout "$WINDOWS_SERVICE_TIMEOUT_OUTCOME"
          check windows_path "$WINDOWS_PATH_OUTCOME"
          exit "$failed"

  macos_e2e_setup:
    name: Prepare macOS E2E
    needs: preflight
    if: ${{ !(fromJSON(needs.preflight.outputs.plan).macosProfile == 'smoke' || (fromJSON(needs.preflight.outputs.plan).macosProfile == 'expanded' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'e2e_smoke_macos'))) && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.plan).bundles, 'macos_e2e') }}
    runs-on: macos-14
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      node_version: ${{ steps.node.outputs.node-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Build Electron application
        run: npm run build:e2e
      - name: Build web application
        run: npm run build:web
      - name: Test snapshot transport
        run: npx vitest run scripts/ci/e2e-setup-snapshot.test.ts
      - name: Pack E2E setup
        run: node scripts/ci/e2e-setup-snapshot.mjs pack "$RUNNER_TEMP/e2e-setup"
      - name: Upload E2E setup
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-setup-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-setup/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows_e2e_setup:
