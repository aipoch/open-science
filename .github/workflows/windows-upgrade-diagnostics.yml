name: Windows Upgrade Diagnostics

# Maintained diagnostic tools only. No release, signing, or required-gate changes.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-upgrade-diagnostics.yml'
      - 'scripts/windows-upgrade-diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Exercise native process observation
        run: node --test scripts/windows-upgrade-diagnostics/observer.node-test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upgrade-observer-evidence
          path: test-results/upgrade-diagnostics
          if-no-files-found: error
          retention-days: 7

  account-preflight:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        probe: [basic, wininet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Observe isolated ordinary-user environment
        shell: powershell
        run: ./scripts/windows-upgrade-diagnostics/run-in-standard-account.ps1 -OutputDirectory evidence -Probe '${{ matrix.probe }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upgrade-account-${{ matrix.probe }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
