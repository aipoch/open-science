name: CI failure dry-run
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Existing repository commit to verify
        default: aba5a41a
        required: true
        type: string
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci/npm-ci.mjs
      - name: Verify mirror isolation on the Release runner
        run: npx vitest run scripts/ci/mirror-channel-publication.test.ts --maxWorkers=1
      - name: Reproduce catalog and source scans with coverage
        if: always()
        run: >-
          npx vitest run src/main/literature/catalog-capacity.test.ts
          src/renderer/src/i18n/resources.test.ts
          src/main/storage-root-routing.architecture.test.ts
          src/main/settings/backend-route-planner.architecture.test.ts
          src/main/settings/backend-selection-owner.architecture.test.ts
          src/main/settings/provider-auth-lifecycle.architecture.test.ts
          src/main/settings/provider-runtime-projection.architecture.test.ts
          src/main/settings/provider-transport-owner.architecture.test.ts
          --coverage --coverage.reporter=text-summary
