name: Qualify reversible macOS staging
on:
  push:
    branches: [perf/macos-update-handoff]
permissions:
  actions: read
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        scenario: [shipit, owner, rollback]
        arch: [x64, arm64]
        include:
          - { arch: x64, os: macos-15-intel }
          - { arch: arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0203c93ac87d12a8eed8cb445a05f0e42275a3c6
          path: timing
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Retrieve the signed candidate and published target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          mkdir feed candidate
          gh release download v1.3.2 -R "$GITHUB_REPOSITORY" -D feed -p latest-mac.yml -p "*-mac-$ARCH.zip"
          for i in {1..80}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/44882032087/artifacts" --jq '.artifacts[].name' | grep -Fxq "macos-$ARCH"; then break; fi
            sleep 30
          done
          gh run download 44882032087 -R "$GITHUB_REPOSITORY" -n "macos-$ARCH" -D candidate
      - name: Run isolated signed scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed" "$RUNNER_TEMP/tools"
          ditto -xk "$RUNNER_TEMP/candidate/aipoch-open-science-1.3.1-mac-$ARCH.zip" "$RUNNER_TEMP/seed"
          export ZOD="$RUNNER_TEMP/seed/Open-Science.app/Contents/Resources/backend/node_modules/zod"
          export DRIVER="$RUNNER_TEMP/tools/driver.cjs" PROBE="$RUNNER_TEMP/tools/probe.mjs"
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund esbuild@0.25.12
          mkdir -p "$RUNNER_TEMP/tools/node_modules/@aipoch"
          ln -s "$RUNNER_TEMP/seed/Open-Science.app/Contents/Resources/backend/node_modules/@aipoch/process-tree-native" "$RUNNER_TEMP/tools/node_modules/@aipoch/process-tree-native"
          bash scripts/validation/mac-reversible/build.sh
          python3 scripts/validation/mac-reversible/setup.py
          node --check "$PROBE"
          python3 scripts/validation/mac-reversible/run.py "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reversible-${{ matrix.arch }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/measurements
          retention-days: 7
