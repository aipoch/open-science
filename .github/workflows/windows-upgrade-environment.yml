name: Windows upgrade account diagnostic (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the isolated ordinary-user environment
        shell: pwsh
        run: |
          ./scripts/diagnostics/pr3599/run-as-standard-user.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE" -CurrentDirectory "$env:GITHUB_WORKSPACE" -PreviousDirectory "$env:GITHUB_WORKSPACE" -OutputDirectory "$env:GITHUB_WORKSPACE\evidence" -EnvironmentOnly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr3599-isolated-account
          path: evidence
          if-no-files-found: error
          retention-days: 14
