name: Diag v0.28.0 Windows startup

# DIAGNOSTIC-ONLY: temporary branch diag/v028-startup-repro; never merge.
# Reproduces the packaged Windows smoke startup failure with unstripped error output.
on:
  workflow_dispatch:
  push:
    branches:
      - diag/v028-startup-repro

permissions: {}

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (unpackaged)
        run: npm run build:e2e

      - name: Launch unpackaged app headless
        run: node scripts/diag-launch.mjs

      - name: Package (dir)
        run: npx electron-builder --win --dir

      - name: Launch packaged (win-unpacked) app headless
        run: node scripts/diag-launch.mjs --packaged
