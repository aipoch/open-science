name: Diag v0.28.0 Windows startup

# DIAGNOSTIC-ONLY: temporary branch diag/v028-startup-repro; never merge.
# Builds the Windows installer from this branch (whose src/main/index.ts prints the unstripped
# startup error) and runs the real windows-installer-smoke against it.
on:
  workflow_dispatch:
  push:
    branches:
      - diag/v028-startup-repro

permissions: {}

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage notebook runtime resources
        shell: bash
        run: |
          export MICROMAMBA_VERSION=$(node -p "require('./scripts/micromamba-versions.json').version")
          primary_path="resources/bin/win/x64/micromamba.exe"
          node scripts/fetch-micromamba.mjs win-64 "$primary_path"
          compatibility_path="resources/bin/win/x64/micromamba-compat.exe"
          node scripts/fetch-micromamba.mjs win-64 "$compatibility_path" compatibility
          "$primary_path" --version
          "$compatibility_path" --version

      - name: Build Windows sandbox native host
        run: node packages/notebook-network-sandbox/vendor/windows/build.mjs x64

      - name: Build Windows installer
        run: npx electron-vite build && npx electron-builder --win --x64

      - name: Run the real Windows installer smoke
        run: node scripts/windows-installer-smoke.mjs --installer-dir dist
