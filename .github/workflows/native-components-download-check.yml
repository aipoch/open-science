name: Verify published native components

# Read-only acceptance after publication and catalog update. Never compile or publish substitutes
# for missing artifacts: each target must download the bytes selected by the candidate catalog.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Download ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: win32-x64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install verification dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-0 libdbus-1-3
      - name: Verify fresh CDN downloads
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.EXPECTED_TARGET)"
          test ! -d node_modules/.cache/native-components
          node scripts/native-components.mjs
      - name: Test downloaded native interfaces
        shell: bash
        run: |
          node --test packages/credential-identity-probe-native/test/*.test.cjs
          node --test packages/process-tree-native/test/*.cjs
          node -e "require('./packages/process-tree-native'); require('./packages/safe-file-publisher-native')"
