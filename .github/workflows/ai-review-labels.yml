name: PR Labels

# Classification and stale-label operations run from the base branch with a write-capable token. Review
# outcome labels are applied by the final job in ai-review-single.yml from that run's published
# output.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  reset_review_labels:
    name: Reset review outcome labels
    # A title edit does not change the reviewed commit, so outcome labels survive 'edited'.
    if: ${{ github.event_name == 'pull_request_target' && github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    # Label operations on a pull request require pull-requests write; the label REST endpoints
    # return 403 with only issues write (GitHub reports "issues=write; pull_requests=write").
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove stale review outcome labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            // 'ready-to-merge' goes stale once new commits arrive. 'ai-reviewed' is the retired
            // predecessor label; removing it here cleans up pull requests that still carry it.
            for (const name of ['ready-to-merge', 'ai-reviewed']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  # Keep this job ID and its existing write scopes: CI Integrity rejects target-workflow
  # permission expansion. Classification never checks out or executes contributor code.
  apply_type_labels:
    name: Apply PR type and size labels
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
          (github.event.action != 'edited' || github.event.changes.title) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-classification-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Synchronize type and size labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { posix } = require('node:path');
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            const target = { ...repo, issue_number };
            const dryRun = process.env.LABELS_DRY_RUN === 'true';
            // context.sha is the trusted base revision for pull_request_target.
            const { data: catalogFile } = await github.rest.repos.getContent({
              ...repo, path: '.github/labels.json', ref: context.sha,
            });
            const catalog = JSON.parse(Buffer.from(catalogFile.content, 'base64').toString('utf8'));
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: issue_number });
            if (pr.state !== 'open') return;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: issue_number, per_page: 100,
            });
            const { data: latest } = await github.rest.pulls.get({ ...repo, pull_number: issue_number });
            if (latest.state !== 'open' || latest.head.sha !== pr.head.sha ||
                latest.base.sha !== pr.base.sha || latest.title !== pr.title ||
                latest.changed_files !== pr.changed_files) {
              core.warning('Pull request changed during classification; leaving labels for the next run.');
              return;
            }
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...target, per_page: 100,
            });
            const currentNames = new Set(current.map(({ name }) => name));
            const typeLabels = catalog.filter(label => label.type);
            const typePattern = `(${typeLabels.map(label => label.type).join('|')})`;
            const type = pr.title.match(new RegExp(`^${typePattern}(\\([^)]*\\))?!?:`))?.[1] ??
              pr.head.ref.match(new RegExp(`^${typePattern}/`))?.[1];
            const desired = new Set(typeLabels.filter(label => label.type === type).map(label => label.name));
            const complete = files.length === pr.changed_files;
            if (complete) {
              const ignored = new Set(['package-lock.json', 'npm-shrinkwrap.json', 'pnpm-lock.yaml', 'yarn.lock', 'uv.lock']);
              const changes = files.filter(file => !ignored.has(posix.basename(file.filename)))
                .reduce((sum, file) => sum + file.additions + file.deletions, 0);
              const buckets = [[10, 'XS'], [30, 'S'], [100, 'M'], [500, 'L'], [1000, 'XL'], [Infinity, 'XXL']];
              desired.add(`size:${buckets.find(([limit]) => changes < limit)[1]}`);
            } else {
              // GitHub caps listFiles at 3,000. Remove stale file-derived labels, never guess.
              core.warning('Incomplete changed-file list; clearing size labels until a complete run.');
            }
            const managed = new Set(catalog.filter(label => label.type || label.name.startsWith('size:'))
              .map(label => label.name));
            const add = [...desired].filter(name => !currentNames.has(name));
            const remove = [...currentNames].filter(name => managed.has(name) && !desired.has(name));
            core.info(JSON.stringify({ dryRun, add, remove }));
            if (dryRun) return;
            // Catalog sync owns colors/descriptions. Heal missing definitions without changing others.
            for (const name of add) {
              try {
                await github.rest.issues.getLabel({ ...repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                const { color, description } = catalog.find(label => label.name === name);
                try {
                  await github.rest.issues.createLabel({ ...repo, name, color, description });
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  // Only tolerate a real creation race, not an arbitrary validation error.
                  await github.rest.issues.getLabel({ ...repo, name });
                }
              }
            }
            // Add first; failed additions must not erase the previous classification.
            // Never use setLabels: human and AI-review writers own the other labels concurrently.
            if (add.length) await github.rest.issues.addLabels({ ...target, labels: add });
            for (const name of remove) {
              try {
                await github.rest.issues.removeLabel({ ...target, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
