name: Publish research narration CDN assets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without writing to the CDN
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: research-narration-cdn-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: narration CDN
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      S3_PREFIX: ${{ vars.S3_PREFIX }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install and build catalog dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/patch-package/index.js --error-on-fail
          node scripts/build-dev-packages.mjs --packages=research-film,resilient-download
      - name: Stage and verify all platform assets
        run: |
          node scripts/publish-narration-assets.mjs stage
          node scripts/publish-narration-assets.mjs verify
      - name: Upload verified bundle manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-narration-manifest
          path: out/research-narration/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure AWS credentials
        if: ${{ !inputs.dry_run }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
        run: |
          aws configure set aws_access_key_id "$S3_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$S3_SECRET_ACCESS_KEY"
          aws configure set default.region "$S3_REGION"
      - name: Publish immutable narration assets
        if: ${{ !inputs.dry_run }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: node scripts/publish-narration-assets.mjs publish
