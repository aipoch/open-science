name: Signed shared-service upgrade acceptance
on:
  push:
    branches: [test/shared-service-update-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  exercise:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage signed release pair and isolated driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/feed" "$HOME/Applications" evidence
          gh run download 42383836649 -n macos-arm64 -D "$RUNNER_TEMP/source"
          gh release download v1.1.0 -p '*-mac-arm64.zip' -p 'arm64-mac.yml' -D "$RUNNER_TEMP/feed"
          ditto -x -k "$(find "$RUNNER_TEMP/source" -name '*-mac-arm64.zip' -print -quit)" "$HOME/Applications"
          app="$HOME/Applications/Open-Science.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          codesign -dvv "$app/Contents/Resources/backend/desktop-service-launcher" 2>&1 | grep -Fx 'TeamIdentifier=87G9WFU9H3'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.0.9
          npm install --prefix scripts/shared-service-acceptance --no-save playwright@$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')
          cp "$RUNNER_TEMP/feed/arm64-mac.yml" "$RUNNER_TEMP/feed/latest-mac.yml"
      - name: Exercise Desktop, CLI, Web and native update
        run: |
          python3 -m http.server 18765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/feed" >/tmp/feed.log 2>&1 &
          node scripts/shared-service-acceptance/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-shared-service-upgrade
          path: evidence
